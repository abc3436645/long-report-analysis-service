schema_version: 1
id: financial_due_diligence
title: 财务公司授信评审
version: "0.3.3"
subject_model: credit_application_and_business_unit
time_model: evaluation_date
inputs:
  - {id: application, required: true, kinds: [docx, pdf, txt, jpg, jpeg, png]}
  - {id: financials, required: false, kinds: [xlsx, csv, pdf, txt, jpg, jpeg, png]}
  - {id: professional_records, required: false, kinds: [pdf, docx, txt]}
  - {id: external_credit_results, required: false, kinds: [pdf, docx, txt]}
retrieval: {enabled: false, task_refs: [enterprise_events]}
external_services:
  ocr: {enabled: true, service_ref: somark_ocr, capability: document.ocr, contract_version: 1}
ingestion:
  ocr: {service_slot: ocr, when: unread_pages, mode: auto, sync_max_pages: 3}
outline: outline.yaml
analysis: analysis.yaml
quality: quality.yaml
template: templates/default-v0.2.0.docx
presentation:
  annotations: word_comments
  body_font: 仿宋
  heading_font: 仿宋
  latin_font: 仿宋
  allow_font_fallback: false
  amount_display:
    table_unit: 万元
    chart_unit: 万元
    text_unit: 万元
    text_large_unit: 亿元
    text_large_threshold: "100000000"
    decimal_places: 2
  cover:
    title_template: 关于{business_unit}{credit_amount}综合授信调查报告
    amount_selector: application_credit_amount
    amount_unit: 亿元
    missing_amount: 授信额度待核实
    timezone: Asia/Shanghai
    fields:
    - {label: 呈报部门, source: prepared_by, default: XXXX}
    - {label: 客户经理, source: account_manager, default: XXXX}
    - {label: 呈报时间, source: run_date}
  styles:
    Title: {font: 仿宋, font_size_pt: 26}
    Heading 1: {font: 仿宋, font_size_pt: 15}
    Heading 2: {font: 仿宋, font_size_pt: 14}
    Normal: {font: 仿宋, font_size_pt: 14}
  table_styles:
    compact: {font: 仿宋, font_size_pt: 10.5}
delivery: {required_formats: [md, docx], optional_formats: [pdf]}
business_definitions:
  credit_policy: null
  professional_source_provider: null
  grade_term_mapping: null
definition_missing: [credit_policy, professional_source_provider, grade_term_mapping]
overridable_fields:
  retrieval.enabled: {type: boolean}
