- id: conclusion
  title: 第九章 综合结论
  display_order: 9
  repeat_for: null
  subheadings:
  - 一、调查结论
  - 二、授信方案
  goal: 基于本轮第七章信用结论和第八章授信要素形成有据提请意见及七项授信方案，保持前文经营偿债证据、方案值、身份和条件一致。
  questions:
  - 一、调查结论：第七章信用状态及第八章需求测算、还款和要素建议共同支持什么提请意见，金额用途期限是什么；经营合作及集团部署依据、风险程度与剩余条件是否相称，未决及反向事实是否保留？
  - 二、授信方案：是否按借款人、授信种类、授信期限、授信金额、还款来源、授信范围、担保方式七项顺序逐行列示，取值与第七八章及提请意见同身份口径；未知项、重要定价用途条件是否保留，种类范围及收入回款是否分清？
  - 综合意见是否清楚承接前文已证优势、主要约束、缓释及前置条件，能回溯依据且未首次引入新事实，没有用样本肯定结论或全部交流程确认替代本次判断？
  - 重大结论能否回指经营现金事实、制度条款和结果状态，测算版本未决、评级未审定及还款约束是否仍进入本章而非只藏批注？
