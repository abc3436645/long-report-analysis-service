fixed: true
sections:
- id: company
  title: 第一章 公司基本情况
  display_order: 1
  repeat_for: null
  subheadings:
  - 一、工商信息
  - 二、背景情况
  - 三、基本组织机构情况
  - 四、股权、股东及投资情况
  - 五、对外投资情况
  - 六、法人代表及主要管理人情况
  goal: 确认主体、治理和控制关系，评价沿革、股东资源、投资及团队形成的能力与优势，并识别责任和管理约束。
  questions:
  - 一、工商信息：登记、存续及业务范围与申请主体是否一致，资本字段与本次事项、基准和材料限制是否清楚？
  - 二、背景情况：设立、出资、增资、并购如何形成当前经营与融资需求，近期规模依据是什么？
  - 三、基本组织机构情况：治理与业务、财务、风控职责如何安排，组织设置与有效执行的证据能否区分？
  - 四、股权、股东及投资情况：股权结构及控制依据是什么，逐户股东资源、实际支持与担保责任有何区别？
  - 五、对外投资情况：投资层级、持股、出资义务及子公司资金往来如何影响范围、产能和偿债？
  - 六、法人代表及主要管理人情况：是否逐人撰写法人、经营及财务负责人的教育专业、职称、相关任职起止时间及单位岗位、现职和兼任履历，哪些经历支持管理能力与连续性，个别人员缺件如何单独披露？
  - 各节是否先呈现本单位已核情况，再形成主体、治理、资源及团队的具体判断，而非仅写资料限制和通用提醒？
  evidence_refs:
  - application_record
  - professional_record
  analysis_refs:
  - risk_review
  required_subsections:
    四、股权、股东及投资情况:
    - {title: （一）股权结构, content: table}
    - {title: （二）股东简介、持股情况, content: narrative}
  required_tables:
  - subheading: 一、工商信息
    columns: [项目, 内容]
    required_fields: [企业名称, 统一社会信用代码, 法人代表, 成立日期, 有效期, 注册资本, 实收资本, 注册地址, 经营范围]
    style: compact
  - subheading: 四、股权、股东及投资情况
    child_heading: （一）股权结构
    columns: [排名, 股东名称, 认缴资本（万元）, 持股比例（%）]
    total_row:
      label_column: 股东名称
      label: 合计
      blank_columns: [排名]
      sum_columns: [认缴资本（万元）, 持股比例（%）]
  required_assets: []
  depends_on: []
- id: operations
  title: 第二章 公司运营情况
  display_order: 2
  repeat_for: null
  subheadings:
  - 一、主营业务情况
  - 二、主营产销情况
  - 三、原料采购、产品销售情况
  goal: 充分了解真实业务模式、供销履约及订单，评价经营质量、竞争优势、改善潜力与稳定性，同时识别经营和周转风险。
  questions:
  - 一、主营业务情况：产品用途、产能工艺及盈利模式如何连接，母子公司、自营和受托加工是否分清，在建项目还有哪些投入与资金需求？
  - 二、主营产销情况：分产品多期产量销量、收入成本及毛利如何变化，量价结构、库存与套保解释有哪些证据？
  - 三、原料采购、产品销售情况：供应商客户的集中、关联、定价、账期和实际回款如何形成经营现金占用及风险？
  - 主营产能产销表、主营收入成本表、主要供应商表和主要客户表是否齐备，每张表后是否用具体数据解释业务成因、能力及优势、制约风险，而非仅列数或提示待核？
  - 上下游及关联公司承担什么交易角色，单户及集团占比、账期、供货及回款履约和替代性如何影响经营，合同、在手订单与历史销售能否区分并支持生产交付和订单持续性判断？
  - 业务模式、量价收益与现金链是否适配本单位，表中主要业务贡献和结构变化是否实质进入章内经营判断，哪些能力已有证据、哪些持续条件仍受限？
  evidence_refs:
  - application_record
  - financial_record
  - professional_record
  analysis_refs:
  - risk_review
  required_assets: [主营产能产销表, 主营收入成本表, 主要供应商表, 主要客户表]
  depends_on:
  - company
- id: financials
  title: 第三章 公司财务情况
  display_order: 3
  repeat_for: null
  subheadings:
  - 资产负债表
  - 利润表：
  - 现金流量表：
  - 财务比率及分析
  goal: 在可比及可追溯口径下综合评价盈利质量、成本效率、资产运营、现金兑现和偿债能力，识别财务优势、改善及潜在危险。
  questions:
  - 资产负债表：哪些科目因金额大、变动大或性质重要而入选，货币资金、应收、其他应收及其他应付、存货、长期股权投资及负债应如何下钻并联系偿债？
  - 利润表：收入成本、费用利息、减值、投资及公允价值损益如何形成利润，主业收益是否依赖套保或非经常项目？
  - 现金流量表：经营、投资、筹资净额为何变化，负经营现金流是否有回款证据，资金来源与到期支付是否匹配？
  - 财务比率及分析：盈利、营运、偿债、持续经营四组指标如何相互验证，公式、年化及同比口径是否明确，反向信号是否影响结论？
  - 基础四表及触发的明细表是否齐备，重点选择理由是否清楚，稳定的大额余额、下降项目、重分类及结算转换有无漏查，原因证据和未取得明细的影响是否说明？
  - 每张主表、科目明细、比率及口径桥接表后是否有专属解读，关键金额占比、对手方能力及账期能否与供销订单、资产变现、主业盈利和经营现金互证，哪些经营基础成立且仍有什么约束？
  - 收入成本、费用及主要损益如何形成利润，盈利营运偿债及持续经营四组正文是否引用可解释的指标数值作判断，口径差异是否仅限制相关结论而未替代整章分析？
  evidence_refs:
  - application_record
  - financial_record
  analysis_refs:
  - risk_review
  required_assets: [资产负债表, 利润表, 现金流量表, 财务比率表]
  depends_on:
  - operations
- id: financing
  title: 第四章 外部融资情况
  display_order: 4
  repeat_for: null
  subheadings: []
  goal: 评价融资渠道、历史履约与资金组织能力及其对经营的支持，核对实际可用空间、到期续接和潜在支付压力。
  questions:
  - 各机构两期授信、已用、未用及合计如何变化，未用额度有哪些提款条件、共享限制或续期不确定性？
  - 流贷、银承、信用证、保证金及敞口如何对应，融资记录与征信和报表的时点、范围差异能否解释？
  - 短债到期、融资集中、还本付息及历史合作情况对流动性和本次续授信有何影响，哪些结论仍缺证据？
  - 机构授信用信两期对比表是否完整，有口径差异时是否用融资口径对照表解释到品种、保证金、主体范围及具体记录时点？
  - 每张融资及对照表后是否解释机构和品种占比、可提款及续接条件、债务到期与采购付款和销售回款的匹配，融资安排对经营稳定的实际支持及剩余风险有何依据？
  - 总额与机构变化、可用空间消耗及已兑现支持是否解释到具体金额和条件，最终对融资可获得性与周转接续能作出什么范围的判断？
  evidence_refs:
  - application_record
  - financial_record
  - professional_record
  analysis_refs:
  - risk_review
  required_assets: [机构授信用信两期对比表]
  depends_on:
  - financials
- id: industry
  title: 第五章 行业情况及行业地位
  display_order: 5
  repeat_for: null
  subheadings:
  - 一、公司所处行业情况
  - 二、主要行业政策
  - 三、企业优势及行业地位
  goal: 结合行业供需、政策和竞争位置，评价本单位已兑现优势、需求承接与发展潜力，以及适用条件和竞争合规风险。
  questions:
  - 一、公司所处行业情况：产业链、供需、产品技术分层、区域和定价机制如何影响本单位经营？
  - 二、主要行业政策：当前适用文件、条款及范围是什么，对产品产线准入、环保能耗及经营投入有什么具体影响？
  - 三、企业优势及行业地位：资源、产能工艺、客户区位等优势有何证据，排名份额的年份、口径与可比性是否成立？
  - 行业竞争格局表是否按维度、现状、趋势及公司影响展开，供需利用率、集中度及加工费利润等比较有无混用产品、地域和年份？
  - 每张行业、政策及同业等补充表后是否联系本公司产品、上下游及订单作出解读，资源技术、质量交付、客户及区位优势如何转化为真实收益或现金，承接需求的能力及限制是什么？
  - 行业政策与内部授信制度是否分清，已证实的具体优势与未知的行业排名是否分别评价，资源到实际经营效果的证据链是否完整？
  evidence_refs:
  - application_record
  - professional_record
  analysis_refs:
  - risk_review
  required_assets: [行业竞争格局表]
  depends_on:
  - operations
- id: risks
  title: 第六章 风险评价和风控措施
  display_order: 6
  repeat_for: null
  subheadings:
  - 一、行业竞争、加工费下行风险
  - 二、市场价格波动风险
  - 三、应收账款坏账风险
  - 四、财务与流动性风险
  goal: 将具体发现转成有证据和传导依据的风险评价，核实已有能力与控制的缓释效果，识别剩余暴露并提出针对性策略。
  questions:
  - 一、行业竞争、加工费下行风险：供需、加工费、产品结构和产能利用变化如何压缩收益，现有措施及条件性建议是否有据？
  - 二、市场价格波动风险：点价、库存、套保匹配、基差与保证金需求还留下哪些价格和资金风险？
  - 三、应收账款坏账风险：客户集中、关联、账龄逾期与期后回款能否支持信用风险判断，催收及限额措施是否已执行？
  - 四、财务与流动性风险：受限现金、杠杆、短债票据、关联占用及建设投入如何形成支付压力，缓释后还存何种风险？
  - 担保或有事项、关联交易、诉讼负面事件、在建项目及控制措施分别落在哪个固定小节，缺口、不适用及复评条件是否说明？
  - 每项风险能否回指前文具体数据或事件，已暴露问题、潜在因素与证据缺口是否区分，措施是否作用于实际履约、回款、敞口或到期环节而非仅要求补件？
  evidence_refs:
  - application_record
  - financial_record
  - professional_record
  analysis_refs:
  - risk_review
  required_assets: []
  depends_on:
  - financials
  - financing
  - industry
- id: credit
  title: 第七章 信用能力评估
  display_order: 7
  repeat_for: null
  subheadings:
  - 一、信用评级
  - 二、征信情况
  - 三、涉诉情况
  goal: 核对正式评级及真实履约、征信和涉诉，评价信用基础及其约束和预警，不自行评级或以缺资料认定能力低。
  questions:
  - 一、信用评级：正式评级主体、财报期、政策版本、得分等级及有效期是什么，评分明细和上期比较是否有来源？
  - 二、征信情况：查询及覆盖期间、贷款担保、逾期欠息和违约记录支持什么范围的结论，与融资章有何差异？
  - 三、涉诉情况：哪些来源实际查询过，案件身份、标的、审理执行状态及经营影响是什么，无记录结论有何限制？
  - 已取得结果时是否实质解释正式等级、正常履约及案件影响，未取得部分是否单独限定，并与经营财务、风险及后续授信要素保持一致？
  evidence_refs:
  - application_record
  - professional_record
  - external_credit_record
  analysis_refs:
  - risk_review
  - external_result_check
  required_assets: []
  depends_on:
  - company
  - financing
- id: terms
  title: 第八章 授信要素评估
  display_order: 8
  repeat_for: null
  subheadings:
  - 一、授信额度
  - 二、授信期限
  - 三、担保方式
  - 四、授信利率
  - 五、借款用途
  - 六、还款来源
  goal: 逐要素核对权威结果及适用政策，将经营需求、实际融资和还款现金与条件性审查建议相连。
  questions:
  - 一、授信额度：申请、存量、模型结果、建议及批准各是什么，测算底稿和真实周转需求如何支撑建议及差异？
  - 二、授信期限：正式等级与适用映射支持什么上限，本次期限与单笔贷款及回款周期如何区分和匹配？
  - 三、担保方式：本次方式的政策资格、覆盖及可实现性有何依据，已生效担保与待落实条件是否分清？
  - 四、授信利率：适用议定方案或定价文件、版本与条件是什么，未明确的定价依据有何影响？
  - 五、借款用途：订单采购及结算计划如何证明真实经营支付需求，是否存在建设投资或关联转借等用途差异？
  - 六、还款来源：销售货款何时可收回，扣除经营占用及其他到期支付后有何现金支撑，股东支持是否可落实？
  - 六类要素是否逐项按当前值与身份、来源及经营合理性、审查意见及未决条件组织，结果齐备与不足时的判断是否分别明确，未把规则说明当成要素评估？
  evidence_refs:
  - application_record
  - financial_record
  - professional_record
  - external_credit_record
  analysis_refs:
  - risk_review
  - external_result_check
  required_assets: []
  depends_on:
  - risks
  - credit
- id: conclusion
  title: 第九章 综合结论
  display_order: 9
  repeat_for: null
  subheadings:
  - 一、调查结论
  - 二、授信方案
  goal: 客观综合经营及其他能力、优势潜力、主要风险和缓释条件，说明经营质量与优质基础或风险关注方向，并承接有依据的审查意见和方案。
  questions:
  - 一、调查结论：经营基础、资金需求、偿债风险、缓释及重大限制是否共同支持提请意见，未决条件是否保留？
  - 二、授信方案：借款人、种类、金额、期限、来源、范围及担保与第八章和权威结果是否一致，建议与批准是否分清？
  - 综合意见是否清楚承接前文已证优势、主要约束、缓释及前置条件，能回溯依据且未首次引入新事实，没有用样本肯定结论或全部交流程确认替代本次判断？
  evidence_refs:
  - application_record
  - professional_record
  - external_credit_record
  analysis_refs:
  - risk_review
  - external_result_check
  required_assets: []
  depends_on:
  - terms
planning_guidance:
- 按真实交付样本固定九章及各章二级标题、编号、原文标点和顺序；固定的是呈现结构，正文依据仍按本轮材料确定。
- 每轮 draft plan 提交本配置 sections；不得另加执行摘要、证据附录或替换七章历史参考目录。范围、评价基准和重大限制在首章及结论就地披露，来源随正文引用。
- 正文用 Markdown 二级标题承载 subheadings；缺材料也保留标题并写明限制或补件，明确不适用须有依据。第四章无二级标题，不补造小节。
- 第三章的四个未编号同级内容标题按原文保留；（一）类三级标题随本轮实际分析规划，不升级为固定二级标题。
- 第六章四类风险标题按用户标准固定，风险适用性仍须逐项审查；非加工主体不能套用加工费结论，其他适用风险在相关小节内补充三级标题。
- 样本还提供逐章分析定位、论证顺序和材料深度参考，写作读取analysis.writing_guidance对应章及通用指引；企业名称、金额、人员、评级、期限、政策条文和测算公式不作为通用业务事实或算法。
- 逐章回答questions，第二至第五章按required_assets及analysis.writing_guidance中的同章tables指引落实基础表格，按materiality_selection筛选金额大、变动大或性质重要科目并补明细和原因分析；整表缺失须具名披露影响及材料需求，不静默略过。
- required_assets声明写作及独立审阅的基础表内容，不是新增机械门禁；期间列、主要对手方数量及触发明细随本轮材料规划，既有required_tables工商和股权表契约继续执行，其他科目未入选仍交代理由。
- 各章执行analysis.writing_guidance中的business_adaptation、report_expression和cross_chapter_consistency：按当前公司识别业务模式及证据分支，逐节形成局部判断，跨章保持事实和方案身份一致，不将样本公司答案或写作检查语句当成正文。
