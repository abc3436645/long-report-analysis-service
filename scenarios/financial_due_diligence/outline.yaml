- id: terms
  title: 第八章 授信要素评估
  display_order: 8
  repeat_for: null
  subheadings:
  - 一、授信额度
  - 二、授信期限
  - 三、担保方式
  - 四、授信利率
  - 五、借款用途
  - 六、还款来源
  goal: 按用户明确公式测算营运资金与贷款缺口，结合经营信用债务提出有据额度建议；逐要素核对适用政策、已有结果和条件，保留审批身份。
  questions:
  - 一、授信额度：是否用本轮实际输入及程序按两步公式计算营运资金量和贷款缺口，口径精度及资金扣除是否可核；结合营收预测、财务现金、股权支持、产品市场和营运能力、征信及债务后建议多少，如何解释申请、存量、测算、建议与批准的身份和差异？
  - 二、授信期限：本次等级身份及适用授信管理办法支持什么最长年限，结合经营现金和回款周期具体建议多久；授信有效期、单笔贷款、分期还本及起算条件如何区分，评级或政策未确认影响什么？
  - 三、担保方式：本次申请与建议采用何种方式，信用方式的等级及政策资格是否齐备；如需保证抵质押，其提供方、覆盖和可实现性及落实状态如何，剩余风险是什么？
  - 四、授信利率：本轮有效业务议定方案及定价文件适用谁、何产品及条件，已明确的是年利率还是执行机制；如何准确表达按方案执行和单笔落实状态，缺依据影响什么？
  - 五、借款用途：本轮公司和实际业务的哪些采购加工或日常周转由授信支持，合同订单及资金计划如何印证用途、支付路径和额度关系；拟议、公司承诺与已核事实是否分清，支付及用途监管条件是什么？
  - 六、还款来源：哪些产品服务销售货款何时成为可偿债现金，与必要支出及本息到期如何匹配；经营盈利及资产管理评价有何可比证据和反向约束，第二来源与用途反洗钱承诺的来源状态是否准确归属？
  - 六类要素是否逐项按当前值与身份、来源及经营合理性、审查意见及未决条件组织，结果齐备与不足时的判断是否分别明确，未把规则说明当成要素评估？
  - 多版本测算的均值、五类周转、预测增长、利润口径、现有贷款与其他资金扣除有何差异，公式、缓存和说明是否一致，选择依据是什么？
  - 结果表示新增缺口还是续授信总额，本财务公司存量和集团/综合授信是否重复计算，期限映射、信用准入及支付条件是否各有依据？
