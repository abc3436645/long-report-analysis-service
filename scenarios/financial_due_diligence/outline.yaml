planning_guidance:
- C09以具体授信事项为主线；先按analysis.writing_guidance.credit_decision形成五项分析底稿，再按固定九章及其依赖成文，综合能力分析服务于到期偿还、条件与剩余风险。
- 固定九章及除第六章外已声明的二级标题、编号、原文标点和顺序；第六章声明dynamic_subheadings: true而不声明subheadings，由本轮原始材料和前文分析归纳动态风险小节。
- 每轮 draft plan 提交本配置 sections；不得另加执行摘要、证据附录或替换七章历史参考目录。范围、评价基准和重大限制在首章及结论就地披露，来源随正文引用。
- 正文用 Markdown 二级标题承载 subheadings；缺材料也保留标题并写明限制或补件，明确不适用须有依据。第四章无二级标题，不补造小节。
- 第三章的四个未编号同级内容标题按原文保留；（一）类三级标题随本轮实际分析规划，不升级为固定二级标题。
- 第六章正文以独立的Markdown二级标题逐项呈现实际风险，名称、数量和顺序按证据及重要性确定；没有已识别风险时保留章名并说明核查范围与判断限制，不造空白风险标题或声称不存在风险。
- 样本还提供逐章分析定位、论证顺序和材料深度参考，写作读取analysis.writing_guidance对应章及通用指引；企业名称、金额、人员、评级、期限、政策条文和测算公式不作为通用业务事实或算法。
- 逐章回答questions，第二至第五章按required_assets及analysis.writing_guidance中的同章tables指引落实基础表格，按materiality_selection筛选金额大、变动大或性质重要科目并补明细和原因分析；整表缺失须具名披露影响及材料需求，不静默略过。
- required_assets声明写作及独立审阅的基础表内容；0.3.0启用financial_quality时校验实际表或具名缺口，旧冻结配置保留原门禁；期间列、主要对手方数量及触发明细随本轮材料规划，既有required_tables工商和股权表契约继续执行，其他科目未入选仍交代理由。
- 各章执行analysis.writing_guidance中的business_adaptation、report_expression和cross_chapter_consistency：按当前公司识别业务模式及证据分支，逐节形成局部判断，跨章保持事实和方案身份一致，不将样本公司答案或写作检查语句当成正文。
- 以analysis.writing_guidance.comprehensive_assessment统领综合尽调：主动识别本轮证据支持的能力优势与发展潜力，同时排查潜在危险，结合持续性和缓释形成客观评价；不得把全文规划成风险罗列或预设优质危险结论。
- 第七至九章同时执行制度适用、评分复核、营运资金复核、六项要素和结论追溯指引；信用等级评定表必须保留固定表头和全部行，缺值逐格标示；额度测算核对表、授信要素依据表有资料则呈表解读，无资料具名披露。第七章依赖前六章，使经营与风险发现进入信用判断。
