fixed: true
sections:
- id: company
  title: 第一章 公司基本情况
  display_order: 1
  repeat_for: null
  subheadings:
  - 一、工商信息
  - 二、背景情况
  - 三、基本组织机构情况
  - 四、股权、股东及投资情况
  - 五、对外投资情况
  - 六、法人代表及主要管理人情况
  goal: 确认主体、治理和控制关系，评价沿革、股东资源、投资及团队形成的能力与优势，并识别责任和管理约束。
  questions:
  - 一、工商信息：是否以营业执照为主、其他已核材料为补充，将九项工商信息完整列入唯一表格，经营范围不缩写；重点登记信息不实或存在重要冲突时是否在表内备注或锚定批注提示？
  - 二、背景情况：是否按公司概况、发展历程、近三年经营业绩依次成文，列全称、简称、成立时间、合资性质、股东及股权结构，逐年给出最近三个完整会计年度的营业收入和利润总额，并说明关键沿革如何形成当前业务？
  - 三、基本组织机构情况：是否依据本轮材料简要列清公司的主要部门及可核的隶属关系，不把部门介绍写成职责执行或内控有效性评价？
  - 四、股权、股东及投资情况：股权架构是否仅以固定四列表格呈现；股东简介是否逐户列明持股比例、识别有依据的控股股东，并介绍股东公司全称、简称、成立时间、主营产品和可核实的行业地位？
  - 五、对外投资情况：是否先用持股公司名称、成立日期、认缴金额（万元）、持股占比四列表格完整列示对外投资，再逐家介绍持股公司的全称、简称、成立时间及股权构成？
  - 六、法人代表及主要管理人情况：是否按人分段介绍法人、经营及财务负责人等主要人员的已知履历，写清现职、教育专业、职称、相关任职时间及单位岗位和兼任，且正文没有团队评价、管理判断、核查说明或结尾总结，缺失资料仅在锚定批注提示？
  - 除工商信息表、基本组织机构情况、对外投资情况和法人代表及主要管理人情况外，各节是否先呈现本单位已核情况，再形成主体、治理及资源的具体判断，而非仅写资料限制和通用提醒？
  evidence_refs:
  - application_record
  - professional_record
  analysis_refs:
  - risk_review
  required_subsections:
    二、背景情况:
    - {title: （一）公司概况, content: narrative}
    - {title: （二）发展历程, content: narrative}
    - {title: （三）近三年经营业绩, content: narrative}
    四、股权、股东及投资情况:
    - {title: （一）股权架构, content: table}
    - {title: （二）股东简介、持股情况, content: narrative}
  required_tables:
  - subheading: 一、工商信息
    columns: [项目, 内容]
    required_fields: [企业名称, 统一社会信用代码, 法人代表, 成立日期, 有效期, 注册资本, 实收资本, 注册地址, 经营范围]
    style: compact
  - subheading: 四、股权、股东及投资情况
    child_heading: （一）股权架构
    columns: [排名, 股东名称, 认缴资本（万元）, 持股比例（%）]
    total_row:
      label_column: 股东名称
      label: 合计
      blank_columns: [排名]
      sum_columns: [认缴资本（万元）, 持股比例（%）]
  - subheading: 五、对外投资情况
    columns: [持股公司名称, 成立日期, 认缴金额（万元）, 持股占比]
  required_assets: []
  depends_on: []
- id: operations
  title: 第二章 公司运营情况
  display_order: 2
  repeat_for: null
  subheadings:
  - 一、主营业务情况
  - 二、主营产销情况
  - 三、原料采购、产品销售情况
  goal: 充分了解真实业务模式、供销履约及订单，评价经营质量、竞争优势、改善潜力与稳定性，同时识别经营和周转风险。
  questions:
  - 一、主营业务情况：是否以已提供材料说明主要产品和服务、可核的业务线收入结构、客户与收费方式；市场规模、增长、竞争、份额及差异化、制造指标、研发技术知识产权和在建项目资金使用等侧重点是否仅在有对应资料时展开，并与后续产销和行业分析一致？
  - 二、主营产销情况：近几年及当年各产品产量、销量和主营收支如何变化；有可比期时同比、相邻同频期环比如何表现；异常升降的原因、经营影响及优势或风险判断是否有完整证据链？
  - 三、原料采购、产品销售情况：主要供应商表与主要客户表是否分开并各用规定六列表头、分别解读；前五大供应商和客户的同口径占比、客户背景与舆情、关联交易、结算账期和实际依赖是否有据；重叠、新增大客户、近期入股和控制权变更条款是否仅在有材料时分析实际影响？
  - 主营产能产销表、主营收入成本表、主要供应商表和主要客户表是否齐备，每张表后是否用具体数据解释业务成因、能力及优势、制约风险，而非仅列数或提示待核？
  - 上下游及关联公司承担什么交易角色，单户及集团占比、账期、供货及回款履约和替代性如何影响经营，合同、在手订单与历史销售能否区分并支持生产交付和订单持续性判断？
  - 业务模式、量价收益与现金链是否适配本单位，表中主要业务贡献和结构变化是否实质进入章内经营判断，哪些能力已有证据、哪些持续条件仍受限？
  evidence_refs:
  - application_record
  - financial_record
  - professional_record
  analysis_refs:
  - risk_review
  required_assets: [主营产能产销表, 主营收入成本表, 主要供应商表, 主要客户表]
  required_tables:
  - subheading: 三、原料采购、产品销售情况
    asset: 主要供应商表
    columns: [供应商名称, 产品, 采购金额（万元）, 占比, 结算方式, 账期]
  - subheading: 三、原料采购、产品销售情况
    asset: 主要客户表
    columns: [客户名称, 产品, 销售金额（万元）, 占比, 结算方式, 账期]
  depends_on:
  - company
- id: financials
  title: 第三章 公司财务情况
  display_order: 3
  repeat_for: null
  subheadings:
  - 资产负债表
  - 利润表：
  - 现金流量表：
  - 财务比率及分析
  goal: 在可比及可追溯口径下综合评价盈利质量、成本效率、资产运营、现金兑现和偿债能力，识别财务优势、改善及潜在危险。
  questions:
  - 资产负债表：是否完整列出本轮可得近几年年末及最新时点的资产、负债和所有者权益各科目及合计；货币资金、应收账款、其他应收款、其他应付款、存货、长期股权投资、负债及其他影响正常经营的项目，凡本轮材料已有相关表格是否全部输出并逐表深度解读，可核实的正向经营数据是否整理成表并解释实际效果和限制；异常情况和重大金额变化是否在正文说明或就待核事项作锚定批注，金额、成因、经营影响和偿债判断是否有完整证据链？
  - 利润表：是否完整列示本轮可得近几年完整年度及最新期间的原始利润表科目、小计与合计；收入成本、费用利息、减值、所得税、投资及公允价值损益如何形成营业利润、利润总额与净利润，主业收益是否依赖非经常项目？勾稽差异、趋势结构、同口径同行或历史偏离及跨表异常是否逐项追证并形成有边界的判断？
  - 现金流量表：是否完整列示本轮可得近几年完整年度及最新期间的原始现金流量表各项目、小计与合计；经营、投资、筹资流入流出及净额如何变化，可比期间趋势、重大异常及现金期初期末勾稽是否有证据；正向与负向经营信号如何影响真实可用现金和到期偿付，建议是否围绕已证主要问题形成有条件的方向？
  - 财务比率及分析：财务比率表是否按financial_ratio_rows完整列示盈利、营运、偿债、持续经营四组16项指标及本轮可得近几年和最新期间的数据或逐项缺口；四组是否分别结合经营、现金、债务和有来源的市场环境解读，公式、单位、年化及同比口径是否明确，正反信号和判断限制是否进入结论？
  - 基础四表及触发的明细表是否齐备，重点选择理由是否清楚，稳定的大额余额、下降项目、重分类及结算转换有无漏查，原因证据和未取得明细的影响是否说明？
  - 每张主表、科目明细、比率及口径桥接表后是否有专属解读，关键金额占比、对手方能力及账期能否与供销订单、资产变现、主业盈利和经营现金互证，哪些经营基础成立且仍有什么约束？
  - 收入成本、费用及主要损益如何形成利润，盈利营运偿债及持续经营四组正文是否引用可解释的指标数值作判断，口径差异是否仅限制相关结论而未替代整章分析？
  evidence_refs:
  - application_record
  - financial_record
  analysis_refs:
  - risk_review
  required_assets: [资产负债表, 利润表, 现金流量表, 财务比率表]
  depends_on:
  - operations
- id: financing
  title: 第四章 外部融资情况
  display_order: 4
  repeat_for: null
  subheadings: []
  goal: 评价融资渠道、历史履约与资金组织能力及其对经营的支持，核对实际可用空间、到期续接和潜在支付压力。
  questions:
  - 本轮可得近几年年末及最新时点的全部银行和其他融资机构授信、已用、未用及合计是否完整列示；融资渠道、授信有效期、单笔债务期限及到期分布如何变化，未用额度有哪些提款条件、共享限制或续期不确定性？
  - 流贷、银承、信用证、保证金及敞口如何对应，融资记录与征信和报表的时点、范围差异能否解释？
  - 短债到期、融资集中、还本付息及历史合作情况对流动性和本次续授信有何影响，哪些结论仍缺证据？
  - 机构授信用信两期对比表是否扩展覆盖全部可得历史时点和机构，授信使用、期限及来源是否明确；有口径差异时是否用融资口径对照表解释到品种、保证金、主体范围及具体记录时点？
  - 每张融资及对照表后是否解释机构和品种占比、可提款及续接条件、债务到期与采购付款和销售回款的匹配，融资安排对经营稳定的实际支持及剩余风险有何依据？
  - 总额与机构变化、可用空间消耗及已兑现支持是否解释到具体金额和条件，最终对融资可获得性与周转接续能作出什么范围的判断？
  evidence_refs:
  - application_record
  - financial_record
  - professional_record
  analysis_refs:
  - risk_review
  required_assets: [机构授信用信两期对比表]
  depends_on:
  - financials
- id: industry
  title: 第五章 行业情况及行业地位
  display_order: 5
  repeat_for: null
  subheadings:
  - 一、公司所处行业情况
  - 二、主要行业政策
  - 三、企业优势及行业地位
  goal: 结合行业供需、政策和竞争位置，评价本单位已兑现优势、需求承接与发展潜力，以及适用条件和竞争合规风险。
  questions:
  - 一、公司所处行业情况：主营产品及营运模式处于哪个细分行业和发展阶段，市场行情、上下游供需、竞争替代、产业链与区域协同如何传导到本单位订单、价格、成本、利润及现金？
  - 二、主要行业政策：国家政策、发展规划及当地政府政策的有效文件、具体条款和适用范围是什么，对本公司准入、产线、市场需求、合规投入及发展条件有何已证或有条件影响？
  - 三、企业优势及行业地位：主营产品、资源技术、上下游及产业协同有哪些已兑现经营效果，排名份额和同业比较的年份、范围与证据是否成立，优势持续条件和竞争约束是什么？
  - 行业竞争格局表是否按维度、现状、趋势及公司影响展开，供需利用率、集中度及加工费利润等比较有无混用产品、地域和年份？
  - 每张行业、政策及同业等补充表后是否联系本公司产品、上下游及订单作出解读，资源技术、质量交付、客户及区位优势如何转化为真实收益或现金，承接需求的能力及限制是什么？
  - 行业政策与内部授信制度是否分清，已证实的具体优势与未知的行业排名是否分别评价，资源到实际经营效果的证据链是否完整？
  evidence_refs:
  - application_record
  - professional_record
  analysis_refs:
  - risk_review
  required_assets: [行业竞争格局表]
  depends_on:
  - operations
- id: risks
  title: 第六章 风险评价和风控措施
  display_order: 6
  repeat_for: null
  dynamic_subheadings: true
  goal: 将具体发现转成有证据和传导依据的风险评价，核实已有能力与控制的缓释效果，识别剩余暴露并提出针对性策略。
  questions:
  - 小节是否从本轮原始材料及前文已核发现归纳，按影响和紧迫性命名排序，而非照搬预设风险类别；同一风险的多条线索是否合并追溯？
  - 经营现金、本息到期、盈利质量、客户合同、资产回收、治理关联、合规税务、行业市场、财务信息及适用项目风险的分析边界和证据是否明确？
  - 担保或有事项、关联交易、诉讼负面事件、在建项目及控制措施是否按实际传导归入对应动态小节，缺口、不适用及复评条件是否说明？
  - 每项风险能否回指前文具体数据或事件，已暴露问题、潜在因素与证据缺口是否区分，措施是否作用于实际履约、回款、敞口或到期环节而非仅要求补件？
  - 是否按重要性在章首突出最关键的3至5项实际风险（不足时不凑数），并按risk_item_fields统一记录事实、影响、发生可能性、风险等级、措施和剩余风险；评价依据、责任时点、监测触发及对授信意见的影响是否可追溯？
  evidence_refs:
  - application_record
  - financial_record
  - professional_record
  analysis_refs:
  - risk_review
  required_assets: []
  depends_on:
  - financials
  - financing
  - industry
- id: credit
  title: 第七章 信用能力评估
  display_order: 7
  repeat_for: null
  subheadings:
  - 一、信用评级
  - 二、征信情况
  - 三、涉诉情况
  goal: 依据本轮适用计分规则和公司证据形成可复核初评，核对正式评级、履约及征信涉诉；区分计算建议与审定，不以缺资料认定能力低。
  questions:
  - 一、信用评级：是否始终输出信用等级评定表，按固定四列表头及七项指标、合计和等级行完整列示；标准分是否取适用计分附件，得分是否根据规则及公司证据计算并可复核，等级是否按评级办法和附加限制映射且标明初评或审定，缺项是否逐格披露？
  - 二、征信情况：本轮征信报告的主体、出具查询及覆盖时点是否明确，当前与历史借贷、担保、逾期欠息等记录如何；合同约定与实际还本付息等履约行为能否相互印证，综合评价及限制是否有证据，与融资和债务情况是否一致？
  - 三、涉诉情况：用户原材料及实际取得的企查查、天眼查、中国裁判文书网、中国执行信息公开网等记录支持哪些案件事实，主体及查询覆盖如何；去重后案件角色、金额性质、审理执行与实际履行状态及经营偿债影响是什么，综合评价有何证据和限制？
  - 已取得结果时是否实质解释正式等级、正常履约及案件影响，未取得部分是否单独限定，并与经营财务、风险及后续授信要素保持一致？
  - 适用工业或商贸规则如何确定，六组及附加项的输入、扣分、定性依据和股东管控条件是否可追溯，空白规则、初评与审定是否区分？
  - 评级有效期、更新触发及前文现金/盈利预警如何影响当前判断，规则自身疑义和缺正式结果如何处理？
  evidence_refs:
  - financial_record
  - application_record
  - professional_record
  - external_credit_record
  analysis_refs:
  - risk_review
  - external_result_check
  required_assets: [信用等级评定表]
  required_tables:
  - subheading: 一、信用评级
    asset: 信用等级评定表
    columns: [序号, 评级指标, 标准分, 评级得分]
    fixed_rows:
    - ["1", 偿债能力评价, null, null]
    - ["2", 盈利能力评价, null, null]
    - ["3", 营运能力评价, null, null]
    - ["4", 经营管理分析, null, null]
    - ["5", 发展前景分析, null, null]
    - ["6", 征信情况, null, null]
    - ["7", 附加指标－股东管控程度, null, null]
    - [合计, "-", null, null]
    - [信用等级评定, null, "-", "-"]
