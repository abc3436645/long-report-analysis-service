analysis_tasks:
- id: risk_review
  goal: 围绕本次授信事项，评价经营与现金创造能力、到期偿还、压力缺口、缓释及剩余风险，形成有依据的调查意见
- id: external_result_check
  goal: 核对外部额度、等级、期限的主体、时点、版本和适用范围
retrieval_tasks:
- id: enterprise_events
  input: professional_records
  need: 担保、诉讼和在建项目的专业记录
  ttl_days: 7
writing_guidance:
  credit_decision:
  - 起草前在分析底稿形成五项成果：授信事项与存量衔接、盈利与现金桥接、资产债务可用性、还款来源与压力测算、风险与授信条件对应。每项记录主体期间、问题、原始依据与计算、已证事实/企业解释/假设、反向证据、判断、缺口影响及正文落点；不新增固定目录或把五张工作表原样塞入正文。
  - 授信事项区分申请、外部模型、拟议和批准；说明额度维持、存量到期续作与新增提款如何衔接，列出存量余额、到期日及偿还或续作条件，名义未用额度剔除共享、品种、保证金、提款条件及供应商接受限制后才讨论有效可用性。控制新增提款不能替代存量回收。
  - 盈利现金桥接从经营模式和单位收益解释账面利润、可持续收益与现金差异；适用时联结数量、价格、加工费及套保，验证对应现货、期间、已实现/估值收益及重复计入。损益简单加总仅为条件性敏感分析，未经匹配不命名为真实经营毛利；套保经济有效不等于追加保证金无压力。
  - 资产债务可用性分开呈现现金受限、可支配余额与未调节差额，股权投资、正常交易债权与非经营资金往来分别分析；不把投资债权加总等同坏账损失。保证金按债务、到期及可用于清偿条件匹配，全额债务到期表与净敞口分开，避免保证金重复扣减。集团支持评估能力、意愿、程序和到位时间，不默认构成担保。
  - 还款来源按实际债务期限组织时间桶：期初可用现金加可验证回款及已落实资金，减必要经营支付、税费、保证金净增加、资本承诺及到期本息，明确哪些已含于经营现金避免重复扣减。基准与不利情景列参数来源、口径、公式、峰值缺口及覆盖安排；未落实续贷不作为确定流入。资料不足保留可计算部分、受影响期限及审批后果，不编造预测或默认压力幅度，不重建未获授权的其他额度模型。
  - 风险条件逐项列对象、当前基数、拟议目标或限制、期限、责任岗位、检查证据、触发事件、处置权限、解除条件及剩余风险。阈值源于本轮合同/制度/获授权方案，无依据时提出需确定的参数和影响，不套用样本天数、金额或名单；受托支付还需结合整体关联资金流出与回款监控。
  - 缺口按业务后果分为审批判断阻断、放款前提、贷后约束及普通补件。关键偿债依据缺失不能统一延后至放款或贷后；普通履历补件也不自动阻断。分类、责任、完成时间与意见后果留底稿，重大限制写正文；补件落实不自动等于风险消失或授信获批。
  - 第九章调查结论开篇压缩呈现本次事项与调查意见、主要偿债依据、决定性风险和前提，方案逐项回指第八章。明确条件不成立时的意见变化及措施落实后的剩余风险；对现阶段不能支持的判断明确范围和理由，不用套话回避判断，也不无依据填写额度、期限、担保或利率。
  - 业务报告保留必要口径、简短业务来源、重大限制和风控条件；配套核查底稿保存详细定位、计算、冲突、补件和关闭证据，并让PDF读者能够访问。工程运行记录单独保存OCR、重试和服务状态，不伪装成业务风险。原始MD仍是含批注的审阅源文件，不冒充无技术标记的业务正文。
  - 金额沿用amount_display；比例先核明原值是小数比例还是百分数点值，按明确换算形成可追溯数值后展示两位小数百分比，不对所有小数盲目乘百。表内金额使用万元、两位小数和千分位，核验保持原精度。版式审阅检查重复标点、断句、目录与表格跨页，禁止通过文本润色掩盖原件歧义。
  comprehensive_assessment:
  - 场景以本次授信事项能否在有依据的条件下获得支持为统领：企业综合能力、优势潜力和风险分析服务于用途合理性、持续经营、现金创造及到期偿还。不得缩减为企业资料汇编或风险清单，不以集团背景、收入规模或正利润替代偿债论证。
  - 按本单位实际业务综合考察治理与管理团队、商业模式与履约、产品技术及服务质量、上下游与订单渠道、盈利及成本效率、资产质量与现金、融资偿债与信用、行业位置及发展条件、合规与可落实资源支持。各维度同时核对已有能力成果、制约或预警、持续条件及证据局限，重要性决定篇幅，不强制正反各半或每项都有优缺点。
  - 优点按资源或能力、实际运作、已发生经营效果、持续和可复制条件形成证据链；有可比资料再解释相对优势。主动挖掘生产交付、客户留存、技术质量、成本周转、回款管理、组织治理及资源协同等已见成效，不能仅把“未见风险”当作优点，也不以品牌、资质或背景替代成果。
  - 发展潜力区分已实现能力、正在落实的改善与预期机会，核对需求客户、合同订单、技术或服务应用、实施资源和资金等支撑；说明实现条件、进度与不确定性。尚未落地的机会不写成已兑现收益，现期承压也不自动否定有证据的改善能力。
  - 潜在危险关注可能削弱持续经营、履约、资产回收或偿债的趋势和具体异常，说明对象、形成及传导、影响程度或紧迫性依据、已有控制和剩余暴露；不只寻找已发生损失，也不把一般行业波动、单项异常或材料缺失直接判为危险公司。
  - 同一经营安排可能既形成能力又带来依赖，应分别评价收益贡献、风险成本及约束，例如长期交易关系的供销基础与集中依赖、融资便利与到期压力、成长投入与现金占用。优点不无依据抵销重大风险，风险也不掩盖已核实的经营能力；控制有效性和资料充分性与企业能力高低分别表达。
  - 对优质基础的识别重点说明竞争或履约能力、真实盈利和现金兑现、管理执行及持续性有哪些证据；对值得关注的公司说明薄弱环节、恶化迹象、传导及可改善条件。资料不足则限定哪些维度尚不能判断，不强行给公司贴优质或危险标签，不新增通用等级、评分阈值或自动名单，也不替代正式评级和授信审批。
  - 第一至第五章形成能力、优势、潜力及约束的实质分析，第六章集中评估风险和缓释，第七章核对信用与履约，第八章评价授信要素，第九章综合各维度说明经营质量、持续能力、风险承受及当前意见。结论可依证据支持合作基础、提出持续观察或风险核实建议，具体业务决定仍按适用政策和既有流程。
  business_adaptation:
  - 先从本轮材料识别被评审单位的行业、产品或服务、经营模式、评价基准、法人及合并范围、授信事项和资金组织方式，再选分析维度；场景保存业务问题、证据要求和论证方法，不保存样本公司的事实答案。
  - 企业及关联方名单、股权控制、人员履历、产品牌号、设备工艺、产能、区域、客户、合作机构、订单、会计成因、优势风险及结论均由本轮证据确定；不预置样本的主体、金额占比、年份、岗位人数、荣誉、评级、期限、政策版本或测算参数，不要求其他公司复现同一业务链及正面结论。
  - 制造或加工业务关注原料、产能工艺、产销和加工收益；贸易业务关注采购销售、货权物流、价差及结算；服务或项目业务按实际合同关注履约资源、进度验收和收费回款，混合业务分开说明。固定标题保留，标题中某一行业因素不适用时说明依据，转而分析本单位对应的竞争、履约或价格风险，不伪造产能、套保或加工费。
  - 材料完整时充分呈现事实、解释及可作出的评价；仅部分缺失时分析已有事实并限定受影响判断；确实不适用时写依据。个案缺失不成为通用的默认缺失清单，材料未提供不等于事项不存在，也不意味着所有其他判断都停止。
  - 对比样本只学习问题覆盖、论证顺序、专业表达及证据深度；样本因果、政策与肯定性结论须重新验证。不得以与样本语气或篇幅相似为由预设低风险、稳定经营、股东兜底或支持授信。
  report_expression:
  - 以客户经理向信贷审查人呈报的专业调查口吻直接写业务判断，保留签认权限；采用自然、克制、准确的中文，不以术语密度、强势语气、固定“核心判断”标签或篇幅代替分析深度，不虚构调查、访谈、承诺及审批经历。
  - 分析段落先提出本节有证据的判断，再选关键比较、具体交易或条款说明形成机制及对经营、现金或偿还的影响，必要时交代限制和对应条件；一段集中说明一个判断，顺序随证据组织，不机械凑齐固定句式。工商及履历节直接呈现相关事实，不强造因果。
  - 每项重要论断先在底稿记录主张、支持证据、计算或逻辑桥接、反向证据、结论强度、意见影响及正文落点，再成文。引用只证明出处存在；因果须有交易记录、调节计算、合同执行或其他对应证据。行业常识仅解释机制，不能替代本公司原因证据。
  - 已证事实直接陈述；公司解释注明归属；审查推断说明推导及成立条件；拟议措施用建议语气并标明权限。不得把时间先后或同时变化写成因果，把余额减少写成现金回收、履历写成绩效、股东背景写成担保、签约写成履约、未发现写成不存在。
  - 各项优势、风险与改善均说明对象、已见效果及持续条件；没有经营结果证据时只陈述资源或安排，不用“有利于”“提供基础”“形成支撑”替代效果证明，不为平衡风险而补造优点。原因未明时保留已有量级与确定影响，将未证部分限定到具体判断，不反复泛化免责。
  - 除工商信息表外，表后解释最重要的余额、变化或结构及其业务含义，选择相关比较，不逐格复述。存量与流量、年度与中期、金额与实物、平均效率与期末集中、账面收益与现金、名义额度与可用资金分别保持；高低、显著、充足及稳定须有可比基准或明确量级支撑。
  - 核查说明与详细来源进入锚定批注和配套底稿，正文保留必要口径和影响意见的限制。资料充分时作清楚判断；不足时说明哪项意见尚未形成及其后果，不能用“待确定”加行业常识充当整节分析，也不能将需要经办完成的分析任务当作分析结果。
  - 全文按章节职责推进：经营章解释赚钱和占资机制，财务章核对盈利质量与资产现金，融资章核对渠道和期限，风险章说明暴露及缓释，授信章评价具体要素，结论权衡可支持范围和未闭合条件。同一事实只在所属章节展开，后文引用其新增含义，不重复整段经营基础或风险清单。
  - 润色前后逐项检查主体、期间、数值、范围、证据归属、因果强度和实质限定；不能通过删除“不证明”“据公司说明”等必要限定把暂定结论变为肯定事实。保留成立的简洁判断，改掉重复免责和编稿提示，不按禁词表机械删除。
  - 名称首次全称并明确简称，主语与对手方清楚，长句按事实、解释和条件分句；删除无事实贡献的套话、口语比喻、未定义术语和孤立“其次”等衔接词。数字用现有amount_display换算，表内万元/两位小数/千分位，比例按已核定义展示，核验保留原精度。
  body_and_annotations:
  - 正文面向财务公司专业评审人员，按章节主题直接陈述业务公司的事实、经营机制、比较分析及判断。工商直接列登记信息；股权架构只列规定表格；股东按户介绍持股、控股股东身份及有依据的公司背景；对外投资先列表再逐家介绍持股公司；管理人员只逐人分段写履历。调查对象说明、资料快照、交叉核对过程和编稿依据不得充当本节业务内容。
  - 核查过程、资料来源与技术定位、待补材料、口径复核步骤、编稿提醒及参考稿使用说明放锚定批注，不在正文反复写“本轮”“不能照搬样本”“应由经办核对”。工商信息表不作表后分析；其他表格的事实、数据、表后分析和实质结论不得全部移入批注；不得仅用批注满足章节业务覆盖。
  - 已发现的资金受限、回款及关联占资、减值、现金缺口、融资依赖等实质风险在对应正文中说明对象和经营影响。未决事项影响额度或结论时，正文简述其业务后果或用“待确定”等准确状态，具体证据冲突和补件步骤放批注。不得通过移入批注把有条件结论改成无条件肯定。
  - 单位、期间、单体或合并、审计状态、合同约定与实际执行等理解数据不可缺少的口径，用表头、简短表注或明确归属表达。批注补充详细来源和核查记录；企业解释在正文注明“据公司说明”，假设不写成已证原因。
  - "使用独立的HTML批注块，格式为 <!-- review-note: 提示内容 -->，置于对应段落、表格或标题之后，块内不含空行；缺表的具名“资料缺口：表名：影响及所需材料”可放块内独立一行。引用仍使用本轮fact/calc/ev并受证据绑定校验。Word按presentation.annotations生成原生批注，来源ev定位自动转批注；不要手写正文尾部长文件名、行号或命令。"
  - 独立审阅逐章检查主题内容充分性、正文与批注分层、实质风险及限制是否保留，并回看批注锚点、来源和缺件是否可定位。发现核查叙述挤占正文、股东简介缺少分户介绍、表后仅写待核或风险只在批注时，判needs_changes并重写；不得以机械校验、批注数量或页数替代内容审查。
  chapter_body_focus:
  - 第一章写登记事项、背景沿革、主要部门构成、分户股东及投资、管理人员；第六节仅逐人分段写已知履历，不插入管理评价或核查说明，缺履历的补件要求放锚定批注；基本组织机构情况只说明已知部门，不写治理核查清单。
  - 第二章写产品和经营模式、产销、收入成本、采购销售及合同安排，解释数量收益与结算资金传导；合同与实际履行分清，台账核查步骤放批注。
  - 第三章写财务报表、重大科目、利润现金及财务能力，保留金额期间及表后分析；重分类、差额未调节对可用现金等影响写正文，勾稽过程和计算公式放批注。
  - 第四章写机构授信、用信、融资品种和可用性、到期压力；不以融资台账核对要求代替融资现状。
  - 第五章写行业特点、适用政策、公司优势和行业地位，区分现实成果与潜力条件；检索过程、政策来源定位和资质补件放批注，不宣称无证据排名。
  - 第六章写具体风险暴露、传导、已有控制及建议措施；建议可在正文，但要对应本公司实际风险，不掺编稿提示，不把建议写成已落实。
  - 第七章写正式评级状态、征信结果和涉诉事项，保留查询时点及已知案件状态；缺结果时简明标识，查询步骤、更新任务及完整性提醒放批注。
  - 第八章写额度、期限、担保、利率、用途与还款来源；已知申请与建议、存量与新增分清，未定要素明确标识，制度核查和补件步骤放批注。
  - 第九章综合经营与偿债结论、关键风险及授信方案和实质前提；方案只列有依据值，待定要素不伪造，编辑填写和签章操作提醒放批注。
  cross_chapter_consistency:
  - 在分析底稿逐小节记录本轮业务问题、事实及计算依据、解释、局部判断、限制与正文落点，覆盖27个固定二级标题、第六章实际生成的小节和无二级标题的第四章；第一章第六节仅核对履历事实覆盖，不要求局部管理判断。写作时核对本轮证据是否实质进入对应正文，不只确认标题和引用存在，不强制在报告新增底稿表。
  - 同一主体、对手方、产品、期间、控制关系、交易性质、数量金额及指标定义贯穿全文；持股与控制、销售流量与债权余额、母公司与合并、认缴与账面投资、贷款与票据敞口等身份分别保持。冲突并列说明影响，不能在不同章节各选一个口径而形成相反结论。
  - 经营模式及订单支持第二章产销收益，采购回款及资金占用连接第三章报表与第四章融资；第五章优势落到已证经营效果，第六章风险落实前文对象与传导，第七章结果及履约影响第八章要素，第九章仅综合已有发现和条件。
  - 结论中的每项重要优势、主要风险、缓释措施及授信要素均能回指前文依据；已披露的不利事实、政策缺口或模型冲突不得在结论消失，有依据的经营基础也不被补件清单淹没。后补证据改变判断时同步更新受影响章节，缺少定量或政策依据不推导新的额度、等级、期限或风险分数。
  boundaries:
  - 所有业务事实来自本轮归档、核验及冻结材料；参考报告只用于标题、字体与内容深度，不自动成为当前证据。
  - 外部额度、信用等级、期限及其适用政策按主体、事项、评价基准、版本和来源核对；缺失时逐项披露，不移植样本的额度公式、等级或期限。
  - 样本用于学习逐章分析方法，不预设支持授信或低风险结论；股东背景、历史盈利、未用额度、短账期或已开展套保均不能单独证明偿债安全。
  analysis_sequence:
  - 全文按credit_decision主线组织，综合能力评价为偿债论证提供支撑；先完成五项分析成果和反向证据检查，再按固定目录成文，最后形成调查结论及方案。工商、人员等资料小节直接呈现重要事实，不强行编造定量判断；分析小节先写有证据的核心判断。
  - 工商信息小节按表格规则直接呈现，基本组织机构情况只列主要部门，对外投资情况先列表再介绍持股公司，法人代表及主要管理人情况只逐人分段写履历；其他小节先回答本节业务问题，再按有来源的事实和变化、原因、对经营及偿债的影响及局部判断展开；核实动作依body_and_annotations进入批注，表格承载比较，正文解释变化，不逐格复述或重复公司宣传。
  - 重要判断同时核对支持和反向证据；将企业解释、专业来源观点、审查判断及建议分别表述。原因未经核验用待核实表达，不把规模大、集团背景或连续盈利直接写成风险可控。
  - 起草前按cross_chapter_consistency建立本轮分析要点与证据落点，分析小节逐节完成事实、原因、评价和限制，第一章第六节只写履历事实，再按report_expression组织专业正文；不要把工作底稿中的全部校验说明搬入报告。
  evidence_requirements:
  - 按实际可得材料组织连续年度与最新中期比较，样本三年及一期是深度参考，不固定年份或伪造缺失年度；资产负债为时点，收入利润现金流为期间，年度与中期分别呈现，同比需要上年同期依据。
  - 表格就地标注主体、期间、币种、单位、母公司或合并范围、含税或不含税及来源定位；财务章另说明审计机构、审计意见和中期审计状态，未提供则披露，不默认为已审计。
  - 建立股东及投资、产品产销、产品收入成本、主要供应商客户、三张报表、重点往来、财务比率、机构授信用信及外部评级结果的材料需求；按本轮事实列示，有适用缺口保留分析位置并写影响，不把无资料视为零值或无事项。
  - 金额加总、差额、比例及勾稽用程序或可核验的既有结果；financial_metrics注册描述性财务比率，由report calculate按fin.字段、financial_scope、period_start和period_days确定性复算；metrics不注册额度算子，外部额度结果仅核对。本轮未定义的派生数值保留公式、输入定位与方法后归档，未知口径不由语言模型口算填表。
  - 经营表与财务报表、母公司与合并、含税交易额与不含税收入成本、认缴投资与账面长期股权投资、授信用信与征信融资余额分别核对，差异先说明时点和范围，无法解释保留冲突，不强行改成一致。
  - 管理人员材料按人提取教育及专业背景、职称资格、历次相关任职的起止时间与单位岗位、现职起任时间及兼任，不只取姓名或材料首行代表整份履历。交易材料同时提取对手方身份、合同有效期、数量及定价、交付付款、赊销限额、订单履行和回款记录，使后续能力与风险判断有可引用事实。
  - 核对字段真实业务含义后再填表；原单元格混写结算方式、账期或备注时，按可核内容分别呈现并保留原定位，不把账期重复当支付工具。比率和倍次单位逐项清楚标识，定性评价列按各行具体事实填写，不整列复制同一句待核提醒。
  materiality_selection:
  - 重点科目按金额较大或金额变动较大分别筛选，二者任一成立即展开；另将诉讼逾期、关联占用、受限保证金、重分类、集中到期等性质重要项目列入，不仅按增长率排名，不因下降或变动不大而略过大额余额。
  - 金额大小结合本单位资产负债规模、权益、自由现金、收入利润及该科目占比判断；变化同时看绝对变动额、相对变动率和对总变动的贡献。不存在预置的统一万元、百分比阈值或仅取前几项规则；有本轮明确的重要性标准才按其筛选并注明依据。
  - 先扫描完整资产负债表及附注，重点核对货币资金、应收账款、其他应收款、其他应付款、存货、长期股权投资及负债，同时检查预付、交易性金融资产、合同负债和其他大额或异常科目；重点清单不是只允许分析这些科目。
  - 分析底稿记录重点科目筛选清单，包含科目、对比时点余额、本期时点余额、绝对变动额、变动率或不可比说明、相关占比及分母、入选理由、明细及解释证据状态；正文在科目分析开头交代金额大、变动大或性质重要的具体依据，不强制另加筛选表，未取得附注明细也保留已识别重点及其缺口。
  - 比较最新时点与上年末等同口径时点，必要时追踪前期异常形成与本期消化，不称为中期同比；小基数高变动率不能单独决定重点，基数为零、负值、科目新增或重分类时披露，不硬算无意义增长率。金额和变动由程序或可核验结果支撑。
  - 每个重点科目按余额与结构、变动额及原因、主要对手方或资金性质、账龄或到期及受限、回收或偿付证据、对现金及授信影响展开，紧接相关表格解释；资金原因区分经营量价、结算方式切换、关联调配、理财套保及会计重分类，不把企业解释直接当成已验证因果。
  - 往来项目先按科目及对手方分别看总额、性质与变化，再核对科目间迁移及对手方集中；应收转其他应收、应付转票据、保证金与票据同时增加都不能按单个余额改善判断风险下降，未经抵销依据不将其他应收与其他应付净额化。
  - 未重点展开且本轮无相关表格的用户关注科目仍简要交代余额、变化及未展开理由；已有影响正常经营、资金占用或偿债的相关表格按financials_tables全部列示并逐表解读。有明确无余额或不适用证据则说明，无单列科目或缺附注不视为零。保持稳定的大额长期投资与其他应付款也应评价，不能只照抄样本有文字说明的科目。
  table_common:
  - 第二至第五章实际输出的每张表均须执行table_interpretation，含基础表、重点明细、合同、比率、口径桥接、政策及同业对照等补充表；按counterparty_assessment评估涉及的公司，按operating_stability归纳经营能力。不能仅有表格、来源说明和待核事项就视为解读完成。
  - 第二至第五章的section.required_assets列基础表格名称，按同章tables指引落实位置、字段与表后重点；基础表在有证据时必须呈现，不能只写概述。缺材料保留表格位置、已知数据及明确缺口，整表缺失可用具名缺口说明替代，说明影响及所需材料，不伪造空表数据。
  - 科目明细表按同章tables规则展开；第三章资产负债表已有相关表格的覆盖不以重点筛选结果为限，有已知重点而明细未提供时明确补件。表名、期间、单位和来源就地标注，数据列保留原计量精度，展示精度与核对精度分开。主要对手方数量据当前集中程度和材料确定，不固定五户或十户，长尾金额较大也解释。
  - 多期比较可采用期间分列或期间逐行，字段语义必须完整；来源只给本期明细时先列本期，并披露缺上期，不编造两期对手方对应。合计、占比、分母及未列示部分核对，前几户小计不写成全科目合计，重分类前后须追溯桥接。
  - 基础表格和重点明细属于写作及独立审阅要求，required_assets通常允许具名缺口；第七章fixed_rows必备评级表须始终保留，缺值逐格标示；required_tables仅核验已声明表格的结构，包括有数据时分别核验主要供应商表和主要客户表。内容要求没有完成不能由机械检查通过替代，判断性的选重点与原因审查也不交给金额阈值或关键词自动裁决。
  table_interpretation:
  - 每张表在来源说明之后、下一张表或下一小节之前紧接专属正文解读；跨页续表视为同一张表，解读置于完整表格之后。主表先解释总体结构和关键变化，再下钻明细，不能连续堆表后仅作全章概括；来源或口径注释不替代分析。
  - 数值表以表内可追溯的关键金额、数量、差额、占比及其分母、账期或到期区间起笔，选择真正影响本单位经营的关系展开，不逐格复述。无可比期则解释本期结构及集中度，不编造同比；政策、合同或纯文字表则锚定具体条款、交易条件或比较维度，不硬凑数字。
  - 将关键数据连接业务成因、公司能力或优势、制约及风险、对生产订单和收益现金的影响，再给出有边界的判断。成因区分已核事实、企业解释和分析假设；不能用“数据如表”“较上期变化”“需进一步核实”或换表名即可复用的段落代替论证。
  - 有证据支持的供应保障、生产交付、客户留存、定价议价、费用控制、周转回款和融资安排，应解释实现机制与实际效果；优势要落到本单位已取得的资源、订单、收益或现金，不把股东名气、合同存在、低账期或融资余额当作已实现能力。
  - 对手方表解释单户及同一集团集中、关联与非关联身份、对手方经营及履约能力、约定和实际账期、替代性与资金依赖；联系应收预付、其他往来、存货订单及票据保证金。行业与政策表说明本公司产品、客户或产线是否实际受益、能否承接需求及新增合规投入，不停留在行业描述。
  - 口径差异或缺件仅限制相关判断：先分析已有数据能确认的规模、结构、合同条件和能力，再说明差异对结论的影响、仍不能确认什么及需要哪项证据。不能以“待核实”覆盖整表，也不能为避免缺口而补造原因、订单、对手方资信或正面评价。
  - 逐表判断既保留已证实的积极因素，也说明反向信号和适用条件；没有优势证据时明确尚不能证明哪项能力，不强行凑正面结论。不能从集中直接认定不稳定，也不能从关联或长期合作直接认定供销有保障、风险低。
  - 表后发现按实际影响传至第六章风险、第八章用途及还款来源和第九章结论；第二至第五章同时回答“哪些经营基础已经成立、哪些优势具有效果、哪些约束尚在”，不能把前文写成纯风险或补件清单，再在结论突然肯定经营稳定。
  counterparty_assessment:
  - 对每张涉及公司的表，先识别重要对手方的法定主体、所属集团、与借款人的股权或控制关系及交易角色，区分直接供应商、生产厂家、贸易商、终端客户、关联销售平台、被投单位与融资机构。相近名称不合并，同一集团不同法人分别列示后，有依据才补集团集中判断。
  - 主要供应商分析单户和合计采购占比、原料来源及质量、合作与实际交货、长协或现货、供货数量和有效期、定价升贴水、付款及票证接受条件、备选供应和转换成本。说明关联或长期供货支持生产连续性的证据，同时识别集中、预付、供货中断、延期、质量争议及对单一渠道的依赖。
  - 主要客户分析销售占比、客户及终端行业构成、持续采购与复购、合同及订单有效期、确定数量、交付进度、加工费或价差、约定账期、赊销额度及实际收款。有材料时说明重要客户的全称、主营业务、经营及信用背景；舆情须注明来源、发布时间、涉及主体及已核影响，区分媒体线索、企业回应和已证事实，不把负面报道直接写成履约违约。分散销售是否缓释单户波动需结合真实客户集团归属、期末应收集中、逾期与订单持续性，不能从客户数量直接推定销售稳定。
  - 有对应材料时，核对主要客户与供应商名单是否重叠、是否存在同一控制或其他已证关联；新增大客户及交易前后近期入股须分别核实交易时间、股权变化、交易金额和商业背景，不能仅因新增或入股就认定异常交易。合同含控制权变更条款时，按条款适用主体、触发条件、同意或终止权及现有控制权事实判断关键合同是否可能受影响；没有合同条款或控制权变更证据时不推测合同终止。
  - 往来对手方分析不止写名称：将其采购销售角色、关联身份及经营偿付资料与本项形成原因、金额占比、账龄到期、合同和期后结算相连。对子公司借款评估可得的经营现金与偿债能力；期货保证金核对资金权属及释放条件；资料不足只保留相应能力判断，不以知名或关联身份替代回收依据。
  - 对手方能力只引用本轮已核资料或已实际取得的专业记录；注册资本、股东实力、合同交易金额不能直接充当可履约产能、客户支付能力或保证。已知停供、延期、退货、客户缩单、拒收票证或诉讼等线索要解释对本公司生产交付、资金和回款的具体传导，未有证据不假定已发生。
  - 采购先付或保证金、生产及库存占用、销售赊销、实际回款与融资兑付应连接成同一业务链；区分合同约定与实际执行、年度交易流量与期末余额。存在临时电汇后退预付、票证替换或关联调配时核对重复占用与退款，不把结算方式变化当成资金压力自动消失。
  operating_stability:
  - 经营稳定性分别判断供应连续、生产交付、订单销售、盈利现金和融资周转，不用“经营稳定”一句统括。结论注明主体、产品及期间，与产销量变化、客户订单、加工费和经营现金流相互印证，不能只因持续有收入或盈利即确认稳定。
  - 订单区分历史已完成销售、框架或长协、已签确定数量订单、评价基准日在手未交付订单、意向及预算；核对有效期、数量金额、可撤销条件、排产交付及期后履行。长单存在不等于当前订单已经锁定，收入预算不等于订单，订单金额与收入成本按口径及履约期间匹配。
  - 有依据时分析订单对后续产能及存货的覆盖、主要客户续签和集中变化、供应履约及替代、设备运行和交付能力、质量验收与退货；覆盖期或比率必须有同范围分母和程序结果，缺订单或实际可用产能时仍利用已有产销与合同分析经营基础，并明确不能确认的持续期间。
  - 能力与优点沿“资源或措施、实际运作、经营效果、适用限制”论证，例如稳定供货如何支撑交付、客户复购如何支撑排产、差异化质量如何体现加工费、结算管理如何改善现金。仅有品牌、资质、设备名称或制度不能认定溢价、成本优势、议价权或控制已经有效。
  - 同时关注可持续性反向信号：供应或客户集中上升、订单取消或不足、产销回落、加工费下行、库存与应收累积、预付及保证金增加、经营现金为负和融资接续约束。解释它们是否与已识别优势矛盾及影响程度，缺原因证据不把异常自动判为主动调产、季节性或短期时点波动。
  operations_tables:
  - 主营产能产销表放二、主营产销情况，按产品、自产或受托列本轮可得的近几年完整年度及当年截至评价基准的累计或分月分季产能、产量、销量，必要时列产能利用率及产销比，并有小计或合计；表头注明主体、统计期间、实物单位及自产受托口径。本部合并、设计可用、年度中期及中间品内部耗用分别说明，只有产销量而缺产能时保留缺口，不把中间品再加工重复统计成终端销量。
  - 主营收入成本表同置二、主营产销情况，按相同产品业务与可得期间列收入、成本，有口径及程序结果时列毛利或毛利率；近几年完整年度与当年累计分清，期间和主体尽量与产销表对应。有分产品缺口则列已知合计并披露，不能用采购含税额充当成本或从产量自行推算收入。表后解释量价、加工费、结构及套保对应，不机械描述同涨同跌。
  - 三、原料采购、产品销售情况须区分两张独立基础表：原材料采购部分的“主要供应商表”有交易数据时仅用“供应商名称｜产品｜采购金额（万元）｜占比｜结算方式｜账期”；产品销售部分的“主要客户表”有交易数据时仅用“客户名称｜产品｜销售金额（万元）｜占比｜结算方式｜账期”。两表分别按本轮证据列实际对手方，注明期间、主体、金额是否含税及占比分母；结算方式写收付款工具或条件，账期写约定期限，不将二者混填。缺整表资料时各按required_assets具名披露对应缺口，不强造对手方或空表。
  - 供应商表和客户表后分别引用具体金额、占比及分母作专属解读；有足够同口径名单时计算前五大供应商占总采购、前五大客户占总销售的比例，少于五户时只按已知户数列示，不冒称前五大。结合单户及同一控制集团集中、合作与合同有效期、约定和实际履约、续签、替代来源、结算账期及回款判断依赖深度和稳定性；长期合同和短账期不能单独证明供销稳定。将集团统采统销与市场化业务分开，采购现金流与销售回款联系第三章往来及第四章融资。
  - 多种产品用途、工艺或附加值有实质差异时，在一、主营业务情况用产品比较表按产业链位置、客户、竞争要素及盈利差异展开；该表为适用时补充，不能替代产销及收支基础表。
  - 主营产能产销表后具体比较产品及自产受托结构、产销增减和匹配、存货及订单覆盖，按operating_stability评价生产交付与需求持续性；主营收入成本表后比较量价、加工费、毛利和业务结构，说明已具备的盈利能力及约束。逐项引用重要变动的原值、比较值、差额及可计算的变动率；同比只用上年同期间同范围数据，环比只用相邻月度或季度等同频数据，无对应期间或不可比时不编造百分比。不能只写“产销回落、口径待核”。
  - 主要供应商表与主要客户表各自按counterparty_assessment逐户抓重要对象展开，引用占比及分母、账期和具体合同履行；有证据时补充供应商客户重叠及关联、新增大客户或交易前后入股、关键合同控制权变更（change of control）条款的具体影响，并核对反向证据。合同条款对照表后说明条款如何影响供货保障、订单可执行性、议价及现金占用，框架合同、在手订单和已发生交易分清；无相关材料则不增加推测性异常清单，不将合同表当作已完成经营分析。
  financials_tables:
  - 资产负债表、利润表、现金流量表、财务比率表为第三章四个固定小节的基础表；资产负债表按本轮可得的近几年完整年度年末及最新中期或评价基准时点，逐行完整列示原报表中资产、负债、所有者权益各科目与小计合计，不只截取重点科目或用分析摘要代替主表。表头注明主体、单体或合并范围、各时点、单位及审计状态；保留原科目名称、层级和金额，缺某年或明细时逐处标明资料缺口，不补零或编造可比数。现金流缺中期、比率缺定义等分别披露，不把比率反推的现金流补进报表。
  - 利润表小节先按本轮可得的近几年完整会计年度及最新累计或单期期间，逐行完整列示原报表所有收入、成本、费用、损益、所得税科目与各级小计合计；保留原名称、层级、符号及金额，不只摘录主要损益或用分析摘要代替主表。表头注明主体、单体或合并范围、期间起止、累计或单期、币种、单位及审计状态；缺年度、期间或明细逐处披露，不补零、不拼接不同主体或版本。利润表为期间数据，完整年度与中期累计不得直接算同比，只有同范围上年同期作同比；环比只比较相邻同频单期，累计数须有可核期差才可还原单期。
  - 现金流量表小节先按本轮可得的近几年完整会计年度及最新累计或单期期间，逐行完整列示原报表中经营、投资、筹资活动的各项流入流出、小计与净额，以及汇率变动影响、现金及现金等价物净增加额和期初期末余额等原表项目；保留原名称、顺序、层级、符号和金额，不以三类净额摘要代替主表。表头注明主体、单体或合并范围、期间起止、累计或单期、币种、单位、审计状态及来源；原表没有的项目不补造，缺某年、最新期间或原表明细时具名披露，不从利润或资产负债表反推填列。
  - 完整资产负债表后先比较资产、负债和权益总量、结构及资金来源用途，再按materiality_selection交代重点科目及其选择依据，按cash_focus、receivables_focus、current_accounts_focus、inventory_focus、equity_investment_focus、liabilities_focus展开明细；分析须覆盖金额较大、绝对或相对变动较大以及性质重要项目，含余额下降、稳定大额和科目重分类，不逐项均匀复述所有行。
  - 本轮材料中属于资产负债表小节、涉及货币资金、应收账款、其他应收款、其他应付款、存货、长期股权投资、负债及其他影响正常经营、资金占用或偿债项目的相关明细表、附注表和对照表，已有数据时全部输出并逐表深度解读；重点筛选只决定分析重心，不得作为省略已有相关表格或不利数据的理由。同一项目多期或多张表须说明主体、时点和口径关系，不拼接或重复计数；无相关表格但项目重要时保留具名缺口及其判断影响。
  - 本小节中能正向反映公司经营运行、资产回收、资金可用性或偿债状况的可核实数据，即使原材料未制成表格，也按科目、期间或对象整理成表并紧接解读；注明主体、时点、计量及来源，数值与占比由可核材料或确定性计算支持。逐表解释改善如何形成、是否已转化为可用现金或偿债能力、持续条件及反向证据；单项余额增长、账面改善或企业自述不能直接定为经营优势，不为凑表补造数据或将不同口径拼接。
  - 应收账款、预付款、其他应收及其他应付款已有对手方或项目明细时分别列示，至少保留对手方或项目、时点、金额及占比，能取得时补性质、关联关系、账龄到期、回收或支付条件、减值及期后证据；对手方与税费等项目混列须解释，其他应付款不能因变化不大省略。
  - 货币资金已有明细时按账户或存放机构、一般存款或保证金等性质、余额、受限情况、对应融资及可用性列结构表；存货按原料、在产品、产成品等列结构变动表，股权投资按被投单位列账面变动表，负债按品种及主要机构、对手方、期限等列结构和到期表，具体字段读对应focus。原表未提供的字段标明缺口，不以推断补列；未知的受限、存量或期限不能用零补齐。
  - 每张上述相关表格紧接专属解读：用可追溯的关键金额、占比及分母和可比变化说明构成与资金占用，核对合同、附注、流水、账龄、受限、减值、到期及期后收付等证据，解释成因和对正常经营、可支配现金及偿债的实际影响；积极因素、反向信号和限制均须呈现。事实、企业解释、审查推断和结论强度分开，缺少原因或效果证据时仅陈述已证事实与不能确认的判断，不夸大也不淡化。
  - 对异常情况及金额较大或变动重大的项目，核对余额、比较基准、变动额和经营或偿债影响；已证原因与影响在表后正文说明，原因未明或证据冲突时在正文保留已知事实及实质限制，并在对应表格或分析段落的锚定批注提示具体待核事项和所需材料。不得只用批注隐去实质异常，也不将未核解释写成确定成因；重大性结合本单位规模和影响判断，不设置统一金额阈值。
  - 利润表主表先用确定性计算或可核原表检查行内小计、营业利润至利润总额及净利润的关系；财务费用对照利息费用、利息收入、汇兑损益、手续费及其他构成逐项调节，不能机械要求利息费用减利息收入等于财务费用。按原表符号、列报口径和舍入差检查后仍不能调平的金额直接列为疑点，注明科目、期间、差额及影响，不擅自改写原表或把疑点定性为舞弊。
  - 利润表后分析收入、毛利、期间费用、减值、投资及公允价值损益、营业外与所得税对营业利润、利润总额和净利润的贡献；有分产品、分部、收入确认、费用或非经常损益等相关附注表时列示并逐表解释，核对小计与主表。同比、同频环比及各项占收入比重须有同主体同期间分母；涉及资产回报时另核对平均资产口径，不把每项损益机械除以期末总资产。按绝对变动、占比、历史波动及可比同行差异识别重点，同行比较须有业务、会计政策、期间和来源可比性，无可比资料不声称偏离行业。
  - 重点核对收入分项与确认政策、总额或净额法及期末集中确认，毛利率与成本归集，费用率异常下降、研发资本化或关联方代付代摊，减值计提时点、所得税与有效税率、利息费用与财务费用调节；投资、估值和其他非经常损益分别列金额，并在分母有意义时计算占营业利润比重，评价对盈利的依赖。核心利润或剔除项须先明确口径、分类与计算输入，按已确认口径为负时如实说明；营业利润或税前利润为零或负时不硬算误导性占比或有效税率。每项异常结合合同、会计政策、交易、凭证、附注及期后资料追证，不因单项比例变化直接认定操纵或经营改善。
  - 利润表与第二章产销及产品收支、资产负债表应收预付存货及金融资产、现金流量表经营收现和融资、第四章债务利率与第五章可比同行联查；收入增长而应收更快、毛利改善伴存货预付上升、利息收入与高负债并存、投资收益与投资资产不匹配、盈利但经营现金持续为负、费用率低于业务规模等均为核查线索，须核对主体、流量与存量、期间和实际机制后才判断。疑点底稿逐项记录异常事实及差额、追问、所需核查资料、可量化时的拟调整科目与金额及计算依据；无法量化时写明原因，不编造调整数字。已证实且影响盈利或偿债的发现写正文，核查步骤和待补资料放锚定批注，重大限制不能只留在批注。
  - 现金流量表先以本轮原表为准，用确定性计算或可核原表检查各类流入减流出与净额、三类净额及汇率影响与现金等价物净变动、期初至期末余额的关系；与资产负债表货币资金核对时列明现金等价物、受限资金及主体时点差异，不要求两项余额机械相等。勾稽无法解释时说明项目、期间、差额及影响，保留疑点，不修改原表来消除差异。逐项比较同口径完整年度和有依据的上年同期，同比只用同期间同范围数据；环比只用相邻同频单期，累计数须有可靠相邻累计数才可还原单期，基数为零或负及不可比时说明数额和状态，不硬算增长率。
  - 以经营、投资、筹资三类的流入、流出和净额为主线，按金额、绝对变动、历史波动、资金可用性及偿债影响选择重大异常或变化，逐项引用原值、比较值及可核差额。经营活动联查销售收现与营业收入、采购付款与成本、应收预付存货及大额“其他”收付，区分经营回款、关联往来和融资性质资金；投资活动区分建设支出、理财存取、股权投资及关联借款；筹资活动核对借款取得与偿还、利息股利支付、到期安排及是否依赖续借。各项原因须有合同、流水、附注、账龄、期后收付或对应材料，现金流入不自动等于可自由支配现金，筹资流入不写成经营造血。
  - 本轮有现金流明细、利润到经营现金调节或货币资金口径对照等相关表格时一并列示并逐表解读；对确有证据的回款改善、经营现金覆盖、投资形成的可用能力等正向信号，以及负经营现金流、占资、投资支出和融资补缺等反向信号，分别说明形成机制、持续条件及对授信到期偿付的影响，不因年度历史为正掩盖最新转弱，也不因单期为负推定持续恶化。建议围绕已证实的主要现金约束或改善机会选一条主方向，说明相应动作、适用前提和可观察结果；其他建议从属于主方向，拟议措施不得写成已执行，缺原因证据时只陈述已证变化及判断限制。
  - 母公司统筹套保、资金或结算导致本单位利润难以独立解释时，可在利润表小节增列相关母公司或合并层面的损益对照表，注明主体、范围、期间和单位；只解释分摊及传导，不用母公司盈利替代借款人盈利或掩盖本单位亏损与税费支出。
  - 四张基础表各自紧接分析：资产负债表说明主要资金来源与用途、资产结构及占用和偿付约束；利润表说明主业收益、费用管理、金融及非经常损益的贡献与可持续性；现金流表说明回款能力、真实投入及融资补缺；财务比率表联系实际产销、账期、回款及负债解释能力，不能只列指标或转到别章才作解读。
  - 财务比率表按financial_ratio_rows的四组及16个指标名、顺序固定行，列为本轮实际可得的近几年完整年度及最新期间，不固化样例的年份和数值；中期列标明累计区间，时点指标另注明截至日。每项每期有本轮可追溯事实或已计算结果才填数值，缺定义、缺输入、不适用或不可比时在该单元格具名标状态和原因，不因一项缺口删去整行，也不以样例数字补齐。各指标按百分比、倍或次标单位，速动比率等以倍转百分比须有明确换算，不把原值直接加百分号。
  - 比率底稿逐项记录指标定义、分子分母、期初期末或平均余额、单体合并范围、实际期间、年化方法、来源及计算状态；仅已注册且同口径的指标用report calculate结果，其他由本轮原表或专业材料提供的值标为来源提供并核对公式，需新算时以明确公式和输入作确定性计算后归档，不能让语言模型口算。营业收入利润率不自动等同净利率，总资产报酬率、盈余现金保障倍数、营业现金比率、两金和带息负债比率等未确认口径不得自定；利润或上期基数为零、负值及中期未年化时，避免无意义比例或与全年直接比较。
  - 四组分别紧接财务比率表作专属分析：盈利能力联系主营收益、费用、非经常损益与经营现金兑现；营运能力联系产销、收付账期、应收存货占用及关联往来；偿债能力联系受限现金、短债到期、带息负债和经营现金覆盖；持续经营能力联系收入与利润的同期间增长、订单履行、资金投入及可持续条件。每组引用本轮具体数值、可比变化、形成机制、反向证据和对授信的影响，不能只复述升降或套用统一阈值。外部营商环境、国际金属价格及市场行情仅在本单位业务确有敞口且取得有日期、来源和传导证据时用于解释，不把市场变动自动归因于公司指标，也不将样例公司结论复制到本轮。
  - 各相关明细表及比率、口径桥接等补充表也逐表按table_interpretation分析；往来及被投单位按counterparty_assessment评价，结合第二章合同、订单、采购供货与客户执行证据解释余额。差异表既说明差异的方向及影响，也交代哪些分析仍可成立，不能只有“需核实差额”。
  financial_ratio_rows:
  - 一、盈利能力：净资产收益率、总资产报酬率、营业收入利润率、盈余现金保障倍数、营业现金比率。
  - 二、营运能力：总资产周转率、应收账款周转率、流动资产周转率、两金占流动资产比重、存货周转率。
  - 三、偿债能力：资产负债率、速动比率、带息负债比率、现金流动负债比率。
  - 四、持续经营：营业总收入增长率、利润总额增长率。
  financing_tables:
  - 机构授信用信两期对比表沿用基础表契约名称，实际内容覆盖本轮可得近几年各年末及最新评价时点，不限两期。逐一列出原始材料中的全部银行和其他融资机构，不只摘录主要或有增长的机构；有历史记录而最新退出的机构仍保留。按机构及必要的品种列各时点授信额度、已使用额度、未使用额度及同口径合计，注明主体、时点、币种、单位、来源、是否含财务公司、敞口或全口径、共享和低风险品种范围；不同币种无可核汇率时不直接加总，跨年份余额不累加。未取得某期或某机构资料逐处标缺口，不填零或声称已覆盖所有外部融资；没有上期时列已知数据并说明限制，不加二级标题。
  - 授信有效期与单笔债务期限分别列示，机构或品种不同期限可在主表附列或另列期限明细；按材料列授信起止和到期日、借款或融资余额及到期日、担保抵质押及提款条件，有证据时补利率成本和续接状态。未知期限保留缺口，年度授信不自动视为一年期贷款；批复额度、合同额度、已用占额与账面债务分别保持，不把综合额度和共享子额度重复求和。已用加未用仅在同口径可勾稽时核对，实际可提款空间须另核共享、品种、保证金、抵质押和审批条件，不由名义未用额度直接推出。
  - 表后展开大额用信、变化较大机构与品种、财务公司余额及续期条件，补充贷款、票据、贴现、信用证和外汇衍生额度的性质及到期；总额增加不自动证明提款能力增强，品种额度与已用金额不混加。
  - 台账、报表和征信金额显著不同时追加融资口径对照表，列来源、记录及查询日、主体范围、品种、账面或敞口金额、保证金表内表外及差异解释，无法桥接的金额待核实；只说时点和口径不同不足以证明无异常，不把相近合计当完全一致，也不把信用证或外汇额度重复计入借款。
  - 机构表后用大额及变动机构的额度、已用、未用、占比及到期条件评价融资渠道分散与稳定程度，并连接采购付款、订单交付和回款周期；已获得的循环或续接支持说明落实证据与经营效果，未用且供应商不接受的品种不作为可用保障。融资口径对照表后分别判断可确认的债务结构、剩余差异及其对现金安排的影响，不能只列总额或泛称融资能力尚可。
  - 多期融资表及期限明细分别紧接解读：引用具体时点金额、可比差额及占比分母，解释机构进入退出、渠道或品种集中、授信使用和剩余空间消耗、到期集中及续接变化。结合第二章采购结算、产销订单和回款周期，第三章资金受限、往来占用、经营现金与债务结构，说明融资对经营交付、资金成本及到期偿付的已证支持和约束；不能从机构数量多、总额度增长或历史合作推定稳定融资。围绕实际影响最大的渠道可用性、期限匹配或现金缺口确定分析侧重点，相关建议写动作与前提，不罗列无依据风险或保证续贷成功。
  - 判断须逐项对应本轮原始授信批复、融资合同、用信台账、征信记录、担保资料及实际收付等适用证据；注明来源形成日和覆盖范围，企业解释、已核事实、审查推断分别表述。重大变化及异常追查形成原因，支持不足时限定相应结论，核查细节放锚定批注而实质经营和偿债限制留正文；有利与不利发现均须保留，不编造未落实融资、续期承诺、逾期或偿付记录。
  industry_tables:
  - 行业竞争格局表放第五章一、公司所处行业情况，字段为维度、现状、趋势、对本单位影响，并标来源及日期；核心维度按业务选供需产能、开工或利用率、集中度、产品或区域竞争、加工费或利润水平。天津样本以文字呈现、广州样本已有表格，本次按用户要求统一为基础表，缺资料逐维披露。
  - 加工费、毛利率、行业份额及同业比较须有产品、地域、年份与计算范围，不能混用不同产品、服务、工艺或业务；趋势及公司优劣须联系第二章产销和第三章收益现金，不能复制样本行业均值或未经核验的龙头份额。
  - 政策文件对照表、企业同业优势比较表按材料适用性补充在二、主要行业政策和三、企业优势及行业地位；分别列政策条款适用影响，或可比维度、公司与同业及来源，证据不足时不造同业数值，基础竞争格局表不替代具体政策与优势分析。
  - 行业竞争格局表按本单位主营产品、营运模式及细分市场补充行业发展阶段、市场价格和需求变化、上下游供给与客户需求、竞争替代和产业协同；各维度注明统计期间、地域、产品口径和来源，阶段判断须有需求、产能、技术或渗透等实际证据。政策对照表区分国家政策、国家或区域发展规划及公司所在地或项目所在地政府政策，列发布主体、文件及版本、生效有效状态、适用对象与条款、支持或约束条件、本公司对应事实及经营影响；规划目标、申报资格、已获批和已兑现支持分别表述。
  - 每张行业、政策、同业或证据覆盖表后均按table_interpretation解释本公司影响：将行业需求连接已有客户及实际订单、供给竞争连接加工费与替代性、政策连接具体产品工艺和合规投入、同业维度连接有证据的质量交付或区位经营效果；按operating_stability判断公司承接需求的能力及限制，不把宏观利好直接当订单增长或只列“行业数据待补”。
  cash_focus:
  - 货币资金关注余额规模和变动，按银行及财务公司存款、票据信用证保证金、期货外汇保证金、冻结或质押等区分，说明受限依据、解除时间条件及实际可自由支配金额；保证金扩张导致存贷双高不等于自由偿债现金增加。
  - 将资金增加与应付票据、信用证、保证金比例、融资成本及到期兑付联系，核对是否循环开票或资金集中管理；同一保证金不能重复覆盖不同债务，风险敞口需有对应关系而非总额相减。
  - 交易性金融资产或理财金额大、变动大时独立说明产品、风险、期限、赎回限制、质押与资金来源，关联投资现金流及收益；不将理财等同货币资金，不默认可随时变现。货币资金与理财增加均须审查是否源于新增负债或关联方预收。
  receivables_focus:
  - 应收账款的大额余额、较大增加或减少均需下钻主要客户、关联身份、集中度、账龄、结算周期及期后回款，区分跨月尾款、实际支付、退货核销及转其他科目；余额下降不自动证明回款或信用改善。
  - 本期和对比期客户结构可得时并列分析，缺前期明细时不伪造变化；已入选重点需说明主要客户覆盖比例及其分母，长账龄、逾期、涉诉和重分类款项补合同、审计调整、减值及回收证据，不能只以客户知名或集团内往来判安全。
  current_accounts_focus:
  - 其他应收款按关联拆借、历史货款、诉讼重分类、代垫保证金、税费暂估及其他性质拆分，逐项解释对手方、形成时间、余额变动、协议用途、偿还或结算条件、账龄与减值；转出应收账款并未消除原债权风险，转入金额不等于本期新增现金支出。
  - 母公司统筹套保下的保证金代垫需核对实际资金去向、权属、合约对应、平仓及退还安排，不能把待平仓后视资金情况处理写成确定短期可回收；对子公司的借款联系第一章投资及被投单位偿付能力。
  - 其他应付款按关联垫资或代套保款、保证金、暂估税费、运输代理费用等拆分，逐项列对手方或项目、金额占比、成因、是否有息、到期和偿付安排；大额存量即使变动不大仍须展开，不将全部项目统称供应商货款或可长期无偿占用。
  - 同一关联体系的其他应收和其他应付分别列示并核对业务链、重分类与资金净流向，抵销需要法律及会计依据；企业诉讼未直接涉及借款人也可能影响其关联债权回收，风险章和还款来源审查需体现。
  inventory_focus:
  - 存货按原材料、在产品、产成品及其他结构列对比余额、变动额，取得实物资料时说明数量、单位成本或价格；联系产销、内部深加工耗用、在途及跌价，不把原料价格引起金额增加直接当实物积压，也不把余额减少直接当销售去化。
  - 核对库龄、订单覆盖、权属及受托加工材料归属、质押受限、盘点和跌价准备；套保覆盖不替代可变现性审查。存货占用连接经营现金流，价格上涨与期末备货、期后销售的解释须有记录支持。
  equity_investment_focus:
  - 长期股权投资即使多期不变，金额相对权益或可用资金较大时仍列被投单位、持股比例、核算范围及方法、期初期末账面值、增减和减值，说明收益分红、追加出资义务及退出变现限制；账面稳定不证明没有资金或损失风险。
  - 将第一章投资与第三章长期股权投资及其他应收借款联查，认缴、实缴、收购对价、账面投资和对子公司借款各自保持身份，不将子公司资产盈利并入母公司个别报表，也不将并购产能直接当借款人现金来源。
  - 材料明确无对外投资时说明适用范围与依据；报表未单列长期股权投资只能说明未单列，需核对附注及投资记录，不能填零或为套样例编造被投公司。
  liabilities_focus:
  - 负债先按短期借款、应付票据、应付账款、合同负债、其他应付款、一年内到期及长期融资扫描规模、变动、期限和偿还性质，有息负债与经营性或关联性无息负债分开，含表外及或有义务的审查范围另行说明。
  - 借款结构列机构及品种、金额、增减、利率或成本、担保、期限及到期安排，区分流贷、票据贴现和信用证融资的入账口径；外部银行与财务公司分清，不能从无长期借款推定无集中偿付压力。
  - 应付票据按开立及敞口、保证金、低风险定义和到期区间解释，联查货币资金、采购结算及第四章授信；票据结算替代应付账款不意味着总支付义务下降，低风险或无息也不等于无到期兑付压力。
  - 应付账款按主要供应商或关联方、账龄、账期和逾期列示，解释大额增减来自付款还是改为票据或其他科目；合同负债按主要客户、关联身份、预收来源、订单交付或退款义务及未来履约安排展开，不能把预收款当自有资本或永久自由现金。
  - 负债大幅上升同时资金及理财增加时解释资金来源、运用与匹配，结合自由现金、应收回款、理财可变现性、票据兑付及支持落实评价剩余压力；只凭带息负债占比下降或集团控股不能推出实质偿债风险低。
  company:
  - 围绕credit_decision并结合comprehensive_assessment，按business_adaptation、report_expression及cross_chapter_consistency成文：形成主体、形成背景、资源与投资义务的整体判断；工商信息、基本组织机构情况、对外投资情况和法人代表及主要管理人情况直接呈现规定事实，其他小节先写具体已知情况再限定未决事项，不能把六节都写成合规提醒。
  - 一、工商信息只输出一张项目／内容两列表格，逐行呈现企业名称、统一社会信用代码、法人代表、成立日期、有效期、注册资本、实收资本、注册地址、经营范围；以本轮提供的营业执照为主，其他已核材料补充执照未载字段并核验重点信息。经营范围按执照全文列示，不用“等”、摘要或“以营业执照登记为准”代替；缺资料保留字段并标明未提供／待核实，实收资本无可靠依据时不照抄第三方登记快照或添加例行核验说明，资本金额引用本轮事实，不从样本填充。表后不写文字说明；有证据显示重点信息不实或存在影响判断的重要冲突时，仅在内容单元格备注或紧邻表格的锚定批注提示，避免将未经核实的登记值写成确定事实。表头和全部单元格使用presentation.table_styles.compact统一定义的仿宋五号（10.5磅），章节内不写字体字号。
  - 核对主体身份、沿革、组织、股权控制链、对外投资及管理情况，关联适用的担保和关联交易。
  - 将授信事项、评价基准、材料范围及重大资料限制放入工商信息以外的相关固定小节正文，不新增同级章节。
  - 四、股权、股东及投资情况按三级标题“（一）股权架构”“（二）股东简介、持股情况”依次展开。股权架构只输出排名、股东名称、认缴资本（万元）、持股比例（%）四列表格，股东逐行列示并在末行列合计，合计行排名留空；完整已知数据由程序核对两项合计，来源定位和核查说明放锚定批注，不在表后添加正文，数值列只用事实／计算引用或明确缺口。
  - 股东人数、名单和资本金额均来自本轮材料，不预填参考样本。认缴资本不等同实缴资本；金额和比例可用引用精度参数保留两位小数，比例列单位为百分比，不混用小数比例与百分数；不因存在合计行就默认100.00，部分信息缺失或合计差异须披露并核实，未确认舍入规则不擅自容差放行。
  - 股东简介、持股情况按本轮股权表顺序逐户以“1、股东名称，持股比例为……”起笔，先明确每家股东的持股比例，并根据本轮股权、表决权及特殊约定识别控股股东；依据不足时写待核实，不把控股股东自动写成实际控制人。企业股东随后逐户介绍公司全称、简称、成立时间、主营产品及可核实的行业地位；简称、产品、排名、荣誉和行业地位均须有本轮来源及适用时点，缺项分别注明，不移植参考样例中的公司事实或评价。
  - 本章定位为确认借款主体、治理与支持关系。一、工商信息仅以完整表格核对登记与申请主体、存续状态及业务范围，不将注册或实收资本直接当作可用现金；授信事项、申请类型、评价基准及重要资料限制在其他相关小节交代。
  - 二、背景情况固定依次写“（一）公司概况”“（二）发展历程”“（三）近三年经营业绩”，三部分均保留且有本轮依据；缺某项材料只在相应部分标明缺口，不用泛泛的主体介绍或核查清单替代。
  - 公司概况写企业全称、简称、成立时间、是否合资及合资各方、当前股东和股权结构；股东名称与持股比例须和本章股权架构表一致，未证实合资性质不得推定，不在此重复整张股权表。
  - 发展历程按时间顺序写设立、出资、增资、收购及业务转型等有证据的关键事件，说明其对当前业务、股权或产能的实际影响；区分货币与实物出资，不用无依据的“持续发展”代替具体沿革。
  - 近三年经营业绩逐年列示评价基准前最近三个完整会计年度的营业收入和利润总额，标明年份、金额单位及单体或合并口径；利润总额不得用净利润代替，缺某年或口径不可比时逐年说明，不编造或以最新中期替代。可用一句话比较收入规模与利润总额的变化，原因及偿债分析留在后文章节。
  - 有沿革证据时串联关键事件、资源投入、形成的业务或能力及本次资金需求；股东简介与持股公司介绍分别按本节规定使用已核背景，不无依据扩写历史、股东实力或投资效果。
  - 三、基本组织机构情况只简要说明本轮材料可确认的主要部门名称、分组及隶属关系；不扩写部门职责、人数、授权制衡或内控有效性评价，不因缺组织图把已知部门改写成核查清单。公司部门机构图可在后续绘制后作为本节补充，当前不是必需图表；图文有重要冲突时在相应位置提示核实。
  - 四、股权、股东及投资情况以规定表格和逐户简介为正文主体；控股股东的识别依据与股权表一致，实际支持、担保责任和偿债作用在相关风险、授信及结论章节评价，不从股东行业地位推定对借款提供兜底。
  - 五、对外投资情况先输出一张持股公司名称、成立日期、认缴金额（万元）、持股占比四列表格，按本轮材料逐家列示；认缴金额须有本轮依据并换算为万元，持股占比标明百分比，缺值写未提供／待核实，不把被投公司注册资本、已实缴金额或账面投资余额当作认缴金额。表格后按表序逐家介绍持股公司的全称、简称、成立时间和股权构成，股权构成说明已核股东及持股比例；缺项分别说明，不从公司名称推测股东或填入样本公司。材料明确无对外投资时表内标明无对外投资并简述依据，资料不足时保留表格和简介缺口；投资义务、协同及偿债作用在相关财务和授信章节分析。
  - 六、法人代表及主要管理人情况执行management_profiles，正文仅按人分别成段介绍履历；不能将有详细材料的人员合并为一段姓名及“具备相关经验”的概述，也不加入团队评价、管理能力判断、核查说明或结尾总结。
  management_profiles:
  - 在六、法人代表及主要管理人情况内，按本轮材料中的法人代表或董事长、总经理或主要经营负责人、财务负责人及其他主要人员分别撰写履历；一人一段，可用“1、岗位及姓名”等段首标识，不固定人数或预填样本姓名。同一人兼任多职只写一份履历并列明兼任岗位，不增加固定二级标题。
  - 每份履历先写已核姓名、现职及起任时间，再写有来源的教育及专业背景、职称资格，按时间顺序列主要相关任职阶段的起止时间、任职单位与岗位，最后落到现职及当前兼任。保留与本单位实际主业、生产经营、采购销售、资金财务及风险管理相关的关键阶段，不能把多段经历压成“有多年经验”，也不强求无关早期经历、出生、民族或政治面貌等个人字段。
  - 历次任职、现职、交叉任职分别核对；履历中的“至今”限其材料时点，期后任职另标日期。同名人员、职务冲突及时间重叠的核查提示放在对应人员段落的锚定批注，不写入履历正文。
  - 正文只写有依据的任职和经历事实，不追加经历如何支持管理能力、团队互补与连续性、审批制衡等评价，也不写资料来源、补件要求或编稿说明；不以“经验丰富、管理完善”等概括替代履历。
  - 某人教育、职称或任职阶段缺失时，已知经历照写，缺口在该人段落的锚定批注提示；整份履历未提供时不编造人员或设置空白履历段，在本节标题的锚定批注标明缺失岗位及所需材料。不得以样本人员及经历补齐，不因一人缺件将全节改成待核实概述。
  operations:
  - 围绕credit_decision并结合comprehensive_assessment，按business_adaptation、report_expression及cross_chapter_consistency成文：以本单位产品或服务、盈利和履约模式统领数据解读，章末形成供给、履约、订单、收益及周转的综合判断，已证经营基础与限制同时具体交代。
  - 本章按operations_tables落实基础及适用补充表，每张表后执行table_interpretation；按counterparty_assessment和operating_stability说明上下游实际履约、订单与生产交付、盈利和现金能力及有依据的优势，不能仅凭固定标题齐全视为经营分析完成。
  - 按已提供材料解释主营产品和盈利模式；有对应资料时再写产能工艺、产销收支、供应商客户集中度及在建项目与资金安排，不为覆盖清单补造内容。
  - 区分自产、来料加工、贸易等业务及产能与产量；产销表、收入成本表、供应商与客户表只使用本轮资料，有缺口则保留分析位置并说明。
  - 本章定位为解释收入利润形成机制及资金占用链。一、主营业务情况保留固定二级标题，以已提供的产品、服务和商业模式材料为主体；生产经营资源、行业位置、研发与技术、在建项目及资金使用等侧重点仅在本轮有对应材料时选择展开，没有资料的主题连同其三级标题或段落省略，不列空白项，也不为凑齐主题写“未提供”“待核实”或泛泛补件提示。已有材料涉及的重点须充分写清，不能因某一侧重点缺资料而压缩其他内容；不套用样本事实或技术结论。
  - 业务概览写主要产品和服务、用途及对应业务线，逐期列有依据的各业务线收入金额、占比、占比分母和变化趋势，区分单体与合并、含税与不含税及收入确认口径；无可比数据时不编造趋势。商业模式分别交代卖什么、卖给谁、如何定价和收费，以及一次性、订阅、分成、项目制或加工费等实际适用方式；自产、受托加工、贸易及服务的货权、成本承担、交付验收、结算与回款差异按合同及执行证据写，不凭行业惯例代替本公司事实。
  - 有对应资料时，行业位置仅用有来源、时点、产品和地域口径可比的资料说明相关市场规模、增长趋势、竞争格局、本公司份额与差异化依据；份额应有同口径分子和分母，竞争优势须对应已发生的产品、客户、质量、成本或交付结果。仅有部分数据时只写可证实的内容，不强求份额或优势判断；完全无资料时省略该侧重点。详细行业政策与同业比较在第五章展开，本节只写与主营业务直接相关的定位。
  - 制造业有对应材料时，按可得证据写本部及子公司的设计、已投产和实际可用产能，匹配同主体同期间产量后计算利用率；说明关键设备的在用状态、工艺及其对产品和成本的实际作用、良率及统计口径、质量体系的认证范围和执行证据，以及维护更新或扩产所需资本开支。某项资料未提供则省略该项，不以中期产量直接除以全年产能，也不臆测效率、先进性和资金需求；非制造业务不套用产能、良率或工艺模板。
  - 有研发或技术资料时，按可得证据写研发投入金额及期间、研发团队规模与构成、核心技术及具体应用、专利、软件著作权和商标的权利人及状态；技术来源区分自主研发、外购与外部授权，说明有依据的授权期限、范围及依赖程度。产品迭代节奏以可核版本或上市时间为据，商业转化以已形成的产品、订单、收入或降本证据为据；未提供某项材料则不补写该项，整类研发与技术资料均未提供时不设置该部分标题或正文，不推定企业没有研发，也不以研发费用、专利数量或技术名称自动证明技术领先或收益兑现。
  - 盈利模式解释原料定价、销售定价、加工费或价差、成本承担、库存及套保环节如何连接；自产全额收入与受托加工费收入先核对确认口径，不以营业收入体量直接推断加工利润或资金需求。
  - 二、主营产销情况按“（一）主营产销量”“（二）主营收支”展开三级内容，先按本轮可得的近几年完整年度及当年截至评价基准的期间分产品、分业务统计产量销量和收入成本，再分别就表中关键数据作描述与解读；注明实物、金额、主体及期间口径。已有可比数据时列同比和同频相邻期环比，年度全年与当年累计、不同主体或不同产品口径不得直接比较；销量大于产量须核对期初库存、外购和统计范围，不能直接证明以销定产或无积压。
  - 对产量、销量、收入、成本、毛利及占比的突然上升或下降，结合绝对变动、基数、历史波动和业务影响选择重点，不设机械阈值；从原始数据追到订单和交付、产线运行、库存、客户需求、价格、加工费、产品及业务结构、成本和结算等对应证据，说明已核原因、企业解释、反向证据及对收益和现金的实际影响。原因链不完整时仅陈述已证变化与判断限制，不把同期变化或推测写成因果。
  - 收入变化按可得的量、价、加工费、业务结构证据解释，并与财务章勾稽；现货亏损与套保收益只有在对应关系、期间与会计口径有证据时才讨论抵补，不将期货盈利自动认定为稳定主业收益。有完整产销及收支时，具体指出主要业务贡献、结构迁移、数量与单位收益变化及其经营意义；同一产品与期间相匹配后再讨论加工费、制造成本、毛利和套保。优势须以资源或措施、实际执行、可核经营效果及持续条件形成链条；风险须说明异常指标、形成机制、传导及已有控制，不用单期增长直接认定优势或单期下降直接定性经营恶化。
  - 三、原料采购、产品销售情况按原材料采购、产品销售展开三级内容；主要供应商表与主要客户表分别使用operations_tables规定的六列表头并各自解读，不把客户表写成供应商表或把账期塞进结算方式。排名数量取本轮材料，有足够数据才计算前五大集中度，并交代期间、主体、分母和关联口径。
  - 采购现款现货与销售赊销需连成现金占用链，结合前五大及单户集中、合同期限、供货替代、客户实际订单与回款判断关系稳定性和依赖深度；关联或重叠、新增大客户、近期入股及控制权变更条款仅在有合同、股权或交易材料时分析，不以一般尽调风险清单发散。长期合作不直接消除供应集中风险，短合同账期不证明无逾期，含税交易表不能直接等同不含税损益表；优势和风险均须有交易事实、作用机制、实际效果或影响及适用限制的证据链，不作夸大结论。
  - 有在建项目时在一、主营业务情况内增设三级内容，逐项列项目身份、建设目标、实际进度、计划总投资、已投入及资金使用去向、剩余投资、后续资金需求、资金来源及实际到位证据，区分预算、合同承诺和已支付金额，联系第三章现金流和第六章流动性；样本可能新增模块的残留提示不写入报告，账面在建工程为零也不能单独证明无在建项目。
  financials:
  - 围绕credit_decision并结合comprehensive_assessment，按business_adaptation、report_expression及cross_chapter_consistency成文：总体结构与重大变动、重点资产和债务、利润形成、现金支撑、四组能力评价依次展开，差异核验服务于业务判断，不以差异清单替代整章财务分析。
  - 本章先按financials_tables列基础四表并逐表执行table_interpretation；资产负债表已有相关明细及可核实的正向经营数据列表解读，再按materiality_selection和六类focus确定分析重心；异常和重大变动按financials_tables说明并提示待核事项。对手方按counterparty_assessment联查真实业务能力，其他应付款与长期股权投资均为明确关注对象，不能只展开样例已写的几项资产。
  - 核对多期财务报表及口径，解释主要科目变动、盈利、营运、偿债、现金流与持续经营能力。
  - 三张报表及财务比率须注明主体、期间、币种、单位、合并范围、审计状态和来源；年度与中期数据不可直接同比，计算使用已注册且定义明确的算子或已提供可核验结果。
  - 财务比率及分析按financial_ratio_rows固定四组指标表，并围绕盈利能力、营运能力、偿债能力、持续经营能力分别展开分析；缺公式或口径逐项披露，不臆造行业阈值。
  - 本章定位为审查资产可变现性、利润质量及还本付息的现金支撑。三张报表先列多期原始数据，再分析重要变动和风险；重大性按金额、变化幅度及偿债关联判断，不凭空设置统一阈值。
  - 资产负债表重点审查货币资金及受限比例、应收账款、其他应收款与其他应付款、存货、长期股权投资、负债及权益，同时扫描衍生项目、预付、在建工程、票据和其他重大科目。每个入选项目先写具体时点余额、占比及分母、可比时点和差额，再依据明细、附注、合同、流水、账龄、期后收付或其他对应材料解释构成与变化，联系可支配资金、回收或偿付期限及偿债影响；企业解释、已核事实和审查推断分别表述，缺原因证据时只陈述已证变化与判断限制。
  - 资产负债表是时点数据：近几年年末相互比较，最新中期或评价基准时点与上年末比较须标明时间跨度，不称为同比；只有上年同日或同月末同口径数据才可作时点同比。大额余额即使变化不大也须说明资金性质和占用，下降不能直接写成回款或风险消除，增加不能直接写成经营改善或现金充裕；所有优势与风险判断须连到可核交易、受限、减值、到期和期后证据，不以单一余额或宣传性表述夸大结论。
  - 应收账款、预付款及其他应收款有明细时列主要对手方、两期余额、占比、账龄或逾期、关联关系、期后回款及减值证据；分母应与对应科目一致。对子公司借款与期货保证金区分，不能都解释成正常货款；称跨月尾款或暂时占用需期后证据。
  - 资金与票据联动分析：货币资金增长先拆可自由支配与受限资金，核对票据、保证金及敞口，避免用受限保证金重复覆盖偿债。票据低风险、现金充裕、低付息压力等措辞须有定义及证据，不只根据余额判断。
  - 利润表先按financials_tables完整列多期原始主表、核对勾稽并逐表解读，再分析收入成本及毛利、期间费用及利息净负担、减值、所得税、投资收益、公允价值变动和非经常项目如何共同形成营业利润、利润总额与净利润；引用已核金额、变化、占比及程序结果解释主要贡献，不只选最终利润为正或个别金融收益。区分已实现平仓与未实现估值损益，检查对套保和投资收益的依赖，连续盈利不自动证明主业造血稳定。
  - 趋势及结构按同口径历史和实际可比同行解释；费用下降是否体现管理改善须结合业务规模、利率、余额及一次性因素，收入与应收、毛利与库存预付、利润与经营现金等偏离先核对主体期间、确认政策和交易证据，损益符号先按报表语义核对。问题清单及可能调整金额按financials_tables留底稿，未证因果只写疑点和判断限制，正向与负向结论均须有支持、反向证据和经营现金影响。
  - 现金流量表先按financials_tables完整列多期原始主表及适用明细、核对勾稽并逐表解读，再分别解释经营、投资、筹资流入流出及净额；与利润、应收预付存货、资金受限、订单执行和第四章融资到期相互验证。重要变化逐项说明可比期间、原值、差额、已证原因及对现金创造与偿债的影响；数据冲突并列披露，不以其他材料覆盖用户本轮原表，也不将企业解释直接当成已核事实。
  - 中期经营净现金流为负时审查形成原因、期后回款和债务到期匹配；缺支持不得直接定性为季节性或时点波动。正向及负向信号均按report_expression形成证据链，现金流净额合理须有资金用途和来源的具体解释，不以年度历史为正覆盖最新恶化信号。建议聚焦本单位最重要且可行动的现金流问题或机会，说明前提及预期观察点，不编造已落实措施或保证效果。
  - 财务比率及分析先按financials_tables列四组16项多期指标表，行名固定、年度和中期列随本轮材料确定；原始值、程序计算值、口径待核及资料缺口分别标识，不用样例公司数字填表。表后按四组逐组解释关键数值、同口径历史变化、公司业务机制和对授信的影响，已经核定的有利变化与不利信号都保留，不把一组缺口扩成全章无结论。
  - 比率注明分子分母、平均或期末余额、利润口径、年化、单位及期间；两金、带息负债、营业现金比率等名称不能代替定义，营业收入利润率不能无核对套用现有净利率。无上年同期不能从年度表推出中期同比，年度值与未年化半年值不能直接排名；无定义或输入的单元格具名说明，样本指标需求不等于引擎已有算子或行业阈值。
  - 盈利、营运、偿债、持续经营四组各自从表中选本轮适用且可解释的关键指标，联系第二章产品产销与订单、第三章利润与现金和往来、第四章融资期限及第五章有来源的外部环境，说明形成机制、正反证据和持续条件。国际金属及市场行情只有与本公司产品、定价、套保或库存确有可核传导时才用于归因，不以宏观行情替代本公司事实；尚未核定指标说明提供方及解释限制，不自动按行业阈值评价。
  financing:
  - 围绕credit_decision并结合comprehensive_assessment，按business_adaptation、report_expression及cross_chapter_consistency成文：总体融资变化、重点机构及品种、实际可用条件和到期匹配、融资能力及约束依次说明，形成对经营周转的局部结论，保持无二级标题。
  - 本章按financing_tables落实机构授信用信两期对比表和必要的融资口径对照表，每张表后执行table_interpretation并联系operating_stability评价融资对供货、订单交付和现金周转的实际支撑，保持无二级标题，突出大额及变化较大的机构品种、可用条件与支付压力。
  - 核对机构授信、用信、未用额度、债务品种、到期结构及偿付情况，区分额度与余额。
  - 核对征信查询日与评价基准日，逾期、欠息、担保及或有负债结论须有当前证据；未提供不等于不存在。
  - 本章定位为审查融资可获得性与续接压力，不新增二级标题。按融资概览、机构明细表、品种与到期结构、征信及报表差异、偿付与再融资判断的顺序组织正文。
  - 按financing_tables列本轮可得近几年各年末及最新时点的全部机构授信、已用、未用额度和合计，保留历史退出机构及具名缺口，关联流贷、银承、信用证、保证金及敞口；另核授信有效期、单笔债务期限和到期分布。额度可否循环、共享或附条件需核对，未用额度不等于无条件可提款现金，机构用信不与报表借款简单相加。
  - 征信查询日、记录覆盖日与报表日分别说明，贷款余额、银承含低风险金额、信用证、授信占用及账面应付票据逐项核对；同口径才核验已用加未用等于额度，不能消除真实超限或未知差额。
  - 说明短债集中到期、融资集中、担保限制、续授信及已有财务公司合作用信的变化，偿付记录以实际证据为准；借新还旧、逾期、欠息是否存在不能从有授信或企业信誉好推导，影响传至第六、七、八章。
  - 总授信未变时仍解释已用和未用的变动、可用空间消耗、机构进入退出及集中变化；重点机构不以“部分银行接近额度”笼统带过，应引用具体占用或条件及经营影响。已兑现的融资渠道、历史偿付和续接支持按证据评价，无法确认部分与已经成立的融资基础分别表述。
  industry:
  - 围绕credit_decision并结合comprehensive_assessment，按business_adaptation、report_expression及cross_chapter_consistency成文：先确定本单位实际细分行业和价值链位置，再说明行业变量、政策适用、竞争能力及地位证据；企业经营事实与可核行业材料分别使用，不用证据缺口表替代全部行业分析。
  - 本章按industry_tables落实行业竞争格局表及适用的政策与同业比较表，每张表后执行table_interpretation和operating_stability，把行业趋势及优势落实到本公司供销、生产交付、订单和盈利能力；行业数据只作本轮可追溯背景，不将两份样例的行业数字直接转为当前事实。
  - 按实际业务说明行业环境、适用政策与竞争位置，区分时点事实、来源观点与分析推断。
  - 行业、政策与地位引用实际执行的专业检索或本轮材料；未执行查询不能写成经查询未发现。
  - 本章定位为将外部环境转为公司利润、现金流和竞争能力的影响。一、公司所处行业情况先按前文实际产品、收入与产销结构、营运模式和区域识别细分市场，说明行业发展阶段、产业链位置、上下游供需、技术产品分层及定价利润机制；用可核需求、产能利用、价格或加工费、订单及技术变化支撑阶段与趋势判断，不凭行业名称判定成熟或高增长。市场行情须注明品种、地域、期间及价格口径，国际与国内市场、现货与期货、名义价格与本公司实际成交分清；结合合同定价、库存、套保和结算解释订单、成本、收益和资金传导，不把行情同向变化直接写成本公司已证原因。
  - 上下游分析连接第二章实际供应商客户、采购销售、集中度和替代渠道，竞争分析覆盖可比产品、产能技术、成本价格、质量交付、替代品与进入退出条件；有依据时说明本公司相对位置。产业协同核对园区、区域产业集群、集团或上下游在原料、物流、能源、技术、订单等环节的实际合作、合同及效果，同时评价关联依赖、集中、切换和资源约束；地理相邻、同属集团或框架合作不等于已产生协同收益。
  - 二、主要行业政策同时核对国家产业政策、发展规划和本公司或项目所在地政府政策，优先依据发布机关原文及正式实施细则，记录文件名称编号、发布主体、发布与生效日期、有效修订状态、地域、对象及具体条款。逐项判断鼓励限制、准入、环保能耗安全、技术转型、需求和资金投入的适用影响，结合本公司产品工艺、资质、项目、申报批准和履行证据解释；规划目标、符合申报条件、已获批和资金实际到位分别表述，不因被鼓励或处于扶持地区就认定合规、取得补助或必然受益。缺实施细则或适用性证据时限定判断，不编造现行政策、政府承诺或支持金额。
  - 三、企业优势及行业地位按核心竞争优势、行业地位展开三级内容；将股东资源、技术产能、产品溢价、客户渠道、区位物流、质量资质与本轮经营证据连接，同时披露优势限制。
  - 行业排名、荣誉、市场份额和领先判断标明授予方或统计来源、年份、地域与产品口径；没有分母不推算份额，没有可比同业不宣称领先。股东资源优势与公司实得采购、融资支持分开，连接第六章竞争及价格风险。
  - 每项优势按资源或能力、落实方式、已发生经营效果、比较依据及适用条件解释；能确认具体供销、质量交付或区位效果而缺份额排名时，评价该项能力并限定行业地位，不将全部优势一并写成未知。内部评级、授信及定价制度归第七至八章核对，不混作第五章的行业政策。
  - 综合前四章已核营运、产品产销、利润现金、债务及融资事实，与有日期和范围的行业政策资料交叉验证，选择对本公司订单、单位收益、资金占用、合规投入和持续偿债影响最大的因素深入解释；已见优势、改善机会、不利趋势和剩余限制均按证据表达。预测和发展规划说明条件及不确定性，原因未证实则保留假设身份；正文形成行业及地位判断，核查补件可放锚定批注，不能用宏观材料或股东背景代替公司经营分析。
  risk_item_fields:
  - 风险描述
  - 事实依据
  - 影响程度
  - 发生可能性
  - 风险等级
  - 风控措施
  - 剩余风险
  risks:
  - 围绕credit_decision并结合comprehensive_assessment，按business_adaptation、report_expression及cross_chapter_consistency成文：每类适用风险落到前文具体对象、关键数据或事件、传导环节、已有措施及效果、针对性建议和剩余风险，不能换公司名称后仍是一套相同风险段落。
  - 逐项关联风险证据、影响、反向证据、既有措施与有条件建议；适用风险按本轮事实归纳为动态小节。
  - 经营与财务、偿债现金流、担保或有事项、诉讼负面事件、关联交易资金占用、控制措施及在建项目逐项判断适用性，不能因固定目录漏掉适用专题。
  - 本章按风险识别、风险评价、风控措施、剩余风险与结论组织；章首按对本次授信的影响和紧迫性概括最关键的3至5项已识别风险，不足时按实际项数，不制造风险凑数。本章小节名称、数量和顺序根据本轮原始资料及前文发现高度归纳，按重要性组织，不预设风险类别标题；概览回指详细事项，同一风险不因多章或多来源重复累计。
  - 每项风险使用risk_item_fields的七要素顺序，采用要素／内容表或同名段落并在本报告内保持一致。风险描述一句说明具体问题，事实依据回指前章数据、交易或发现及本轮来源，区分已核事实、企业解释、判断和待核事项；影响程度说明对利润、现金或到期偿付的传导，有输入及明确方法时用确定性计算量化，缺输入时列已知敞口、适用情景和量化限制，不编造损失或概率。
  - 发生可能性按适用评价口径以高、中、低说明依据和时间范围，已发生事项标明现状，不再以概率替代事实；风险等级综合影响和可能性，记录适用政策或已确认方法、理由及评价时点。未提供分级规则或关键证据不足则标待判定并说明限制，不能以缺件或未发现事件判低风险；不自创概率阈值、打分矩阵或信用评级映射。风险程度与正式信用评级、授信等级、贷款风险分类分别保持。
  - 风控措施逐条对应风险与传导环节，区分已落实措施及证据、拟议建议、待批准事项；每项写责任岗位或主体、完成时点或业务节点、验收证据、监测指标及触发处置条件。已有责任时点按原材料，建议岗位和节点明确标拟议，未定项写待确定及影响，不编造已承诺的人名、日期或数值红线。剩余风险分别评价现有措施后的真实暴露和建议落实后的条件性情景，说明执行有效性、覆盖不足、依赖及复核条件，不将拟议缓释提前抵减当前风险。
  - 本场景为财务公司授信，优先分析经营现金对到期本息的覆盖、额度期限匹配、短债长投、融资续作、用途与贷后监控；第一还款来源落到经营现金回收，资产处置、担保及股东支持另核作为补充或第二还款来源的权属、可执行性、时间和可用金额，不以支持意愿代替经营现金。风险结论回指第八章条件及第九章意见，是否授信、额度、期限和正式评级由相应决策或既有流程确认。
  - 逐项检查风险主题适用性：盈利质量与持续经营（核心利润、非经常依赖、毛利及客户依赖），客户供应商与合同（集中、到期、控制权变更、履约信用），资产质量（应收、存货、其他应收和关联占用、受限及权属），关联交易治理（定价占比、控制人、内控执行、披露），合规法律（资质、环保安全、适用数据合规、诉讼处罚、担保表外），税务（优惠条件持续性、欠税补缴），行业市场及套保，财务信息真实性（勾稽、未完成交叉验证、审计意见及口径变化）。有实际并购投资或项目影响借款人偿债时，另查估值假设、整合、管理层稳定及补偿承诺可执行性；这些是适用性检查，不是默认每家公司均有风险。
  - 措施按业务适用性考虑授信或提款前核查、授信结构与合同保护、增信担保、贷后管理：流水函证盘点解决具体疑点，期限用途和先决条件控制资金安排，担保抵质押保险核对生效与执行，报告检查及资金监控明确指标、触发和处置权限。价格调整、托管、分期对价、业绩补偿、委派管理和退出等只在本次事项或底层交易确适用且有权限依据时提出，不将PE并购或IPO清单机械套入授信。建议须针对、可执行和可检验，未知参数列待确定，不止写“加强管理”。
  - 对外担保或有事项、关联交易资金占用、诉讼负面事件、在建项目和控制措施须逐项审查适用性，按实际传导归入动态风险小节并与第七章核对；未知与不适用分别说明，同一事项不因多来源或多章提及重复计数。
  - 区分已暴露问题、潜在风险因素和证据缺口，说明影响对象及轻重依据，不能将每个缺件重复计作独立风险。措施既说明已执行安排的依据与缓释限制，也提出对应收付、履约、敞口或到期环节的动作、适用前提及核验成果，不能全部归为收集材料或无据承诺降低风险。
  credit_policy_application:
  - 第七至九章建立制度、经营事实、外部结果和审查意见的对应关系。制度先核对发布方、名称编号、生效修订日、适用成员范围及当前有效版本；空白计分表是规则，不是本公司的评分结果。标准报告仅为深度参考，其中的等级、额度、期限、信用方式和查询声明均须本轮证据支持。
  - 用户提供的客户信用评级管理办法及工业、商贸附件可作本次规则来源，具体条款见场景规格第20节。只有本轮归档版本及成员资格匹配才引用相应权重、分档和限额，不将某一企业规则变成所有机构通用阈值。制度原文、工作簿公式、外部已认定结果与样本结论冲突时分别标识，提交解释或复评，不静默选择有利版本。
  - 区分信用评级、授信等级、风险程度及贷款风险分类；只有制度明确关联时才建立映射。分别记录计分底稿、初评、审核、信贷审查委员会审定及有效期状态；已有分数和等级照实标识提供方及身份，缺审定记录不得说已批准，也不得把已有初评写成完全没有评级资料。
  - 监管流动资金贷款管理办法对经批准设立的非银行金融机构规定可参照执行；核对财务公司适用实施细则及具体产品。监管贷款期限、内部授信期限、评级有效期和单笔借款期限分别审查；评级管理办法不能代替信贷业务授信管理办法或业务议定定价文件。
  credit_rating_sources:
  - 本轮用户指定的信用等级测评计分表XLSX是标准分及计分规则来源，工业／商贸两表分别按经营性质及资金运用选择；F5、F11、F14、F18、F22、F26的六组标准分为25、15、10、16、16、18，基础合计100，F30的10为股东管控附加上限，不并入基础标准分合计。该口径只用于已核适用的指定版本，固定表格中的标准分仍绑定本轮归档来源，不能把配置数字直接当事实引用。
  - 评级得分来自所选表的D至G列定义、阈值及计分方法，与本轮公司审计财务、经营治理、人员、发展规划、实际支持和征信履约等证据结合形成初评底稿；已有评级材料并行复核。监管流动资金贷款管理办法的调查与风险评价要求作为核查依据，不是具体分值、权重或等级区间来源，也不能以流贷额度测算替代信用计分。
  - 信用等级评定参考本轮用户指定信用评级管理办法第十条及总分等级表，结合计分附件的附加条件及等级上限形成建议等级；业务部初评、风险管理部审核、信贷审查委员会审定分别标识。具体原件、哈希和页格定位见docs/scenarios/财务公司授信评审-评级来源与计分口径.md；新运行须将适用规则作为政策材料归档，不能直接复用历史项目公司事实或审批结果。
  credit_scoring_review:
  - 先按实际经营性质及资金运用识别工业或商贸口径，混合业务说明选型依据并由评级流程确认。分别核对偿债、盈利、营运、经营管理、发展前景、征信六组及附加项；记录每项公式、标准分、输入期间和单位、来源定位、已给得分、扣分理由及认定状态，不把工业标准用于商贸。
  - 定量项逐项覆盖资产负债率、流动比率、净资产、已获利息倍数、经营活动净现金流量、利润总额、资产报酬率、应收账款/存货/总资产周转率。区分净利润、利润总额、营业利润与利息费用，利息费用不直接等同财务费用净额；期初期末平均、月均、单体合并及审计年度不得混用。最新中期用于预警，不能直接替换年度评分基数。
  - 按credit_rating_sources取得规则和公司输入后生成或复核逐项初评底稿，记录原值、定位、公式、计分条款、分项得分及认定状态。明确的量化公式、线性扣分与四舍五入由确定性程序计算，已有同口径描述性比率可用report calculate；定性项依据实际证据选择档次和具体分值并解释理由，不能默认满分或仅因缺资料判低分。规则或输入不全的项目待核，不以样例总分反推；当前CLI未新增统一自动评分算子，计算方法及结果须单独归档后引用，不能把写入配置说成自动评分已实现。
  - 工业与商贸表的负债率、利息保障、资产报酬率及周转标准不同；利润总额触发资产报酬满分的条件是严格超过相应阈值。商贸贷款资产形态的标准分与最高档文字分值存在不一致时原样并列，交制度解释，不擅自改成工业取值。
  - 定性评分逐项联系前文：治理机制对应股权和实际管控，领导者素质对应履历及管理成果，管理水平对应制度执行；规划目标对应订单和资源安排，政府及股东支持对应可落实支持，成长性对应技术、产品和经营改善。信用三项分别核对贷款风险分类、到期信用偿还和利息记录，覆盖本财务公司及其他机构；不能从有制度、集团背景或无查询结果默认满分。
  - 附加股东管控分单列，核对基础分适用门槛、全资或关键三岗委派/兼任事实、完全与基本管控分支、加分上限及加分后等级上限。不得仅以持股或集团成员身份加分，不将“不超过”解释为一律加满，也不将空白附加项当作已确认零分。
  - 一、信用评级必须输出信用等级评定表，固定四列表头“序号｜评级指标｜标准分｜评级得分”及required_tables.fixed_rows的七项指标、合计和信用等级评定行，缺评分资料仍保留整表并在各未知格写未提供／待核实，不用整表具名缺口代替，也不留空白。评级对象在表题之前单独注明本轮公司全称、所用财报年度及审计状态；表题与表格紧邻。标准分按credit_rating_sources所选规则，得分用可复核初评计算或已提供评级材料并标身份；采用本轮指定附件时，附加项标准分取F30的10并在表注注明附加上限，基础标准分合计100不变，不因旧样例为“-”忽略原件。缺附加事实不能默认零，不移植样例公司、年度、87分或AA级。
  - 表后解释评级提供方、制度版本、初评或审定、有效期及主要扣分依据，缺明细或审定时清楚标状态并保留已有结果；详细复核链可留底稿。合计核对本轮规则中基础分、附加和上限处理，不自行补分或以样例总分反推分项，未核定总分不能映射确定等级。不能让总分掩盖盈利薄弱、现金转差等反向证据；同比持平须有同规则上期结果。评级更新、重大经营财务困难、重大违约、虚假材料或重大诉讼触发复评的影响传至授信条件。
  - 已核总分按指定评级办法第十条匹配90—100为AAA、85—89为AA、80—84为A、70—79为BBB、65—69为BB、60—64为B、50—59为CCC、45—49为CC、40—44为C、40以下为D，再核对附加评级不超过A等适用限制；仅为初评计算的须明确标“建议等级／待审核审定”，不得充当正式评级。缺项、小数总分处理未明、越界或规则冲突时保留等级待核，不插值或任意进位，不自动转化为额度、期限、定价或担保资格。
  working_capital_review:
  - 一、授信额度按用户授权先测算、再综合论证建议，不限于抄录外部结果。额度测算核对表逐版本列上年销售收入、销售利润率及利润定义、预计增长与预测收入、五类周转天数及周转次数、自有资金及构成、现有流贷、其他渠道资金、营运资金量、贷款缺口、申请及存量、建议额度和外部结果；每项标原始取值或程序结果、主体期间、口径来源和状态，金额统一万元。资料部分不足时保留可算项目及受影响结果，不默认缺值为零或删除已有经营需求。
  - "营运资金量＝上年度销售收入×（1－上年度销售利润率）×（1＋预计销售收入年增长率）÷营运资金周转次数；流动资金贷款额度（测算缺口）＝营运资金量－借款人自有资金－现有流动资金贷款－其他渠道提供的营运资金。以本轮实际参数用确定性程序计算，记录公式版本、输入来源、单位换算、完整精度结果及展示舍入；百分数先按明确单位换成比例，0.11%对应0.0011，不套用示例值、结果或倒推参数以凑额度。已有外部底稿同时核对单元格公式、缓存、文字及签认身份，差异保留并解释，不择高覆盖。"
  - 周转次数取本轮有依据的原始精度值，或在口径明确时计算为360÷（存货周转天数＋应收账款周转天数－应付账款周转天数＋预付账款周转天数－预收账款周转天数）；各周转天数和平均余额沿用适用底稿，收入对应应收及预收、成本对应存货预付及应付，平均方法与调整有来源。该360天测算口径与第三章实际期间财务比率分开；次数或现金循环分母非正、输入冲突或定义未明不硬算有效额度，负缺口如实列算术结果并解释未显示新增缺口，不改写为负授信或自动批准零额度。
  - 月均与期初期末均值版本并列追踪；核对票据及应收款项融资是否纳入应收、合同负债是否纳入预收、存货增长或保险系数有何业务根据、零余额替代数是否只是技术处理。版本选择须结合真实采购现付、销售赊销、季节性、价格和库存、自产与受托加工的资金承担，不自动采用能覆盖申请额的高值。
  - 预测销售增长须有预算、订单、销量价格及业务结构依据，区分目标、预测和已实现收入；铜价或其他原料价格上升形成的收入增量不自动代表利润或销量改善。销售利润率的分子须按本轮适用定义核实，利润总额、营业利润、净利润及毛利不得互换；缺原始比率时仅按明确口径与上年收入计算，不能直接用第三章净利率替代。逐期核对自有资金所含权益、长期资金及扣除非流动资产等构成，明确科目名称、日期、可用于经营的条件及调整，不能把示例括号内三项数字当统一定义，受限资金与保证金不得重复作为可用资金。
  - 新增流贷缺口、财务公司续授信总额、集团统一授信、综合授信额度、品种分项、存量余额与本次增量分别标识。现有流贷须查明是否含本财务公司存量、续作和扣除时点；如仅扣外部银行贷款，说明结果身份及避免重复融资的依据，不能把保留本公司存量的结果再全额视作可新增投放。
  - 核对其他渠道营运资金是否实际扣除及零值依据、票据和信用证的敞口与保证金、授信共享和可提款条件，不能把所有机构额度相加为可用资金，也不把同一资金重复扣除。多个版本、计划收入或融资口径冲突逐项写影响、需确认的选择及受影响方案，不用一个精确结果掩盖定义不明。
  - 测算缺口是本次额度建议的量化依据，先将申请、存量及续作、本次新增、综合授信总额和品种分项调成可比口径，再结合真实采购及周转需求、可用融资与到期债务、盈利和经营回款、股权治理及可落实支持、主营产品市场地位和营运能力、历史合作及征信涉诉形成建议。按重要性聚焦需求与第一还款来源，优势和不利变化共同权衡，不以收入、产能、合作黏性或战略定位直接证明现金充足、用途合规或风险可控；集团背景不等于生效担保或信用兜底。
  - 依据齐备时给出具体建议金额及维持、调增或调减身份，解释与测算、申请、存量的差异、取整及有效政策约束和条件，不能机械按公式全额授信、无依据加成，或照搬10亿元等示例结论。新增贷款建议如超过同口径测算缺口，须有适用制度及另行核实的需求依据；不能用股东支持或业务发展笼统覆盖差额。关键口径未明时给出可确认部分及受限结论，不编造确定额度；计算结果、审查建议与已批准额度分别标示，正式审批权限保留，方案变化传至第六及第九章。
  credit_terms_tables:
  - 第八章授信要素依据表按额度、期限、担保、利率、用途、还款来源列本次申请或外部结果、审查意见、适用制度/经营依据及前提状态；无值写待确定。正文仍在六个固定小节分别解释合理性；表格不是对所有要素自动赋值的规则。
  - 二、授信期限先说明本次所用信用等级、初评或正式审定身份及有效状态，再核对本轮适用《江西铜业集团财务有限公司信贷业务授信管理办法》或实际有效制度的版本、条款、客户范围和等级期限映射，列明制度允许最长年限与本次建议期限。结合真实经营持续性、盈利现金、采购销售回款周期及债务安排解释建议，足证时直接提出具体年限；上限不自动取满，不能以监管贷款期限或评级一年有效期代内部映射，也不把初评当正式等级。未有映射或评级未审定时限定期限意见及生效条件，不照填XX级、N年或样本三年。
  - 授信有效期、单笔借款期限、提款及还本安排分别核对，已明确起止日及起算条件按材料表述，未定不自造日期。评级有效期届满要求更新，不等于已生效授信自动到期或自动缩短；评级更新对定价、贷后和期限按具体制度，不机械改写合同。最新经营、现金或征信不利变化须带入期限合理性，不能只凭历史盈利写经营稳健。
  - 还款方式按本轮适用监管及内部细则核对；期限超过一年的单笔流动资金贷款，在借贷双方协商基础上原则上实行本金分期偿还，审慎约定每期还本金额并与回款匹配。不能将多年授信有效期等同于单笔贷款期限或默认到期一次还本，未落实的还本结构作为方案条件。
  - 三、担保方式先列本次申请及建议采用的信用、保证、抵押或质押方式，再按适用制度核对信用等级、客户及产品准入、风险限额和必要缓释条件。制度及经营偿债依据齐备支持信用方式时，可明确建议以信用方式授信并解释依据与剩余风险；不机械要求增加担保，也不从评级高、集团股权或支持意愿直接推定信用方式资格。初评条件未落实、政策未取得或存在重大反向证据时说明受限判断及需确认条件，建议与已批准身份分开。
  - 方案涉及保证或抵质押时，按已有材料说明提供方、资格能力、权属及价值依据、覆盖金额范围和期限、顺位及落实状态，核对是否实际可执行；仅拟议或尚未签约登记的不能写已生效。信用方式与集团支持、正式保证分别表达，不将股东背景视作隐含担保；不因样例为信用方式忽略本轮适用等级的增信要求。
  - 四、授信利率以本轮适用的江西铜业集团财务有限公司业务议定方案及相关定价文件为依据，核对版本、审批或生效身份、适用公司产品及币种，说明已明确的年利率或定价机制，以及固定浮动、基准加减及调整等实际相关条件。已有有效方案支持时，正文可简洁写按该方案及相关文件执行并清楚指向依据；按机制定价而具体利率待单笔合同落实时据实说明，不将未确定写成既定利率，也不自行填利率、基准现值或优惠幅度。只有文件名称或泛称而无有效内容时写待确定并披露影响，核查细节放批注。
  - 五、借款用途用本轮公司全称及实际业务写明本次授信支持的生产经营周转范围，连接额度测算中的采购及结算需要；原料名称、采购加工或其他日常支出仅按真实合同、订单、预算及资金计划说明，不沿用样本公司、电解铜等个案或笼统覆盖全部支出。核对支付对象、用途性质、货物流转和资金路径，区分拟议用途、公司说明和已核实交易；用途合规评价须有相应依据，不能以承诺或报告措辞代替核验。
  - 按适用监管与内部制度核对流贷禁限用途、关联转借及实际挪用线索，说明对应的受托或自主支付、提款及用途监控条件；具体金额标准取有效依据，不将授信总额当单笔支付金额。原材料采购和其他周转的已证需求充分时作清楚用途建议，缺资料只限定相应范围，不把所有用途写成禁止事项。
