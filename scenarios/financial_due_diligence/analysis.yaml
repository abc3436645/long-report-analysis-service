analysis_tasks:
- id: risk_review
  goal: 综合评价业务公司的经营及其他能力，挖掘有证据的优势与发展潜力、排查潜在危险，审查证据与策略依据
- id: external_result_check
  goal: 核对外部额度、等级、期限的主体、时点、版本和适用范围
retrieval_tasks:
- id: enterprise_events
  input: professional_records
  need: 担保、诉讼和在建项目的专业记录
  ttl_days: 7
writing_guidance:
  comprehensive_assessment:
  - 场景目的在于充分了解业务公司的实际经营情况及其他重要方面，客观真实地评价综合能力，支持识别优质公司和排查潜在危险公司；优势及价值识别、潜力分析与风险排查共同服务于评审，不能将尽调缩减为找风险或补件清单。
  - 按本单位实际业务综合考察治理与管理团队、商业模式与履约、产品技术及服务质量、上下游与订单渠道、盈利及成本效率、资产质量与现金、融资偿债与信用、行业位置及发展条件、合规与可落实资源支持。各维度同时核对已有能力成果、制约或预警、持续条件及证据局限，重要性决定篇幅，不强制正反各半或每项都有优缺点。
  - 优点按资源或能力、实际运作、已发生经营效果、持续和可复制条件形成证据链；有可比资料再解释相对优势。主动挖掘生产交付、客户留存、技术质量、成本周转、回款管理、组织治理及资源协同等已见成效，不能仅把“未见风险”当作优点，也不以品牌、资质或背景替代成果。
  - 发展潜力区分已实现能力、正在落实的改善与预期机会，核对需求客户、合同订单、技术或服务应用、实施资源和资金等支撑；说明实现条件、进度与不确定性。尚未落地的机会不写成已兑现收益，现期承压也不自动否定有证据的改善能力。
  - 潜在危险关注可能削弱持续经营、履约、资产回收或偿债的趋势和具体异常，说明对象、形成及传导、影响程度或紧迫性依据、已有控制和剩余暴露；不只寻找已发生损失，也不把一般行业波动、单项异常或材料缺失直接判为危险公司。
  - 同一经营安排可能既形成能力又带来依赖，应分别评价收益贡献、风险成本及约束，例如长期交易关系的供销基础与集中依赖、融资便利与到期压力、成长投入与现金占用。优点不无依据抵销重大风险，风险也不掩盖已核实的经营能力；控制有效性和资料充分性与企业能力高低分别表达。
  - 对优质基础的识别重点说明竞争或履约能力、真实盈利和现金兑现、管理执行及持续性有哪些证据；对值得关注的公司说明薄弱环节、恶化迹象、传导及可改善条件。资料不足则限定哪些维度尚不能判断，不强行给公司贴优质或危险标签，不新增通用等级、评分阈值或自动名单，也不替代正式评级和授信审批。
  - 第一至第五章形成能力、优势、潜力及约束的实质分析，第六章集中评估风险和缓释，第七章核对信用与履约，第八章评价授信要素，第九章综合各维度说明经营质量、持续能力、风险承受及当前意见。结论可依证据支持合作基础、提出持续观察或风险核实建议，具体业务决定仍按适用政策和既有流程。
  business_adaptation:
  - 先从本轮材料识别被评审单位的行业、产品或服务、经营模式、评价基准、法人及合并范围、授信事项和资金组织方式，再选分析维度；场景保存业务问题、证据要求和论证方法，不保存样本公司的事实答案。
  - 企业及关联方名单、股权控制、人员履历、产品牌号、设备工艺、产能、区域、客户、合作机构、订单、会计成因、优势风险及结论均由本轮证据确定；不预置样本的主体、金额占比、年份、岗位人数、荣誉、评级、期限、政策版本或测算参数，不要求其他公司复现同一业务链及正面结论。
  - 制造或加工业务关注原料、产能工艺、产销和加工收益；贸易业务关注采购销售、货权物流、价差及结算；服务或项目业务按实际合同关注履约资源、进度验收和收费回款，混合业务分开说明。固定标题保留，标题中某一行业因素不适用时说明依据，转而分析本单位对应的竞争、履约或价格风险，不伪造产能、套保或加工费。
  - 材料完整时充分呈现事实、解释及可作出的评价；仅部分缺失时分析已有事实并限定受影响判断；确实不适用时写依据。个案缺失不成为通用的默认缺失清单，材料未提供不等于事项不存在，也不意味着所有其他判断都停止。
  - 对比样本只学习问题覆盖、论证顺序、专业表达及证据深度；样本因果、政策与肯定性结论须重新验证。不得以与样本语气或篇幅相似为由预设低风险、稳定经营、股东兜底或支持授信。
  report_expression:
  - 全文采用面向评审人的调查报告表达，先交代本节已核实的情况和关键比较，再解释经营机制及能力、优势和风险，最后形成有边界的判断与必要条件；结合business_adaptation适配本单位，不把规则清单或写作提醒原样交付。
  - 正文直接写对象、期间、数据、解释及结论，避免反复使用“不能据此认定”“应进一步核实”替代实质判断。将限制落到具体事实和影响，例如已取得哪些资料、哪项形成机制尚未证实、因此哪一项判断仍保留；不削弱真实不利发现或为顺畅而省略限制。
  - 每个固定小节及第四章正文都应回答其业务问题并作出局部结论；局部结论可为有据支持、存在约束或证据不足以判断，写清适用范围。资料和定义齐备时要作相应评估，不默认每节都以补件收尾；结论强度不超过证据。
  - 来源就地可追溯，正文以原业务资料及具体内容说明依据，技术定位可保留在来源注释；不把解析、冻结事实、缓存处理、内部任务、测试验收或如何遵守场景规则写成企业经营分析。外部测算未签认时表述提供方、适用版本及未确认影响，不用实现细节代替业务状态。
  - 首次出现单位及重要关联方时明确全称与必要简称，统一被评审单位、股东、子公司和评审方称谓。调查、查询、访谈、现场核查及企业承诺只按实际记录陈述，不以样本“我公司已调查”或多平台查询的句子假定本轮已经执行。
  - 金额展示统一执行scenario.presentation.amount_display：表格及图形中的金额（含图内金额差额）均为万元；正文金额绝对值达到一亿元时使用亿元，未达到时使用万元，封面额度按同一正文规则选择单位。先按原精度判断边界再换算展示，默认保留两位小数；比例、数量、单价及其他非金额单位保持各自口径，核验使用原精度。正负方向用“减少某金额”或“变动额为负”准确表达，基数不可比不硬写增速，同名异义指标分开命名说明。
  - 金额以本轮核实的独立数值及元、万元或亿元单位引用，不手写换算结果或以长段原文替代独立金额；fact/calc引用由程序换算，引用精度表示换算后的小数位。金额表头或表注标明万元，混合信息表无统一金额表头时金额单元格自带万元。币种或量纲未知时先核实，不把外币、元每吨等单价或未提供值当人民币金额转换。
  - 篇幅服从重要性与证据，普通登记信息简述，重要经营和资金事项充分展开；同一事实先在职责所属章节解释，后文引用其对风险或方案的影响。避免逐格搬表、反复贴同一限制、无依据的宣传和可用于任意公司的空泛段落，不以表数或页数增加代表深度。
  body_and_annotations:
  - 正文面向财务公司专业评审人员，按章节主题直接陈述业务公司的事实、经营机制、比较分析及判断。工商直接列登记信息；股东按户介绍全称、持股、主营背景及与公司的关系。调查对象说明、资料快照、交叉核对过程和编稿依据不得充当本节业务内容。
  - 核查过程、资料来源与技术定位、待补材料、口径复核步骤、编稿提醒及参考稿使用说明放锚定批注，不在正文反复写“本轮”“不能照搬样本”“应由经办核对”。事实、数据、表后分析和实质结论不得全部移入批注；不得仅用批注满足章节业务覆盖。
  - 已发现的资金受限、回款及关联占资、减值、现金缺口、融资依赖等实质风险在对应正文中说明对象和经营影响。未决事项影响额度或结论时，正文简述其业务后果或用“待确定”等准确状态，具体证据冲突和补件步骤放批注。不得通过移入批注把有条件结论改成无条件肯定。
  - 单位、期间、单体或合并、审计状态、合同约定与实际执行等理解数据不可缺少的口径，用表头、简短表注或明确归属表达。批注补充详细来源和核查记录；企业解释在正文注明“据公司说明”，假设不写成已证原因。
  - "使用独立的HTML批注块，格式为 <!-- review-note: 提示内容 -->，置于对应段落、表格或标题之后，块内不含空行；缺表的具名“资料缺口：表名：影响及所需材料”可放块内独立一行。引用仍使用本轮fact/calc/ev并受证据绑定校验。Word按presentation.annotations生成原生批注，来源ev定位自动转批注；不要手写正文尾部长文件名、行号或命令。"
  - 独立审阅逐章检查主题内容充分性、正文与批注分层、实质风险及限制是否保留，并回看批注锚点、来源和缺件是否可定位。发现核查叙述挤占正文、股东简介缺少分户介绍、表后仅写待核或风险只在批注时，判needs_changes并重写；不得以机械校验、批注数量或页数替代内容审查。
  chapter_body_focus:
  - 第一章写登记事项、背景沿革、治理组织、分户股东及投资、管理人员；缺履历或架构的补件要求放批注，不以治理核查清单替代已知组织事实。
  - 第二章写产品和经营模式、产销、收入成本、采购销售及合同安排，解释数量收益与结算资金传导；合同与实际履行分清，台账核查步骤放批注。
  - 第三章写财务报表、重大科目、利润现金及财务能力，保留金额期间及表后分析；重分类、差额未调节对可用现金等影响写正文，勾稽过程和计算公式放批注。
  - 第四章写机构授信、用信、融资品种和可用性、到期压力；不以融资台账核对要求代替融资现状。
  - 第五章写行业特点、适用政策、公司优势和行业地位，区分现实成果与潜力条件；检索过程、政策来源定位和资质补件放批注，不宣称无证据排名。
  - 第六章写具体风险暴露、传导、已有控制及建议措施；建议可在正文，但要对应本公司实际风险，不掺编稿提示，不把建议写成已落实。
  - 第七章写正式评级状态、征信结果和涉诉事项，保留查询时点及已知案件状态；缺结果时简明标识，查询步骤、更新任务及完整性提醒放批注。
  - 第八章写额度、期限、担保、利率、用途与还款来源；已知申请与建议、存量与新增分清，未定要素明确标识，制度核查和补件步骤放批注。
  - 第九章综合经营与偿债结论、关键风险及授信方案和实质前提；方案只列有依据值，待定要素不伪造，编辑填写和签章操作提醒放批注。
  cross_chapter_consistency:
  - 在分析底稿逐小节记录本轮业务问题、事实及计算依据、解释、局部判断、限制与正文落点，覆盖31个固定二级标题和无二级标题的第四章；写作时核对本轮证据是否实质进入判断，不只确认标题和引用存在，不强制在报告新增底稿表。
  - 同一主体、对手方、产品、期间、控制关系、交易性质、数量金额及指标定义贯穿全文；持股与控制、销售流量与债权余额、母公司与合并、认缴与账面投资、贷款与票据敞口等身份分别保持。冲突并列说明影响，不能在不同章节各选一个口径而形成相反结论。
  - 经营模式及订单支持第二章产销收益，采购回款及资金占用连接第三章报表与第四章融资；第五章优势落到已证经营效果，第六章风险落实前文对象与传导，第七章结果及履约影响第八章要素，第九章仅综合已有发现和条件。
  - 结论中的每项重要优势、主要风险、缓释措施及授信要素均能回指前文依据；已披露的不利事实、政策缺口或模型冲突不得在结论消失，有依据的经营基础也不被补件清单淹没。后补证据改变判断时同步更新受影响章节，缺少定量或政策依据不推导新的额度、等级、期限或风险分数。
  boundaries:
  - 所有业务事实来自本轮归档、核验及冻结材料；参考报告只用于标题、字体与内容深度，不自动成为当前证据。
  - 外部额度、信用等级、期限及其适用政策按主体、事项、评价基准、版本和来源核对；缺失时逐项披露，不移植样本的额度公式、等级或期限。
  - 样本用于学习逐章分析方法，不预设支持授信或低风险结论；股东背景、历史盈利、未用额度、短账期或已开展套保均不能单独证明偿债安全。
  analysis_sequence:
  - 全文围绕comprehensive_assessment展开：主体治理与管理基础、业务及其他方面的能力和优势、增长改善条件、收益和现金兑现、潜在风险与缓释、外部结果及授信条件的匹配，形成客观综合评价；不是仅在结尾附加几句优点后继续以风险清单统领全文。
  - 每个小节先回答本节业务问题，再按有来源的事实和变化、原因、对经营及偿债的影响及局部判断展开；核实动作依body_and_annotations进入批注，表格承载比较，正文解释变化，不逐格复述或重复公司宣传。
  - 重要判断同时核对支持和反向证据；将企业解释、专业来源观点、审查判断及建议分别表述。原因未经核验用待核实表达，不把规模大、集团背景或连续盈利直接写成风险可控。
  - 起草前按cross_chapter_consistency建立本轮分析要点与证据落点，逐节完成事实、原因、评价和限制，再按report_expression将其组织成专业正文；不要把工作底稿中的全部校验说明搬入报告。
  evidence_requirements:
  - 按实际可得材料组织连续年度与最新中期比较，样本三年及一期是深度参考，不固定年份或伪造缺失年度；资产负债为时点，收入利润现金流为期间，年度与中期分别呈现，同比需要上年同期依据。
  - 表格就地标注主体、期间、币种、单位、母公司或合并范围、含税或不含税及来源定位；财务章另说明审计机构、审计意见和中期审计状态，未提供则披露，不默认为已审计。
  - 建立股东及投资、产品产销、产品收入成本、主要供应商客户、三张报表、重点往来、财务比率、机构授信用信及外部评级结果的材料需求；按本轮事实列示，有适用缺口保留分析位置并写影响，不把无资料视为零值或无事项。
  - 金额加总、差额、比例及勾稽用程序或可核验的既有结果；financial_metrics注册描述性财务比率，由report calculate按fin.字段、financial_scope、period_start和period_days确定性复算；metrics不注册额度算子，外部额度结果仅核对。本轮未定义的派生数值保留公式、输入定位与方法后归档，未知口径不由语言模型口算填表。
  - 经营表与财务报表、母公司与合并、含税交易额与不含税收入成本、认缴投资与账面长期股权投资、授信用信与征信融资余额分别核对，差异先说明时点和范围，无法解释保留冲突，不强行改成一致。
  - 管理人员材料按人提取教育及专业背景、职称资格、历次相关任职的起止时间与单位岗位、现职起任时间及兼任，不只取姓名或材料首行代表整份履历。交易材料同时提取对手方身份、合同有效期、数量及定价、交付付款、赊销限额、订单履行和回款记录，使后续能力与风险判断有可引用事实。
  - 核对字段真实业务含义后再填表；原单元格混写结算方式、账期或备注时，按可核内容分别呈现并保留原定位，不把账期重复当支付工具。比率和倍次单位逐项清楚标识，定性评价列按各行具体事实填写，不整列复制同一句待核提醒。
  materiality_selection:
  - 重点科目按金额较大或金额变动较大分别筛选，二者任一成立即展开；另将诉讼逾期、关联占用、受限保证金、重分类、集中到期等性质重要项目列入，不仅按增长率排名，不因下降或变动不大而略过大额余额。
  - 金额大小结合本单位资产负债规模、权益、自由现金、收入利润及该科目占比判断；变化同时看绝对变动额、相对变动率和对总变动的贡献。不存在预置的统一万元、百分比阈值或仅取前几项规则；有本轮明确的重要性标准才按其筛选并注明依据。
  - 先扫描完整资产负债表及附注，重点核对货币资金、应收账款、其他应收款、其他应付款、存货、长期股权投资及负债，同时检查预付、交易性金融资产、合同负债和其他大额或异常科目；重点清单不是只允许分析这些科目。
  - 分析底稿记录重点科目筛选清单，包含科目、对比时点余额、本期时点余额、绝对变动额、变动率或不可比说明、相关占比及分母、入选理由、明细及解释证据状态；正文在科目分析开头交代金额大、变动大或性质重要的具体依据，不强制另加筛选表，未取得附注明细也保留已识别重点及其缺口。
  - 比较最新时点与上年末等同口径时点，必要时追踪前期异常形成与本期消化，不称为中期同比；小基数高变动率不能单独决定重点，基数为零、负值、科目新增或重分类时披露，不硬算无意义增长率。金额和变动由程序或可核验结果支撑。
  - 每个重点科目按余额与结构、变动额及原因、主要对手方或资金性质、账龄或到期及受限、回收或偿付证据、对现金及授信影响展开，紧接相关表格解释；资金原因区分经营量价、结算方式切换、关联调配、理财套保及会计重分类，不把企业解释直接当成已验证因果。
  - 往来项目先按科目及对手方分别看总额、性质与变化，再核对科目间迁移及对手方集中；应收转其他应收、应付转票据、保证金与票据同时增加都不能按单个余额改善判断风险下降，未经抵销依据不将其他应收与其他应付净额化。
  - 未重点展开的用户关注科目仍简要交代余额、变化及未展开理由；有明确无余额或不适用证据则说明，无单列科目或缺附注不视为零。保持稳定的大额长期投资与其他应付款也应评价，不能只照抄样本有文字说明的科目。
  table_common:
  - 第二至第五章实际输出的每张表均须执行table_interpretation，含基础表、重点明细、合同、比率、口径桥接、政策及同业对照等补充表；按counterparty_assessment评估涉及的公司，按operating_stability归纳经营能力。不能仅有表格、来源说明和待核事项就视为解读完成。
  - 第二至第五章的section.required_assets列基础表格名称，按同章tables指引落实位置、字段与表后重点；基础表在有证据时必须呈现，不能只写概述。缺材料保留表格位置、已知数据及明确缺口，整表缺失可用具名缺口说明替代，说明影响及所需材料，不伪造空表数据。
  - 科目明细表按重点筛选结果触发展开，有已知重点而明细未提供时明确补件；表名、期间、单位和来源就地标注，数据列保留原计量精度，展示精度与核对精度分开。主要对手方数量据当前集中程度和材料确定，不固定五户或十户，长尾金额较大也解释。
  - 多期比较可采用期间分列或期间逐行，字段语义必须完整；来源只给本期明细时先列本期，并披露缺上期，不编造两期对手方对应。合计、占比、分母及未列示部分核对，前几户小计不写成全科目合计，重分类前后须追溯桥接。
  - 基础表格和重点明细属于写作及独立审阅要求，required_assets不是新增的机械表格门禁；既有required_tables仍只校验已声明的工商和股权表。内容要求没有完成不能由机械检查通过替代，判断性的选重点与原因审查也不交给金额阈值或关键词自动裁决。
  table_interpretation:
  - 每张表在来源说明之后、下一张表或下一小节之前紧接专属正文解读；跨页续表视为同一张表，解读置于完整表格之后。主表先解释总体结构和关键变化，再下钻明细，不能连续堆表后仅作全章概括；来源或口径注释不替代分析。
  - 数值表以表内可追溯的关键金额、数量、差额、占比及其分母、账期或到期区间起笔，选择真正影响本单位经营的关系展开，不逐格复述。无可比期则解释本期结构及集中度，不编造同比；政策、合同或纯文字表则锚定具体条款、交易条件或比较维度，不硬凑数字。
  - 将关键数据连接业务成因、公司能力或优势、制约及风险、对生产订单和收益现金的影响，再给出有边界的判断。成因区分已核事实、企业解释和分析假设；不能用“数据如表”“较上期变化”“需进一步核实”或换表名即可复用的段落代替论证。
  - 有证据支持的供应保障、生产交付、客户留存、定价议价、费用控制、周转回款和融资安排，应解释实现机制与实际效果；优势要落到本单位已取得的资源、订单、收益或现金，不把股东名气、合同存在、低账期或融资余额当作已实现能力。
  - 对手方表解释单户及同一集团集中、关联与非关联身份、对手方经营及履约能力、约定和实际账期、替代性与资金依赖；联系应收预付、其他往来、存货订单及票据保证金。行业与政策表说明本公司产品、客户或产线是否实际受益、能否承接需求及新增合规投入，不停留在行业描述。
  - 口径差异或缺件仅限制相关判断：先分析已有数据能确认的规模、结构、合同条件和能力，再说明差异对结论的影响、仍不能确认什么及需要哪项证据。不能以“待核实”覆盖整表，也不能为避免缺口而补造原因、订单、对手方资信或正面评价。
  - 逐表判断既保留已证实的积极因素，也说明反向信号和适用条件；没有优势证据时明确尚不能证明哪项能力，不强行凑正面结论。不能从集中直接认定不稳定，也不能从关联或长期合作直接认定供销有保障、风险低。
  - 表后发现按实际影响传至第六章风险、第八章用途及还款来源和第九章结论；第二至第五章同时回答“哪些经营基础已经成立、哪些优势具有效果、哪些约束尚在”，不能把前文写成纯风险或补件清单，再在结论突然肯定经营稳定。
  counterparty_assessment:
  - 对每张涉及公司的表，先识别重要对手方的法定主体、所属集团、与借款人的股权或控制关系及交易角色，区分直接供应商、生产厂家、贸易商、终端客户、关联销售平台、被投单位与融资机构。相近名称不合并，同一集团不同法人分别列示后，有依据才补集团集中判断。
  - 主要供应商分析单户和合计采购占比、原料来源及质量、合作与实际交货、长协或现货、供货数量和有效期、定价升贴水、付款及票证接受条件、备选供应和转换成本。说明关联或长期供货支持生产连续性的证据，同时识别集中、预付、供货中断、延期、质量争议及对单一渠道的依赖。
  - 主要客户分析销售占比、客户及终端行业构成、持续采购与复购、合同及订单有效期、确定数量、交付进度、加工费或价差、约定账期、赊销额度及实际收款。分散销售是否缓释单户波动需结合真实客户集团归属、期末应收集中、逾期与订单持续性，不能从客户数量直接推定销售稳定。
  - 往来对手方分析不止写名称：将其采购销售角色、关联身份及经营偿付资料与本项形成原因、金额占比、账龄到期、合同和期后结算相连。对子公司借款评估可得的经营现金与偿债能力；期货保证金核对资金权属及释放条件；资料不足只保留相应能力判断，不以知名或关联身份替代回收依据。
  - 对手方能力只引用本轮已核资料或已实际取得的专业记录；注册资本、股东实力、合同交易金额不能直接充当可履约产能、客户支付能力或保证。已知停供、延期、退货、客户缩单、拒收票证或诉讼等线索要解释对本公司生产交付、资金和回款的具体传导，未有证据不假定已发生。
  - 采购先付或保证金、生产及库存占用、销售赊销、实际回款与融资兑付应连接成同一业务链；区分合同约定与实际执行、年度交易流量与期末余额。存在临时电汇后退预付、票证替换或关联调配时核对重复占用与退款，不把结算方式变化当成资金压力自动消失。
  operating_stability:
  - 经营稳定性分别判断供应连续、生产交付、订单销售、盈利现金和融资周转，不用“经营稳定”一句统括。结论注明主体、产品及期间，与产销量变化、客户订单、加工费和经营现金流相互印证，不能只因持续有收入或盈利即确认稳定。
  - 订单区分历史已完成销售、框架或长协、已签确定数量订单、评价基准日在手未交付订单、意向及预算；核对有效期、数量金额、可撤销条件、排产交付及期后履行。长单存在不等于当前订单已经锁定，收入预算不等于订单，订单金额与收入成本按口径及履约期间匹配。
  - 有依据时分析订单对后续产能及存货的覆盖、主要客户续签和集中变化、供应履约及替代、设备运行和交付能力、质量验收与退货；覆盖期或比率必须有同范围分母和程序结果，缺订单或实际可用产能时仍利用已有产销与合同分析经营基础，并明确不能确认的持续期间。
  - 能力与优点沿“资源或措施、实际运作、经营效果、适用限制”论证，例如稳定供货如何支撑交付、客户复购如何支撑排产、差异化质量如何体现加工费、结算管理如何改善现金。仅有品牌、资质、设备名称或制度不能认定溢价、成本优势、议价权或控制已经有效。
  - 同时关注可持续性反向信号：供应或客户集中上升、订单取消或不足、产销回落、加工费下行、库存与应收累积、预付及保证金增加、经营现金为负和融资接续约束。解释它们是否与已识别优势矛盾及影响程度，缺原因证据不把异常自动判为主动调产、季节性或短期时点波动。
  operations_tables:
  - 主营产能产销表放二、主营产销情况，按产品、自产或受托、期间列产能、产量、销量、必要时产能利用率及产销比，并有小计或合计；本部合并、设计可用、年度中期及中间品内部耗用分别说明，只有产销量而缺产能时保留缺口，不把中间品再加工重复统计成终端销量。
  - 主营收入成本表同置二、主营产销情况，按产品业务与期间列收入、成本，有口径及程序结果时列毛利或毛利率；有分产品缺口则列已知合计并披露，不能用采购含税额充当成本或从产量自行推算收入。表后解释量价、加工费、结构及套保对应，不机械描述同涨同跌。
  - 主要供应商表和主要客户表分别放三、原料采购、产品销售情况，均列对手方、产品、采购或销售金额、占比及分母、结算方式、账期；关系及内部外部身份在表内或表后说明。将集团统采统销与市场化业务分开，长期关联账期与先款后货不能混成统一账期。
  - 供应及销售表后分别评价集中度、替代性、定价和结算依赖；关联交易带来供销保障也可能形成资金调配与回款依赖，两方面同时解释，采购现金流与销售回款联系第三章往来及第四章融资。
  - 多种产品用途、工艺或附加值有实质差异时，在一、主营业务情况用产品比较表按产业链位置、客户、竞争要素及盈利差异展开；该表为适用时补充，不能替代产销及收支基础表。
  - 主营产能产销表后具体比较产品及自产受托结构、产销增减和匹配、存货及订单覆盖，按operating_stability评价生产交付与需求持续性；主营收入成本表后比较量价、加工费、毛利和业务结构，说明已具备的盈利能力及约束，不能只写“产销回落、口径待核”。
  - 主要供应商表与主要客户表各自按counterparty_assessment逐户抓重要对象展开，引用占比及分母、账期和具体合同履行；合同条款对照表后说明条款如何影响供货保障、订单可执行性、议价及现金占用，框架合同、在手订单和已发生交易分清，不能将合同表当作已完成经营分析。
  financials_tables:
  - 资产负债表、利润表、现金流量表、财务比率表为第三章四个固定小节的基础表；原始科目按可得完整口径保留，现金流缺中期、比率缺定义等分别披露，不把比率反推的现金流补进报表。
  - 资产负债表后按materiality_selection交代重点科目及其选择依据，再按cash_focus、receivables_focus、current_accounts_focus、inventory_focus、equity_investment_focus、liabilities_focus展开明细；分析必须覆盖资金较大或变动较大项目及性质重要项目，不能逐项均匀复述所有行。
  - 入选的应收账款、预付款、其他应收及其他应付款分别用主要对手方或项目明细表，至少列对手方或项目、时点、金额及占比，能取得时补性质、关联关系、账龄到期、回收或支付条件、减值及期后证据；对手方与税费等项目混列须解释，其他应付款不能因变化不大省略。
  - 入选的货币资金按账户或存放机构、一般存款或保证金等性质、余额、受限情况、对应融资及可用性列结构表；存货按原料、在产品、产成品等列结构变动表，股权投资按被投单位列账面变动表，负债按品种及主要机构、对手方、期限等列结构和到期表，具体字段读对应focus。未知的受限、存量或期限不能用零补齐。
  - 母公司统筹套保、资金或结算导致本单位利润难以独立解释时，可在利润表小节增列相关母公司或合并层面的损益对照表，注明主体、范围、期间和单位；只解释分摊及传导，不用母公司盈利替代借款人盈利或掩盖本单位亏损与税费支出。
  - 四张基础表各自紧接分析：资产负债表说明主要资金来源与用途、资产结构及占用和偿付约束；利润表说明主业收益、费用管理、金融及非经常损益的贡献与可持续性；现金流表说明回款能力、真实投入及融资补缺；财务比率表联系实际产销、账期、回款及负债解释能力，不能只列指标或转到别章才作解读。
  - 各重点明细表及比率、口径桥接等补充表也逐表按table_interpretation分析；往来及被投单位按counterparty_assessment评价，结合第二章合同、订单、采购供货与客户执行证据解释余额。差异表既说明差异的方向及影响，也交代哪些分析仍可成立，不能只有“需核实差额”。
  financing_tables:
  - 机构授信用信两期对比表是第四章基础表，行按实际机构及合计，列至少覆盖两个时点的授信额度、已使用额度、未使用额度，注明单位、是否含财务公司、敞口或全口径、共享和低风险品种范围；无上期时列已知并说明缺口，不加二级标题。
  - 表后展开大额用信、变化较大机构与品种、财务公司余额及续期条件，补充贷款、票据、贴现、信用证和外汇衍生额度的性质及到期；总额增加不自动证明提款能力增强，品种额度与已用金额不混加。
  - 台账、报表和征信金额显著不同时追加融资口径对照表，列来源、记录及查询日、主体范围、品种、账面或敞口金额、保证金表内表外及差异解释，无法桥接的金额待核实；只说时点和口径不同不足以证明无异常，不把相近合计当完全一致，也不把信用证或外汇额度重复计入借款。
  - 机构表后用大额及变动机构的额度、已用、未用、占比及到期条件评价融资渠道分散与稳定程度，并连接采购付款、订单交付和回款周期；已获得的循环或续接支持说明落实证据与经营效果，未用且供应商不接受的品种不作为可用保障。融资口径对照表后分别判断可确认的债务结构、剩余差异及其对现金安排的影响，不能只列总额或泛称融资能力尚可。
  industry_tables:
  - 行业竞争格局表放第五章一、公司所处行业情况，字段为维度、现状、趋势、对本单位影响，并标来源及日期；核心维度按业务选供需产能、开工或利用率、集中度、产品或区域竞争、加工费或利润水平。天津样本以文字呈现、广州样本已有表格，本次按用户要求统一为基础表，缺资料逐维披露。
  - 加工费、毛利率、行业份额及同业比较须有产品、地域、年份与计算范围，不能混用不同产品、服务、工艺或业务；趋势及公司优劣须联系第二章产销和第三章收益现金，不能复制样本行业均值或未经核验的龙头份额。
  - 政策文件对照表、企业同业优势比较表按材料适用性补充在二、主要行业政策和三、企业优势及行业地位；分别列政策条款适用影响，或可比维度、公司与同业及来源，证据不足时不造同业数值，基础竞争格局表不替代具体政策与优势分析。
  - 每张行业、政策、同业或证据覆盖表后均按table_interpretation解释本公司影响：将行业需求连接已有客户及实际订单、供给竞争连接加工费与替代性、政策连接具体产品工艺和合规投入、同业维度连接有证据的质量交付或区位经营效果；按operating_stability判断公司承接需求的能力及限制，不把宏观利好直接当订单增长或只列“行业数据待补”。
  cash_focus:
  - 货币资金关注余额规模和变动，按银行及财务公司存款、票据信用证保证金、期货外汇保证金、冻结或质押等区分，说明受限依据、解除时间条件及实际可自由支配金额；保证金扩张导致存贷双高不等于自由偿债现金增加。
  - 将资金增加与应付票据、信用证、保证金比例、融资成本及到期兑付联系，核对是否循环开票或资金集中管理；同一保证金不能重复覆盖不同债务，风险敞口需有对应关系而非总额相减。
  - 交易性金融资产或理财金额大、变动大时独立说明产品、风险、期限、赎回限制、质押与资金来源，关联投资现金流及收益；不将理财等同货币资金，不默认可随时变现。货币资金与理财增加均须审查是否源于新增负债或关联方预收。
  receivables_focus:
  - 应收账款的大额余额、较大增加或减少均需下钻主要客户、关联身份、集中度、账龄、结算周期及期后回款，区分跨月尾款、实际支付、退货核销及转其他科目；余额下降不自动证明回款或信用改善。
  - 本期和对比期客户结构可得时并列分析，缺前期明细时不伪造变化；已入选重点需说明主要客户覆盖比例及其分母，长账龄、逾期、涉诉和重分类款项补合同、审计调整、减值及回收证据，不能只以客户知名或集团内往来判安全。
  current_accounts_focus:
  - 其他应收款按关联拆借、历史货款、诉讼重分类、代垫保证金、税费暂估及其他性质拆分，逐项解释对手方、形成时间、余额变动、协议用途、偿还或结算条件、账龄与减值；转出应收账款并未消除原债权风险，转入金额不等于本期新增现金支出。
  - 母公司统筹套保下的保证金代垫需核对实际资金去向、权属、合约对应、平仓及退还安排，不能把待平仓后视资金情况处理写成确定短期可回收；对子公司的借款联系第一章投资及被投单位偿付能力。
  - 其他应付款按关联垫资或代套保款、保证金、暂估税费、运输代理费用等拆分，逐项列对手方或项目、金额占比、成因、是否有息、到期和偿付安排；大额存量即使变动不大仍须展开，不将全部项目统称供应商货款或可长期无偿占用。
  - 同一关联体系的其他应收和其他应付分别列示并核对业务链、重分类与资金净流向，抵销需要法律及会计依据；企业诉讼未直接涉及借款人也可能影响其关联债权回收，风险章和还款来源审查需体现。
  inventory_focus:
  - 存货按原材料、在产品、产成品及其他结构列对比余额、变动额，取得实物资料时说明数量、单位成本或价格；联系产销、内部深加工耗用、在途及跌价，不把原料价格引起金额增加直接当实物积压，也不把余额减少直接当销售去化。
  - 核对库龄、订单覆盖、权属及受托加工材料归属、质押受限、盘点和跌价准备；套保覆盖不替代可变现性审查。存货占用连接经营现金流，价格上涨与期末备货、期后销售的解释须有记录支持。
  equity_investment_focus:
  - 长期股权投资即使多期不变，金额相对权益或可用资金较大时仍列被投单位、持股比例、核算范围及方法、期初期末账面值、增减和减值，说明收益分红、追加出资义务及退出变现限制；账面稳定不证明没有资金或损失风险。
  - 将第一章投资与第三章长期股权投资及其他应收借款联查，认缴、实缴、收购对价、账面投资和对子公司借款各自保持身份，不将子公司资产盈利并入母公司个别报表，也不将并购产能直接当借款人现金来源。
  - 材料明确无对外投资时说明适用范围与依据；报表未单列长期股权投资只能说明未单列，需核对附注及投资记录，不能填零或为套样例编造被投公司。
  liabilities_focus:
  - 负债先按短期借款、应付票据、应付账款、合同负债、其他应付款、一年内到期及长期融资扫描规模、变动、期限和偿还性质，有息负债与经营性或关联性无息负债分开，含表外及或有义务的审查范围另行说明。
  - 借款结构列机构及品种、金额、增减、利率或成本、担保、期限及到期安排，区分流贷、票据贴现和信用证融资的入账口径；外部银行与财务公司分清，不能从无长期借款推定无集中偿付压力。
  - 应付票据按开立及敞口、保证金、低风险定义和到期区间解释，联查货币资金、采购结算及第四章授信；票据结算替代应付账款不意味着总支付义务下降，低风险或无息也不等于无到期兑付压力。
  - 应付账款按主要供应商或关联方、账龄、账期和逾期列示，解释大额增减来自付款还是改为票据或其他科目；合同负债按主要客户、关联身份、预收来源、订单交付或退款义务及未来履约安排展开，不能把预收款当自有资本或永久自由现金。
  - 负债大幅上升同时资金及理财增加时解释资金来源、运用与匹配，结合自由现金、应收回款、理财可变现性、票据兑付及支持落实评价剩余压力；只凭带息负债占比下降或集团控股不能推出实质偿债风险低。
  company:
  - 围绕comprehensive_assessment，按business_adaptation、report_expression及cross_chapter_consistency成文：形成主体、形成背景、治理控制、资源与投资义务、团队管理基础的整体判断；各节先写具体已知情况再限定未决事项，不能把六节都写成合规提醒。
  - 一、工商信息必须用项目／内容两列表格呈现企业名称、统一社会信用代码、法人代表、成立日期、有效期、注册资本、实收资本、注册地址、经营范围；表头和全部单元格使用presentation.table_styles.compact统一定义的仿宋五号（10.5磅），章节内不写字体字号。缺资料保留字段并标明未提供／待核实，资本金额引用本轮事实，不从样本填充。
  - 核对主体身份、沿革、组织、股权控制链、对外投资及管理情况，关联适用的担保和关联交易。
  - 将授信事项、评价基准、材料范围及重大资料限制放入固定小节的相关正文，不新增同级章节。
  - 四、股权、股东及投资情况按三级标题“（一）股权结构”“（二）股东简介、持股情况”依次展开。股权结构必须为排名、股东名称、认缴资本（万元）、持股比例（%）四列表格，股东逐行列示并在末行列合计，合计行排名留空；完整已知数据由程序核对两项合计，来源说明放在表后，数值列只用事实／计算引用或明确缺口。
  - 股东人数、名单和资本金额均来自本轮材料，不预填参考样本。认缴资本不等同实缴资本；金额和比例可用引用精度参数保留两位小数，比例列单位为百分比，不混用小数比例与百分数；不因存在合计行就默认100.00，部分信息缺失或合计差异须披露并核实，未确认舍入规则不擅自容差放行。
  - 股东简介按本轮股权表顺序逐户以“1、股东名称……”呈现，说明有依据的持股情况、股东背景与控制关系；仅凭持股比例不推定实际控制人。成立日期、主营业务、行业地位等均须有本轮来源，用户未完成的简介句子不能凭模型补写成事实。
  - 本章定位为确认借款主体、治理与支持关系。一、工商信息核对登记与申请主体、存续状态及业务范围，不将注册或实收资本直接当作可用现金；授信事项、申请类型、评价基准及重要资料限制就地交代。
  - 二、背景情况按设立、出资、增资、收购和业务转型的时间链说明形成当前经营规模的过程，区分货币与实物出资；历史事件关联当前股权、产能及融资需求，引用近期收入利润只作规模锚点。
  - 有沿革证据时串联关键事件、资源投入、形成的业务或能力及本次资金需求；股东简介分别介绍与支持能力有关的实际业务、控制背景和合作关系，投资介绍说明被投业务、经营协同及资金义务。不止重复名称比例或泛称需支持协议，也不无依据扩写历史和股东实力。
  - 三、基本组织机构情况依据本轮组织图或制度说明董事会、经营层及生产、采购销售、财务、法务风控职责和制衡，图文有冲突保留核实；部门存在不等于内控有效，缺执行证据不评价制度已有效运行。
  - 四、股权、股东及投资情况除规定表格与逐户简介外，核对控制依据、关联关系及股东可提供的资源；支持意愿、能力、实际措施与法律担保分别表达，股东实力不等于对借款提供兜底。
  - 五、对外投资情况按被投资单位列成立日期、认缴金额及单位、持股比例、业务与层级；将并购产能、合并范围、出资义务、关联借款及担保联系起来。认缴金额、实缴金额和账面投资余额不混同，差异不能当作算错直接改写。
  - 六、法人代表及主要管理人情况执行management_profiles，逐人撰写履历，再评价管理能力与连续性；不能将有详细材料的人员合并为一段姓名及“具备相关经验”的概述。
  management_profiles:
  - 在六、法人代表及主要管理人情况内，分别为法人代表或董事长、总经理或主要经营负责人、财务负责人撰写独立履历段落，可用“1、岗位及姓名”等段首标识或适用三级标题；人员及岗位取本轮资料，不固定三个人或预填样本姓名。同一人兼任多职可合并一份履历并说明职责，其他重要人员按治理及业务实际补充，不增加固定二级标题。
  - 每份履历先写已核姓名、现职及起任时间，再写有来源的教育及专业背景、职称资格，按时间顺序列主要相关任职阶段的起止时间、任职单位与岗位，最后落到现职及当前兼任。保留与本单位实际主业、生产经营、采购销售、资金财务及风险管理相关的关键阶段，不能把多段经历压成“有多年经验”，也不强求无关早期经历、出生、民族或政治面貌等个人字段。
  - 历次任职、现职、交叉任职分别核对；履历中的“至今”限其材料时点，期后任职另标日期，不回填评价基准。同名人员、职务冲突及时间重叠须核实，不从交叉任职自动推出违规、实际控制关系或个人信用结论。
  - 在逐人履历基础上说明相关经验如何支持本公司的生产管理、市场组织或财务风控，评价团队专业互补、现职持续与近期更替、关键岗位依赖及关联审批制衡；经历提供管理基础，实际经营管理或控制有效还需经营和执行证据，不写“经验丰富、管理完善”而无履历事实和业务联系。
  - 缺某人教育、职称或任职阶段只在该人段内说明，不删除已知阶段；财务负责人资料整份未提供时保留该岗位的独立缺口段，列缺身份、任职、经历及对管理评价的影响，并继续完整写其他人的已知履历。不得以样本人员及经历补齐，不因一人缺件将全节改成待核实概述。
  operations:
  - 围绕comprehensive_assessment，按business_adaptation、report_expression及cross_chapter_consistency成文：以本单位产品或服务、盈利和履约模式统领数据解读，章末形成供给、履约、订单、收益及周转的综合判断，已证经营基础与限制同时具体交代。
  - 本章按operations_tables落实基础及适用补充表，每张表后执行table_interpretation；按counterparty_assessment和operating_stability说明上下游实际履约、订单与生产交付、盈利和现金能力及有依据的优势，不能仅凭固定标题齐全视为经营分析完成。
  - 解释主营产品、产能工艺、盈利模式、产销收支与供应商客户集中度；适用时纳入在建项目与资金安排。
  - 区分自产、来料加工、贸易等业务及产能与产量；产销表、收入成本表、供应商与客户表只使用本轮资料，有缺口则保留分析位置并说明。
  - 本章定位为解释收入利润形成机制及资金占用链。一、主营业务情况按主营产品、产能及工艺、盈利模式展开三级内容，说明规格用途、原料路线、客户应用、自产及受托加工的所有权与定价结算差异；按实际业务调整，不套用样本产品规格及收益区间。
  - 产能分本部、子公司、设计产能、已投产及实际可用口径，产量必须与相同主体产能比较；中期产量与年度产能不可直接得利用率。工艺只保留能解释产品差异、能耗成本、质量与交付能力的部分，不凭设备名称推定全球领先。
  - 盈利模式解释原料定价、销售定价、加工费或价差、成本承担、库存及套保环节如何连接；自产全额收入与受托加工费收入先核对确认口径，不以营业收入体量直接推断加工利润或资金需求。
  - 二、主营产销情况按主营产销量、主营收支展开三级内容，分别列分产品分业务的多期产量销量表及收入成本表，注明实物与金额单位；比较规模、结构及毛利变化，销量大于产量须核对期初库存、外购和统计范围，不能直接证明以销定产或无积压。
  - 收入变化按可得的量、价、加工费、业务结构证据解释，并与财务章勾稽；现货亏损与套保收益只有在对应关系、期间与会计口径有证据时才讨论抵补，不将期货盈利自动认定为稳定主业收益。
  - 有完整产销及收支时，具体指出主要业务贡献、结构迁移、数量与单位收益变化及其经营意义；同一产品与期间相匹配后再讨论加工费、制造成本、毛利和套保，区分已发生表现与未来订单保证，不能只说“有所变化、需要核实”。
  - 三、原料采购、产品销售情况按原材料采购、产品销售展开三级内容；主要供应商及客户分别列名称、产品、金额、占比、结算方式与账期，排名数量随当前材料，不预填五户。前几户占比说明分母和关联关系，客户表不用供应商表头。
  - 采购现款现货与销售赊销需连成现金占用链，结合集中度、供应替代性、客户资信、实际回款和期末应收解释风险；长期合作不直接消除供应集中风险，短合同账期不证明无逾期，含税交易表不能直接等同不含税损益表。
  - 有在建项目时在一、主营业务情况内增设三级内容，列项目、建设进度、总投资、已投入、后续需求、资金来源及到位证据，联系第三章现金流和第六章流动性；样本可能新增模块的残留提示不写入报告，账面在建工程为零也不能单独证明无在建项目。
  financials:
  - 围绕comprehensive_assessment，按business_adaptation、report_expression及cross_chapter_consistency成文：总体结构与重大变动、重点资产和债务、利润形成、现金支撑、四组能力评价依次展开，差异核验服务于业务判断，不以差异清单替代整章财务分析。
  - 本章先按financials_tables列基础四表并逐表执行table_interpretation，再按materiality_selection和六类focus落实重点选择及明细；对手方按counterparty_assessment联查真实业务能力，其他应付款与长期股权投资均为明确关注对象，不能只展开样例已写的几项资产。
  - 核对多期财务报表及口径，解释主要科目变动、盈利、营运、偿债、现金流与持续经营能力。
  - 三张报表及财务比率须注明主体、期间、币种、单位、合并范围、审计状态和来源；年度与中期数据不可直接同比，计算使用已注册且定义明确的算子或已提供可核验结果。
  - 财务比率及分析按盈利能力、营运能力、偿债能力、持续经营能力展开三级内容；缺公式或口径先披露，不臆造行业阈值。
  - 本章定位为审查资产可变现性、利润质量及还本付息的现金支撑。三张报表先列多期原始数据，再分析重要变动和风险；重大性按金额、变化幅度及偿债关联判断，不凭空设置统一阈值。
  - 资产负债表重点审查货币资金及受限比例、衍生资产负债、应收及预付、其他应收关联往来、存货、股权投资、在建工程、短期借款、应付票据及所有者权益。重大科目按期末余额、对比差额、形成原因、交易对手或性质、可回收性和偿债影响展开。
  - 应收账款、预付款及其他应收款有明细时列主要对手方、两期余额、占比、账龄或逾期、关联关系、期后回款及减值证据；分母应与对应科目一致。对子公司借款与期货保证金区分，不能都解释成正常货款；称跨月尾款或暂时占用需期后证据。
  - 资金与票据联动分析：货币资金增长先拆可自由支配与受限资金，核对票据、保证金及敞口，避免用受限保证金重复覆盖偿债。票据低风险、现金充裕、低付息压力等措辞须有定义及证据，不只根据余额判断。
  - 利润表分析收入成本及毛利、期间费用及利息净负担、减值、投资收益、公允价值变动和非经常项目对利润的贡献；区分已实现平仓与未实现估值损益，检查对套保和投资收益的依赖，连续盈利不自动证明主业造血稳定。
  - 利润分析明确收入成本或毛利、期间费用及利息、减值、投资估值等损益如何共同形成营业利润和净利润；引用已核金额、变化或程序结果解释主要贡献，不只选最终利润为正或个别金融收益。费用下降是否体现管理改善须结合业务规模、利率、余额及一次性因素；损益符号先按报表语义核对。
  - 现金流量表分别解释经营、投资、筹资流入流出及净额，核对现金增量与现金及现金等价物口径；经营净流量与利润、应收存货占用相互验证，投资收支区分真实建设投资、理财与关联借款，筹资净流入不写成经营回款。
  - 中期经营净现金流为负时审查形成原因、期后回款和债务到期匹配；缺支持不得直接定性为季节性或时点波动。现金流净额合理须有资金用途和来源的具体解释，不以年度历史为正覆盖最新恶化信号。
  - 财务比率及分析列多期指标表并按四组解释。盈利关注净资产收益率、总资产报酬率、营业收入利润率、盈余现金保障倍数及营业现金比率；营运关注总资产、流动资产、应收与存货周转和两金占比；偿债关注资产负债率、速动比率、带息负债比率、现金流动负债比率；持续经营关注收入利润增长及经营持续条件。指标按适用性与已确认口径使用，不能只抄一串比率。
  - 比率注明分子分母、平均或期末余额、利润口径、年化及期间；两金、带息负债、营业现金比率等名称不能代替定义。无上年同期不能从年度表推出中期同比，无定义的比率保留缺口；样本带来的指标需求不等于引擎已有算子或行业阈值。
  - 盈利、营运、偿债、持续经营四组文字分别选取本轮适用且可解释的代表性指标及关键数值、比较关系，连接产品收益、收付账期、期末占用和现金到期；不是列完比率后写四段无数值套话。尚未核定的指标说明提供方及解释限制，不能自动按行业阈值评价，但仍需分析其他已有可靠指标。
  financing:
  - 围绕comprehensive_assessment，按business_adaptation、report_expression及cross_chapter_consistency成文：总体融资变化、重点机构及品种、实际可用条件和到期匹配、融资能力及约束依次说明，形成对经营周转的局部结论，保持无二级标题。
  - 本章按financing_tables落实机构授信用信两期对比表和必要的融资口径对照表，每张表后执行table_interpretation并联系operating_stability评价融资对供货、订单交付和现金周转的实际支撑，保持无二级标题，突出大额及变化较大的机构品种、可用条件与支付压力。
  - 核对机构授信、用信、未用额度、债务品种、到期结构及偿付情况，区分额度与余额。
  - 核对征信查询日与评价基准日，逾期、欠息、担保及或有负债结论须有当前证据；未提供不等于不存在。
  - 本章定位为审查融资可获得性与续接压力，不新增二级标题。按融资概览、机构明细表、品种与到期结构、征信及报表差异、偿付与再融资判断的顺序组织正文。
  - 按机构列年初或上期末与评价基准的授信、已用、未用额度及合计，关联流贷、银承、信用证、保证金及敞口；额度可否循环、共享或附条件需核对，未用额度不等于无条件可提款现金，机构用信不与报表借款简单相加。
  - 征信查询日、记录覆盖日与报表日分别说明，贷款余额、银承含低风险金额、信用证、授信占用及账面应付票据逐项核对；同口径才核验已用加未用等于额度，不能消除真实超限或未知差额。
  - 说明短债集中到期、融资集中、担保限制、续授信及已有财务公司合作用信的变化，偿付记录以实际证据为准；借新还旧、逾期、欠息是否存在不能从有授信或企业信誉好推导，影响传至第六、七、八章。
  - 总授信未变时仍解释已用和未用的变动、可用空间消耗、机构进入退出及集中变化；重点机构不以“部分银行接近额度”笼统带过，应引用具体占用或条件及经营影响。已兑现的融资渠道、历史偿付和续接支持按证据评价，无法确认部分与已经成立的融资基础分别表述。
  industry:
  - 围绕comprehensive_assessment，按business_adaptation、report_expression及cross_chapter_consistency成文：先确定本单位实际细分行业和价值链位置，再说明行业变量、政策适用、竞争能力及地位证据；企业经营事实与可核行业材料分别使用，不用证据缺口表替代全部行业分析。
  - 本章按industry_tables落实行业竞争格局表及适用的政策与同业比较表，每张表后执行table_interpretation和operating_stability，把行业趋势及优势落实到本公司供销、生产交付、订单和盈利能力；行业数据只作本轮可追溯背景，不将两份样例的行业数字直接转为当前事实。
  - 按实际业务说明行业环境、适用政策与竞争位置，区分时点事实、来源观点与分析推断。
  - 行业、政策与地位引用实际执行的专业检索或本轮材料；未执行查询不能写成经查询未发现。
  - 本章定位为将外部环境转为公司利润、现金流和竞争能力的影响。一、公司所处行业情况说明产业链位置、上下游需求、供给产能、技术及产品分层、区域供需、定价与利润机制；只展开与本单位业务相关的因素，不堆宏观介绍。
  - 二、主要行业政策逐项记录文件名称、发布机构、适用版本或日期、具体条款及适用范围，核对鼓励、限制、环保能耗、安全和准入影响。与公司产品、工艺及整改证据连接，不能只因行业被鼓励就认定所有产线合规或公司必然受益。
  - 三、企业优势及行业地位按核心竞争优势、行业地位展开三级内容；将股东资源、技术产能、产品溢价、客户渠道、区位物流、质量资质与本轮经营证据连接，同时披露优势限制。
  - 行业排名、荣誉、市场份额和领先判断标明授予方或统计来源、年份、地域与产品口径；没有分母不推算份额，没有可比同业不宣称领先。股东资源优势与公司实得采购、融资支持分开，连接第六章竞争及价格风险。
  - 每项优势按资源或能力、落实方式、已发生经营效果、比较依据及适用条件解释；能确认具体供销、质量交付或区位效果而缺份额排名时，评价该项能力并限定行业地位，不将全部优势一并写成未知。内部评级、授信及定价制度归第七至八章核对，不混作第五章的行业政策。
  risks:
  - 围绕comprehensive_assessment，按business_adaptation、report_expression及cross_chapter_consistency成文：每类适用风险落到前文具体对象、关键数据或事件、传导环节、已有措施及效果、针对性建议和剩余风险，不能换公司名称后仍是一套相同风险段落。
  - 逐项关联风险证据、影响、反向证据、既有措施与有条件建议；适用的新增风险放入相关固定小节。
  - 经营与财务、偿债现金流、担保或有事项、诉讼负面事件、关联交易资金占用、控制措施及在建项目逐项判断适用性，不能因固定目录漏掉适用专题。
  - 风险程度与授信等级分开；缺规则不自行打分或判低风险，措施是否已落实以证据为准。
  - 本章定位为把前文发现转成可执行的风险策略。各事项按风险表现、证据及反向证据、传导路径、已有措施及落实程度、建议、剩余风险与待核实项展开；监测对象和复评条件须有依据，不编负责人、数值红线或完成日期。
  - 一、行业竞争、加工费下行风险关联供需、产品结构、加工费与产能利用情况，解释加工利润受压路径；优化产品、长协锁定和降本只是建议时明示，非加工业务说明标题适用限制并审查实际竞争风险。
  - 二、市场价格波动风险关联原料及销售点价、库存敞口、套保匹配、基差及保证金需求，兼顾价格变化对客户订单和现金的影响；不把已做套保或价格可传导当作无风险，也不将套保收益与现货损失无依据净抵。
  - 三、应收账款坏账风险关联赊销、集中及关联客户、账龄、逾期、减值、期后回款和周转变化，区别正常结算尾款与异常拖欠；客户分层、限额、催收、预收的现有执行及建议分别列示。
  - 四、财务与流动性风险关联杠杆、速动资产、受限资金、短债及票据到期、经营现金缺口、关联资金占用和建设资金需求；股东支持须核实可落实形式，不将战略地位写成隐性担保。
  - 对外担保或有事项、关联交易资金占用、诉讼负面事件、在建项目和控制措施须逐项审查适用性，在四类固定小节内以三级内容安置并与第七章核对；未知与不适用分别说明，同一事项不因多来源或多章提及重复计数。
  - 区分已暴露问题、潜在风险因素和证据缺口，说明影响对象及轻重依据，不能将每个缺件重复计作独立风险。措施既说明已执行安排的依据与缓释限制，也提出对应收付、履约、敞口或到期环节的动作、适用前提及核验成果，不能全部归为收集材料或无据承诺降低风险。
  credit_policy_application:
  - 第七至九章建立制度、经营事实、外部结果和审查意见的对应关系。制度先核对发布方、名称编号、生效修订日、适用成员范围及当前有效版本；空白计分表是规则，不是本公司的评分结果。标准报告仅为深度参考，其中的等级、额度、期限、信用方式和查询声明均须本轮证据支持。
  - 用户提供的客户信用评级管理办法及工业、商贸附件可作本次规则来源，具体条款见场景规格第20节。只有本轮归档版本及成员资格匹配才引用相应权重、分档和限额，不将某一企业规则变成所有机构通用阈值。制度原文、工作簿公式、外部已认定结果与样本结论冲突时分别标识，提交解释或复评，不静默选择有利版本。
  - 区分信用评级、授信等级、风险程度及贷款风险分类；只有制度明确关联时才建立映射。分别记录计分底稿、初评、审核、信贷审查委员会审定及有效期状态；已有分数和等级照实标识提供方及身份，缺审定记录不得说已批准，也不得把已有初评写成完全没有评级资料。
  - 监管流动资金贷款管理办法对经批准设立的非银行金融机构规定可参照执行；核对财务公司适用实施细则及具体产品。监管贷款期限、内部授信期限、评级有效期和单笔借款期限分别审查；评级管理办法不能代替信贷业务授信管理办法或业务议定定价文件。
  credit_scoring_review:
  - 先按实际经营性质及资金运用识别工业或商贸口径，混合业务说明选型依据并由评级流程确认。分别核对偿债、盈利、营运、经营管理、发展前景、征信六组及附加项；记录每项公式、标准分、输入期间和单位、来源定位、已给得分、扣分理由及认定状态，不把工业标准用于商贸。
  - 定量项逐项覆盖资产负债率、流动比率、净资产、已获利息倍数、经营活动净现金流量、利润总额、资产报酬率、应收账款/存货/总资产周转率。区分净利润、利润总额、营业利润与利息费用，利息费用不直接等同财务费用净额；期初期末平均、月均、单体合并及审计年度不得混用。最新中期用于预警，不能直接替换年度评分基数。
  - 对已提供评分底稿按明确公式用程序核验算术、线性扣分单位和四舍五入，分别检查百分点、比率与次数、分项合计和标准分上限；不由模型心算。零利息、零平均余额、负值、分数越界及规则空档保留待解释，未经制度明确不自行补分、截断或建立新评级算子。
  - 工业与商贸表的负债率、利息保障、资产报酬率及周转标准不同；利润总额触发资产报酬满分的条件是严格超过相应阈值。商贸贷款资产形态的标准分与最高档文字分值存在不一致时原样并列，交制度解释，不擅自改成工业取值。
  - 定性评分逐项联系前文：治理机制对应股权和实际管控，领导者素质对应履历及管理成果，管理水平对应制度执行；规划目标对应订单和资源安排，政府及股东支持对应可落实支持，成长性对应技术、产品和经营改善。信用三项分别核对贷款风险分类、到期信用偿还和利息记录，覆盖本财务公司及其他机构；不能从有制度、集团背景或无查询结果默认满分。
  - 附加股东管控分单列，核对基础分适用门槛、全资或关键三岗委派/兼任事实、完全与基本管控分支、加分上限及加分后等级上限。不得仅以持股或集团成员身份加分，不将“不超过”解释为一律加满，也不将空白附加项当作已确认零分。
  - 信用评级汇总表列六组标准分、已提供得分、附加项、总分和等级，缺明细或审定时清楚标状态并保留已有结果；详细复核链可留底稿。解释主要扣分及定性支撑，不让总分掩盖盈利薄弱、现金转差等反向证据；同比持平须有同规则上期结果。评级更新、重大经营财务困难、重大违约、虚假材料或重大诉讼触发复评的影响传至授信条件。
  working_capital_review:
  - 额度测算核对表逐版本列营运资金量、预测收入及增长依据、销售利润率及利润定义、五类周转天数和周转次数、自有资金、现有流贷、其他渠道资金、外部结果及申请比较；金额统一万元。无测算资料具名披露，不删除本章已有申请、存量及业务需求。
  - 对已提供外部测算底稿追踪原输入、单元格公式、缓存结果、解释文字和签认身份，按明确既有公式用程序核对算术；这是对来源结果的复核，不在报告引擎重建或运行授信模型。展示舍入值不作为重算输入，公式与文字说明不符、缓存缺失或错误均单独记录。
  - 监管附件的营运资金量示例连接上年收入、销售利润率、预测增长和周转次数；周转次数对应存货、应收、应付、预付、预收的现金循环。附件使用的周转天数基数与第三章实际期间财务比率分开；不把监管示例等同每家机构唯一算法，也不从示例自行推导未定义的自有资金口径。
  - 月均与期初期末均值版本并列追踪；核对票据及应收款项融资是否纳入应收、合同负债是否纳入预收、存货增长或保险系数有何业务根据、零余额替代数是否只是技术处理。版本选择须结合真实采购现付、销售赊销、季节性、价格和库存、自产与受托加工的资金承担，不自动采用能覆盖申请额的高值。
  - 预测销售增长须有预算、订单、销量价格及业务结构依据，铜价或其他原料价格上升形成的收入增量不自动代表利润或销量改善；营业利润与净利润不同，经营现金不能由收入代替。逐期核对测算自有资金对应权益、长期资金及非流动资产的实际定义，受限资金与保证金不得重复作为可用现金。
  - 新增流贷缺口、财务公司续授信总额、集团统一授信、综合授信额度、品种分项、存量余额与本次增量分别标识。现有流贷须查明是否含本财务公司存量、续作和扣除时点；如仅扣外部银行贷款，说明结果身份及避免重复融资的依据，不能把保留本公司存量的结果再全额视作可新增投放。
  - 核对其他渠道营运资金是否实际扣除及零值依据、票据和信用证的敞口与保证金、授信共享和可提款条件，不能把所有机构额度相加为可用资金，也不把同一资金重复扣除。多个版本、计划收入或融资口径冲突逐项写影响、需确认的选择及受影响方案，不用一个精确结果掩盖定义不明。
  credit_terms_tables:
  - 第八章授信要素依据表按额度、期限、担保、利率、用途、还款来源列本次申请或外部结果、审查意见、适用制度/经营依据及前提状态；无值写待确定。正文仍在六个固定小节分别解释合理性；表格不是对所有要素自动赋值的规则。
  - 期限须同时核对内部等级期限映射、授信有效期、实际贷款回款周期及监管参照要求；评级有效期届满要求更新，不等于已生效授信自动到期或自动缩短。评级更新对定价、贷后频率及授信期限的影响按具体制度，不从评级变动机械改写合同。
  - 还款方式按本轮适用监管及内部细则核对；期限超过一年的单笔流动资金贷款，在借贷双方协商基础上原则上实行本金分期偿还，审慎约定每期还本金额并与回款匹配。不能将多年授信有效期等同于单笔贷款期限或默认到期一次还本，未落实的还本结构作为方案条件。
  - 担保按适用等级的风险限额和缓释要求核对信用准入、保证资格、抵质押权属价值与落实条件；高等级不自动等于无担保。利率记录有效议定方案、适用产品及定价机制，无定价文件不能仅以“按有关规定”视为已确定。
  - 用途对应具体采购、支付对象、货物流转及合同计划，审查流贷禁限用途、关联转借与实际资金流，不能用企业承诺替代核验。按适用监管及内部规则说明受托支付、自主支付和提款条件，金额标准来自本轮有效制度，不将总授信金额当单笔支付金额。
  - 还款来源落到实际销售回款、账户归集、时间及可用于偿债的现金，结合应收逾期、存货占资、受限资金、关联往来及同期债务；分清经营现金净流量与销售收现、第一还款来源与担保支持。贷后动作针对具体风险列监测对象、触发事件及合同/制度下处理建议，不虚构已落实承诺。
  conclusion_traceability:
  - 调查结论用前六章经营和现金事实、第七章信用状态、第八章额度和条件形成同一论证链。说明经营合作基础、资金需求合理性、主要还款能力、剩余风险及意见强度；重大反向证据不能被评级释义或股东支持抵销，也不能因局部资料未定省略已有判断。
  - 授信方案逐项承接第八章，区分申请、模型结果、建议、已审定和已批准，分清维持总额与新增投放；期限、担保、利率、用途、范围、还款来源及提款/复评条件同口径。必要结果未确认时明确哪些要素待定及业务后果，不把待定方案写成无条件同意或以报告生成代替批准。
  - 审阅底稿按重要结论逐项回指制度条款、原始材料、前文段落和状态，包含支持与反向证据及条件落点；变更评分基础、资金版本或还款判断时同步复核第七、八、九章及相关风险章。正文保留影响方案的实质限制，资料核对步骤和计算细节进锚定批注。
  credit:
  - 围绕comprehensive_assessment，按business_adaptation、report_expression及cross_chapter_consistency成文：评级、征信、涉诉分别交代已取得结果、主体时效范围及本次信用审查含义；结果完整时实质解释，未取得部分单独限定，不能因本样本缺评级而默认其他单位也无正式结果。
  - 核对外部评级依据与版本、征信和涉诉状态；未取得评级或查询记录时披露，不自行评级。
  - 信用等级由既有专门流程给出；专业数据库摘要先作为线索，关键征信及涉诉事实核对原文、状态与时点。
  - 本章执行credit_policy_application及credit_scoring_review，并按实际资料列信用评级汇总表；本章定位为核对正式信用结果与履约记录。一、信用评级说明评级对象、评估机构或流程、政策版本、财报期及审计状态、评分结果、等级和有效期；有正式评分明细再列指标、标准分、得分及合计，不从样本复制权重或自行评分，较上期比较需同规则结果。
  - 二、征信情况核对报告主体、查询日期、记录期间、贷款与担保余额、逾期欠息及违约状态，并与第四章融资记录一致；只在证据覆盖范围内陈述未发现，不能从单一时点无逾期扩大成近三年无违约或资金用途合规。
  - 三、涉诉情况逐来源说明实际查询的主体标识、时间和覆盖范围，区分原被告、案由、标的、审理执行状态、是否结案及经营影响；无重大涉诉不等于没有案件，检索失败不等于无记录，商业数据库名称不构成已查询证明。
  - 正式结果齐备时说明等级、得分或分项变化及关键因素与前文经营财务是否一致，发现不一致保留解释或复评建议，不替代评级。正常履约记录同样说明支持的范围；有案件时评价金额、业务关联、结案履行及实际影响，仅有历史线索时说明目前能确认的事项与未决影响，不凭年代远或无公开结果作安全结论。
  terms:
  - 围绕comprehensive_assessment，按business_adaptation、report_expression及cross_chapter_consistency成文：六项要素各先写本次已知取值及申请、模型、建议或批准身份，再对照来源、经营必要性、合理性和约束作意见，最后写影响该要素的未决条件；不将六项都写成通用禁止事项。
  - 核对已提供的额度模型结果、等级期限依据、担保、利率、用途与还款来源，区分申请、结果、建议和批准。
  - 授信利率、担保条件、期限映射及贷款用途必须有本轮适用依据；申请金额、建议金额、模型结果和已批准金额分别表述。
  - 本章执行credit_policy_application、working_capital_review及credit_terms_tables；核对已提供外部结果及其既有公式的算术一致性，不在本项目重建或执行授信模型。
  - 本章定位为逐要素说明依据、合理性与约束。一、授信额度先列申请、存量、外部模型结果、审查建议及已批准额度各自身份；如有外部测算底稿，核对营运资金、收入增长假设、自有资金、现有贷款及其他资金的主体期间、定义和结果，复核算术不代替权威流程选择口径或重新定额。
  - 额度审查连接真实原料采购及周转需求、现有融资及可提款余额、历史履约、经营现金和限制条件，说明维持或调整建议的依据及其与模型结果的差异；集团战略或规模不能替代偿债分析，需要调整模型额度时提出转外部流程复评。
  - 二、授信期限核对正式等级、现行等级期限映射、政策上限及本次拟定期限，区分最长允许期限、实际授信期限和单笔借款期限，结合回款周期及复评条件；未取得映射不套用样本等级期限。
  - 三、担保方式审查信用、保证、抵质押等本次方案及政策资格，区分已生效担保与拟落实条件，评价覆盖范围、期限及可实现性；评级高或股东背景强不自动取得信用方式资格。
  - 四、授信利率引用本轮有效议定方案或文件的适用主体、版本及定价条件，已确定利率与执行机制分开；只写按有关规定执行而无可追溯文件时披露定价依据缺口，不自行填利率。
  - 五、借款用途对应原料采购、加工或其他真实经营支付，核对合同订单、结算及资金计划与本次申请的关系；流贷不与固定资产投资、关联转借混同，法律合规和企业资金承诺必须有本轮依据。
  - 六、还款来源将销售收入进一步落到可回收货款、回款周期、经营现金净流量和到期债务匹配；应收、受限资金、票据及关联占用约束需带入，第一还款来源与股东支持或担保分开，不把收入规模直接当偿债现金。
  - 额度必要性应串联本次用途、合同或订单周转、既有融资及合作履约、已提供外部结果与适用政策；有充分依据时形成对应审查建议并解释差异，缺权威结果只保留受影响要素，不复制样本参数补齐。还款来源应具体写回款主体、业务和时间条件、可得现金证据及同期支付约束，不能只将“销售收入”改称“销售货款”。
  conclusion:
  - 本章执行conclusion_traceability，将评级认定、测算版本、经营偿债证据和六项要素的状态共同带入意见。
  - 综合能力评价同时回答哪些经营和其他能力已见成效、优势能否持续或转化为机会、哪些潜在危险及薄弱环节值得关注、缓释和证据条件如何影响当前意见。用具体依据说明优质基础或风险关注方向，不仅归纳风险点，也不以优点数量决定企业质量。
  - 围绕comprehensive_assessment，按business_adaptation、report_expression及cross_chapter_consistency成文：综合经营基础及已证优势、用途需求、主要偿债约束、缓释与前置条件，明确当前审查意见及待复核范围，方案逐项承接第八章；不把本章写成材料缺口清单或工作流程介绍。
  - 综合审查发现、策略及重大限制，核对方案各要素与前文一致，不以报告交付替代授信审批。
  - 调查结论说明关键风险、已有措施、条件性策略和待核实项；授信方案缺任何必要结果时保留缺口，不把待复核稿写成审批生效文件。
  - 本章定位为给审查人可追溯的综合意见。一、调查结论压缩陈述主体与业务基础、需求合理性、偿债能力、关键风险和缓释、外部结果核对及重大限制，再形成有依据的提请或条件性意见；不在结论首次引入新事实，不预设同意或风险较小。
  - 二、授信方案按借款人、授信种类、授信期限、授信金额、还款来源、授信范围、担保方式逐项列示，必要时带入利率依据、用途、前置条件及监测建议；与第八章及外部结果逐项一致，缺任何依据保留待核实，不从封面申请额度自动填成方案结论。
  - 调查人、部门经理等署名只取本轮授权身份，不移植样本人员，不伪造签字或审批完成；呈报日期依本轮元信息。必要结果或政策未落实时保持待复核身份并列影响，不以配置加载或文件生成代替业务签认。
  - 已有依据及要素齐备时，按适用政策形成清楚的提请或条件性审查意见；必要结果、冲突或条件未解决时，具体说明现阶段可确认的基础、尚不能形成的决定及其条件，不能为贴近样本而自动同意，也不能用“交由流程确认”替代全部综合判断。暂缓或不授信建议须有实际风险及政策依据，不从资料不足直接推出。
  review_checklist:
  - 第七至九章专项审阅按credit_policy_application、credit_scoring_review、working_capital_review、credit_terms_tables及conclusion_traceability逐项判断：空白规则误作评级、定性默认满分、越条件加分、缺公式/缓存核对、只选高额度、漏扣其他资金或重复融资、以监管期限代内部映射、以高等级免担保、实质限制未传结论均判needs_changes；有明确缺口且意见受限才可记gap。
  - 按comprehensive_assessment核对全篇：有材料支持的经营及其他优势、改善和发展潜力是否主动挖掘，已证能力成果及其持续条件是否写清，潜在危险是否有趋势或事项及传导依据；只有风险或补件清单、仅以无负面信息充当优质依据均应退回修改。
  - 综合意见是否同时权衡能力、经营质量、机会条件和剩余风险，是否混淆资料不足与能力差、单项异常与危险公司、公司优质基础与正式评级或授信批准；不得预设优质危险标签、按正反条数打分或为平衡篇幅编造优点缺点。
  - 按business_adaptation检查全部章节：是否混入样本的公司、人员、产品工艺、产能区域、固定年份及对手方，是否将个案缺失写成默认缺失，是否因套用样本模式遗漏本单位真实业务。仅保留通用问题与方法，具体答案均能追到当前材料。
  - 按report_expression逐节检查，已知事实是否形成具体评价而非规则提醒，是否存在正文“应如何分析”取代“经材料可作何判断”、反复补件、四组比率无数值解释、定性列整列复制、内部制度放入行业政策等问题；存在时退回对应章节修改。
  - 按cross_chapter_consistency逐项回溯结论中的优势、主要风险、措施和方案值；前后主体期间及事实身份一致，积极证据和不利约束都保留，内容意见与证据充分程度相称。不把与样本相同的正面措辞、更多表格或更长篇幅当成充分性标准。
  - 第一章第六节逐人与当前人员材料核对，法人、经营及财务负责人的履历是否分开，教育专业、职称、相关任职的时间单位岗位、现职与兼任是否实质呈现；已有详细履历却只写姓名及“相关经验”，或因财务负责人缺件而省略其他人履历，内容审阅应退回修改，不以标题存在放行。
  - 对第二至第五章所有实际表格逐表记录表名或编号、对应解读位置、关键数据或条款、业务解释、能力及优势依据、风险和限制、跨章落点；含补充表且不新增报告中的检查表。任一有数据表只列数、复述升降、写来源或通用“需核实”，缺专属经营解读即退回修改，不能以全章结尾一段概括覆盖多张表。
  - 核对上下游及关联公司的身份、单户及集团占比、约定与实际账期、供货和回款履约、订单类型及交付、替代性和现金占用是否串联；有材料支持的能力或优点是否被实质分析，反向证据有无保留。只有风险/补件清单而遗漏可核实的经营基础与优势，或用股东、合同和短账期直接保证稳定，均应退回修改；无证据则限定判断，不强凑优势。
  - 逐项核对第二至第五章required_assets及同章tables指引：基础表是否呈现或具名披露缺口，重点筛选理由是否写清，触发的科目明细是否完整，表后是否解释原因及偿债含义；缺表不以几句笼统文字或机械检查通过代替。
  - 针对金额大但变动小、余额减少、同一债权重分类、应付转票据、货币资金与保证金同步扩张等情况检查漏项；其他应付款、长期股权投资、理财及合同负债的重大存量或变动不能因样例未展开或不是资产项目而遗漏。
  - 独立审阅逐章对照section.questions与对应writing_guidance，核对31个固定二级标题及无二级标题的融资章均回答业务问题；适用表格、重点科目及风险专题有证据分析或明确缺口，不能仅有通用套话。
  - 核对经营、财务、融资及征信口径差异，特别是母子公司产能、含税收入成本、认缴投资与账面投资、受限资金和票据保证金；核对年度中期可比性、比率定义、来源与数值，未知口径不能通过模型自行补齐。
  - 用负面及反向证据复核现金流合理、风险可控、股东支持、产能利用充分、回款良好等判断；经营现金流为负、利润下滑、负债增加等发现须进入风险及还款来源审查，不能在结论消失。
  - 逐项核对评级、期限、担保、利率和额度的权威来源及方案一致性，区分申请、模型结果、建议和批准；核对查询确已执行，既有措施与建议未混写，未完成业务签认未被标为已批准。
  - 本清单供宿主及独立审阅者作内容判断；现有机械校验不会自动证明原因分析、风险判断或建议充分，不得将review提交成功等同于已验证这些语义要求。
  cover:
  - 封面仅本尽调场景启用：标题按presentation.cover生成“关于{业务公司}{授信额度}综合授信调查报告”；呈报部门、客户经理未明确时均用XXXX，不移植参考样本姓名或单位。
  - 当前额度选择器application_credit_amount对应application来源的credit_amount字段，按本轮主体、事项及评价基准核验并冻结，数值与单位必须能回到原字段；完整短金额可保留单位后缀，长段申请文字不整体当数值。不自动从其他申请、外部结果或材料上传顺序选金额。
  - 标题金额仅使用本轮冻结事实，单位不明或冲突、缺失或未裁决多值时保留授信额度待核实；不以样本额度填充。呈报时间由本轮started_at按北京时间生成，不从材料日期或宿主临时填写。封面文字不能替代外部额度、评级及审批结果。
  presentation:
  - 金额数值、表头表注、图形单位及图内金额注释按presentation.amount_display同步换算；不得仅替换元为万元而保留原数值。独立审阅核对原金额、展示值和单位对应，正文达到一亿元的边界在舍入前判断，负数按绝对值同样处理。
  - 中文和数字、拉丁字符按样本主要显式设置使用仿宋，缺字体显式报错，禁止静默回退宋体或黑体。
  - 文档样式统一读取presentation.styles：封面标题仿宋一号（26磅），章标题仿宋小三（15磅），二级标题及正文仿宋四号（14磅）；工商表五号读取命名表格样式compact。章节不存字体字号，其他未指定样式保持原默认值；不宣称完整版式复刻。

  execution_quality:
  - 逐份材料保留analysis/context/excluded用途；逐页核对PDF coverage，审计附注有文本不代表主表已读取，原始图片和无文本PDF归档为未核读，不当作业务缺件或零值。OCR或转录保留原件哈希、方法和全量定位映射，缓存可读不代表已复算。
  - 同时提供净利润、营业收入及比率来源身份；百分数按乘一百复算，中期周转与ROE明确未年化及期间天数。合并附注、单体报表、平均余额和期末余额分开，不用错误周转天数或半年与全年直接比较推导严重恶化。
  - 原材料中计划收入、保证金及两个外部额度结果冲突时并列数值与定位，限定受影响判断；配置未注册授信算子不等于本轮未提供外部结果。
  - 历史开庭公告与当前诉讼状态分开；损益加总与套保有效性分开；负经营净现金流与销售收现分开；现金减单项保证金的残差与真正可提款现金分开。提出监测动作和待业务确定条件，不无据填写比例、期限、金额或天数阈值。
  - draft build返回review_requirements，真正独立审阅者逐节逐表及能力、风险、缓释、授信要素逐项提交正文定位、具体判断和本轮证据或计算引用；缺资料用gap说明影响，需修改不得记passed。不同reviewer_id只作必要身份检查，不能证明真实独立执行。
