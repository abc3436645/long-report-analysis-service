  - 调查结论说明关键风险、已有措施、条件性策略和待核实项；授信方案缺任何必要结果时保留缺口，不把待复核稿写成审批生效文件。
  - 本章定位为给审查人可追溯的综合意见。一、调查结论参考样例的连贯业务表达，以第七章信用及第八章需求和方案判断为基础，压缩说明经营、合作、资产债务和资金用途的关键依据，权衡偿债、缓释及重大限制，明确建议提请的金额、用途、期限和适用条件；风险判断与实际证据相称，既不首次引入新事实，也不以流程说明替代本次意见。
  - 二、授信方案保留七项字段及顺序：借款人、授信种类、授信期限、授信金额、还款来源、授信范围、担保方式，按“字段：值”逐行清楚列示，不强制新增表格。借款人为本轮主体全称，种类及范围取实际业务方案，期限金额及担保直接承接第八章建议，来源归纳可回收销售货款等实际还款现金；保留未知项状态和必要附加安排，不移植样例公司、十亿元、三年、综合授信或信用方式，不将拟议方案标成已批准。
  - 调查人、部门经理等署名只取本轮授权身份，不移植样本人员，不伪造签字或审批完成；呈报日期依本轮元信息。必要结果或政策未落实时保持待复核身份并列影响，不以配置加载或文件生成代替业务签认。
  - 已有依据及要素齐备时，按适用政策形成清楚的提请或条件性审查意见；必要结果、冲突或条件未解决时，具体说明现阶段可确认的基础、尚不能形成的决定及其条件，不能为贴近样本而自动同意，也不能用“交由流程确认”替代全部综合判断。暂缓或不授信建议须有实际风险及政策依据，不从资料不足直接推出。
  review_checklist:
  - 独立完成quality.decision_reviews的五项跨章审阅，逐项定位实际判断并引用本轮证据；仅记录齐备不证明内容通过。任一关键论证未闭合而正文无条件支持，或新增风控未覆盖存量风险，均判needs_changes；gap须明确意见受限的范围和业务后果。
  - 第七至九章专项审阅按credit_policy_application、credit_scoring_review、working_capital_review、credit_terms_tables及conclusion_traceability逐项判断：信用等级评定表的评级对象和审计年度缺失、四列表头或七项及合计等级行不全、缺评分材料以删表代替、示例分数等级移植、空白规则误作评级、定性默认满分、越条件加分、缺公式/缓存核对、只选高额度、漏扣其他资金或重复融资、以监管期限代内部映射、以高等级免担保、实质限制未传结论均判needs_changes；有明确缺口且意见受限才可记gap。
  - 初评来源专项核对credit_rating_sources：标准分来自适用附件，分项输入来自公司事实并有规则与确定性计算或定性评分理由，总分与等级建议执行评级办法分档及附加上限；将流贷监管办法当分值表、附加标准分并入基础变为110、规则疑义未解释而补分、无事实定性满分、初评冒充审定时退回修改。指定计分表和评级办法只有本轮适用并归档后才生效，不把历史项目公司事实带入新运行。
  - 第七章二、征信情况须以本轮报告及真实履约材料作综合总结，核对主体与来源、查询出具及覆盖时点、当前历史和未结清已结清状态、本息约定与实际履行及异常处理；只有记录摘抄而无实际信用评价、未查询却称已查询、单日无逾期扩大历史结论、已清偿掩盖过去异常、仅凭公司说明认定按期履约或遗漏正向事实时退回。与融资债务的差异及实质限制须保留，评级征信项不得由笼统“征信良好”直接默认满分。
  - 第七章三、涉诉情况须以用户材料或实际取得的平台记录作有范围的综合评价，核对主体来源、时点覆盖、案号及程序关联去重、诉讼角色、金额性质、裁判执行与实际履行，并连接经营现金及财务列报。未查却称已查、多来源或审级重复加总、诉请等同损失、被执行等同失信、结案等同履行完毕、未检出等同从无涉诉、遗漏已证回款或剩余义务、仅堆记录无影响评价时退回；重大限制及跨章影响不得仅留批注，缺材料本身不作高风险结论。
  - 第八章一、授信额度核对两步公式、本轮实际输入及确定性计算、销售利润口径、增长依据、周转与自有资金、现有贷款及其他资金扣除，检查百分比精度及主体日期。仅抄示例结果、不计算已有可算数据、缺值补零、为凑额度倒推参数、重复融资、将新增缺口当续授信总额或公式结果直接等同批准均退回；综合建议须有具体金额或明确受限范围，重点解释真实需求与现金偿债，股东产品市场及履约作用有证据，重大反向事实、额度差异和条件传至结论。
  - 第八章二至五节专项核对credit_terms_tables：等级身份、适用《信贷业务授信管理办法》的版本条款与期限上限、实际建议及回款匹配，信用方式资格或担保落实状态，业务议定方案有效内容与定价机制，用途主体业务及合同资金安排均能追溯。照填XX/N、将上限给满、仅凭高等级免担保、缺有效文件泛称利率已确定、移植样本公司原料或无据认定用途合规均退回；依据齐备仍不给具体意见、只写核查清单也须修改。
  - 第八章六、还款来源核对销售回款至可用现金、本息时间及覆盖的对应证据，正向趋势和反向约束是否共同进入判断、第二还款来源是否另核；仅凭营收盈利形容词认定还款充足、虚构公司用途或反洗钱承诺、以承诺代现金或合规证明时退回。五节方案及条件须与第七章、额度及第九章一致，重大现金缺口和未落实条件不得只留批注。
  - 第九章逐项核对第七章评级征信涉诉状态、第八章全部方案值及未决条件：调查结论有本次金额用途期限及有据提请意见，风险措辞不超过剩余风险和偿债证据；授信方案七项字段齐全、顺序及身份准确，种类范围和回款含义清楚，重要定价与前提不遗漏。仅复制样例同意低风险、从封面或测算直接定额、未知删字段、七八九章值或条件不一致、将收入当现金或建议当批准均退回；重大反向事实和实质限制须进入正文，不能通过精简清单消失。
  - 按comprehensive_assessment核对全篇：有材料支持的经营及其他优势、改善和发展潜力是否主动挖掘，已证能力成果及其持续条件是否写清，潜在危险是否有趋势或事项及传导依据；只有风险或补件清单、仅以无负面信息充当优质依据均应退回修改。
  - 综合意见是否同时权衡能力、经营质量、机会条件和剩余风险，是否混淆资料不足与能力差、单项异常与危险公司、公司优质基础与正式评级或授信批准；不得预设优质危险标签、按正反条数打分或为平衡篇幅编造优点缺点。
  - 按business_adaptation检查全部章节：是否混入样本的公司、人员、产品工艺、产能区域、固定年份及对手方，是否将个案缺失写成默认缺失，是否因套用样本模式遗漏本单位真实业务。仅保留通用问题与方法，具体答案均能追到当前材料。
  - 按report_expression逐节检查，分析小节的已知事实是否形成具体评价而非规则提醒，第一章第六节是否只按人分段写履历；检查正文“应如何分析”取代“经材料可作何判断”、反复补件、四组比率无数值解释、定性列整列复制、内部制度放入行业政策等问题；存在时退回对应章节修改。
  - 按cross_chapter_consistency逐项回溯结论中的优势、主要风险、措施和方案值；前后主体期间及事实身份一致，积极证据和不利约束都保留，内容意见与证据充分程度相称。不把与样本相同的正面措辞、更多表格或更长篇幅当成充分性标准。
  - 第一章二、背景情况逐项核对公司全称、简称、成立时间、合资性质、股东与股权结构、发展历程及最近三个完整会计年度逐年的营业收入和利润总额；只有三级标题或笼统规模描述而遗漏已知事实时退回修改，缺项须逐项说明，年度和单体／合并口径须一致。
  - 第一章三、基本组织机构情况核对主要部门是否按本轮材料简要列清；只有职责清单、内控判断或反复待核而未说明已知部门时退回修改。部门机构图为后续补充，当前不得因缺图认定本小节不完整。
  - 第一章四、股权、股东及投资情况核对股权架构是否只有规定四列表格及合计行，表后是否误加说明；股东简介是否逐户列明持股比例、识别有依据的控股股东，并分别交代全称、简称、成立时间、主营产品及可核实的行业地位。只有比例或套用样例宣传文字、以控股股东冒充实际控制人时退回修改。
  - 第一章五、对外投资情况核对四列表头、每家持股公司是否入表及表后是否按表序逐家写全称、简称、成立时间和股权构成；认缴金额与注册资本、实缴额或账面投资余额混用、持股比例口径不明、已知公司只列名称而无简介时退回修改。无投资与资料缺失须分清，不从样本补造公司。
  - 第一章第六节逐人与当前人员材料核对，法人、经营及财务负责人的履历是否分开，教育专业、职称、相关任职的时间单位岗位、现职与兼任是否实质呈现；已有详细履历却只写姓名及“相关经验”、因一人缺件省略其他人履历，或在履历之间加入评价、核查说明和总结时，内容审阅应退回修改；缺口提示应放锚定批注，不以标题存在放行。
  - 第二章一、主营业务情况按本轮已提供材料核对实际产品服务、可得的业务线收入结构、客户、收费及交付模式；行业位置、制造指标、研发技术、在建项目等只审阅有对应材料而已展开的内容，不将其逐项出现当作完整性条件。无资料侧重点出现空白标题、模板段落、例行“未提供／待核实”说明，或已有材料的重点被省略、用行业常识、样本、资质或计划代替本公司事实、以夸大形容词掩盖证据不足时退回修改。
  - 第二章二、主营产销情况核对主营产销量和主营收支是否按产品列可得近几年完整年度及当年期间数据，主体、单位、累计与分期口径是否一致；有可比数据时是否给出同比和同频相邻期环比，差额及百分比是否可核验。异常升降是否从具体数值、业务原因和反向证据追到利润、现金及持续性影响，优势和风险是否有完整证据链；仅复述升降、跨不可比期间计算比率、把企业解释当已核原因或夸大结论时退回修改。
  - 第二章三、原料采购、产品销售情况核对主要供应商表与主要客户表是否分开并分别采用各自固定六列表头，采购金额与销售金额、供应商名称与客户名称不得混用；两表后是否各有具体金额和占比解读。前五大供应商与客户占比须有完整名单及同口径分母；客户背景与舆情、关联交易、合同期限、结算账期、实际履约、替代与回款仅按材料分析，舆情线索不得直接认定违约。重叠、新增大客户、近期入股和控制权变更条款仅在有材料时分析，合同终止或异常交易不得凭猜测认定；无资料时罗列推测性风险、用长期合作直接认定稳定或夸大优势时退回修改。
  - 第三章资产负债表核对本轮可得近几年年末及最新时点的资产、负债和权益原始科目与小计合计是否完整入表，主体、时点、单位及审计口径是否明确；只摘录重点科目、以文字摘要代替完整主表或补造缺失年度时退回修改。表后须解释总量结构和资金来源用途；逐一对照本轮相关材料，货币资金、应收账款、其他应收款、其他应付款、存货、长期股权投资、负债及其他影响正常经营项目已有的相关表格均须输出并逐表深入解读，可核实的正向经营数据也须成表并解释实际效果与限制，不得因未入选重点或包含不利数据而略去。按金额大、变动大或性质重要确定分析重心；逐表核对关键数值、成因、回收或偿付、现金与经营影响的对应证据，事实、企业解释和推断分明，既不夸大也不忽略反向证据；异常及重大变化的已证事实和实质影响须在正文说明，待核原因和补件在锚定批注提示，不得只藏于批注；缺证据则限定结论，不把余额变化直接写成风险改善、经营优势或已证因果。
  - 第三章利润表核对本轮可得近几年完整年度及最新期间的原始科目、小计合计是否逐行入表，主体、起止期间、累计或单期、单位及审计口径是否明确；只摘录主要损益、跨不可比期间计算同比环比或用分析摘要代替主表时退回。小计、营业利润至净利润及财务费用构成须核对，无法调平的差额列疑点；收入确认、毛利成本、费用资本化及代付、减值、投资估值、所得税等异常须有对应资料和有边界的解释。逐项核对历史趋势、收入占比、可比同行及与应收存货、经营现金的联动，不能将线索直接写成舞弊或优势；疑点底稿有追问、资料和可核调整金额或无法量化说明，影响意见的实质限制进入正文。
  - 第三章现金流量表核对本轮可得近几年完整年度及最新期间的经营、投资、筹资各原始项目、小计净额与现金期初期末是否完整入表，主体、期间、累计或单期、单位及审计口径是否明确；仅列三类净额、以利润或余额反推补表、跨不可比期间算同比环比时退回。逐项核对报表内部勾稽、现金等价物与货币资金差异；对重大异常和变化检查原值差额、来源及形成机制，并与利润、往来、存货、投资和债务到期相互印证。正向与负向经营信号、实质限制及授信影响均有证据且进入正文；建议有一条主方向、适用前提和可观察结果，不因格式完整或历史为正放过最新恶化，也不把待核原因或建议写成事实。
  - 第三章财务比率及分析核对财务比率表是否按financial_ratio_rows列齐四组16项、实际期间列及每项的数值或具名状态，示例年份与数值不得移植；名称相同但公式、单位、平均余额、范围或年化不同的值须桥接，不能直接比较。四组均须紧接表格用本轮数值解释盈利质量、资金周转、到期偿付及持续条件，并核对有证据的外部环境传导；只复述升降、无来源套行业阈值、忽略反向信号或把市场变化当作公司已证原因时退回修改。无法核定公式的项目保留缺口并限制结论，不以机械表格覆盖冒充业务分析充分。
  - 第四章按本轮原始资料逐一核对近几年各年末和最新时点的全部机构是否入表，授信、已用、未用、合计及来源口径是否明确，历史退出机构与缺期资料是否保留；仅列两期或主要银行而漏掉已有历史及其他机构时退回。授信有效期和单笔债务期限分清，共享额度、保证金及实际提款条件不重复或遗漏；表后围绕主要融资渠道、使用和到期变化，联系经营现金与债务说明支持和限制。无证据夸大融资能力、把未用额度当现金或未落实续贷当已获支持时退回，重大异常及意见限制不能只放批注。
  - 第五章逐项核对主营产品及实际营运、行业阶段、市场行情、上下游、竞争替代和产业协同是否有对应证据及公司影响；国家政策、发展规划和当地政府政策是否核实有效版本、地域对象、条款与落实条件。阶段、排名份额、领先或协同效果无可比依据，或把规划、申报条件、同属集团直接写成已兑现支持时退回；表后须联系订单、成本、利润现金和合规投入作有侧重的分析，正反信号及重大限制不能遗漏。
  - 第六章核对动态小节是否由原始资料和前文已核发现归纳，排序是否突出关键实际风险，七要素是否齐全；每项的证据、量化方法、可能性及等级依据、措施责任节点与触发验收、现有与拟议缓释后的剩余暴露须可追溯。套用固定类别凑标题、无依据评级、拟议措施冒充已落实或借批注隐去重大限制时退回；不得用模板齐全代替评价充分。
  - 对第二至第五章所有实际表格逐表记录表名或编号、对应解读位置、关键数据或条款、业务解释、能力及优势依据、风险和限制、跨章落点；含补充表且不新增报告中的检查表。任一有数据表只列数、复述升降、写来源或通用“需核实”，缺专属经营解读即退回修改，不能以全章结尾一段概括覆盖多张表。
  - 核对上下游及关联公司的身份、单户及集团占比、约定与实际账期、供货和回款履约、订单类型及交付、替代性和现金占用是否串联；有材料支持的能力或优点是否被实质分析，反向证据有无保留。只有风险/补件清单而遗漏可核实的经营基础与优势，或用股东、合同和短账期直接保证稳定，均应退回修改；无证据则限定判断，不强凑优势。
  - 逐项核对第二至第五章required_assets及同章tables指引：基础表是否呈现或具名披露缺口，重点筛选理由是否写清，触发的科目明细是否完整，表后是否解释原因及偿债含义；缺表不以几句笼统文字或机械检查通过代替。
  - 针对金额大但变动小、余额减少、同一债权重分类、应付转票据、货币资金与保证金同步扩张等情况检查漏项；其他应付款、长期股权投资、理财及合同负债的重大存量或变动不能因样例未展开或不是资产项目而遗漏。
  - 独立审阅逐章对照section.questions与对应writing_guidance，核对27个固定二级标题、第六章动态风险小节及无二级标题的融资章均回答业务问题；适用表格、重点科目及风险专题有证据分析或明确缺口，不能仅有通用套话。
  - 核对经营、财务、融资及征信口径差异，特别是母子公司产能、含税收入成本、认缴投资与账面投资、受限资金和票据保证金；核对年度中期可比性、比率定义、来源与数值，未知口径不能通过模型自行补齐。
  - 用负面及反向证据复核现金流合理、风险可控、股东支持、产能利用充分、回款良好等判断；经营现金流为负、利润下滑、负债增加等发现须进入风险及还款来源审查，不能在结论消失。
  - 逐项核对评级、期限、担保、利率和额度的权威来源及方案一致性，区分申请、模型结果、建议和批准；核对查询确已执行，既有措施与建议未混写，未完成业务签认未被标为已批准。
  - 本清单供宿主及独立审阅者作内容判断；现有机械校验不会自动证明原因分析、风险判断或建议充分，不得将review提交成功等同于已验证这些语义要求。
  cover:
  - 封面仅本尽调场景启用：标题按presentation.cover生成“关于{业务公司}{授信额度}综合授信调查报告”；呈报部门、客户经理未明确时均用XXXX，不移植参考样本姓名或单位。
  - 当前额度选择器application_credit_amount对应application来源的credit_amount字段，按本轮主体、事项及评价基准核验并冻结，数值与单位必须能回到原字段；完整短金额可保留单位后缀，长段申请文字不整体当数值。不自动从其他申请、外部结果或材料上传顺序选金额。
  - 标题金额仅使用本轮冻结事实，单位不明或冲突、缺失或未裁决多值时保留授信额度待核实；不以样本额度填充。呈报时间由本轮started_at按北京时间生成，不从材料日期或宿主临时填写。封面文字不能替代外部额度、评级及审批结果。
  presentation:
  - 金额数值、表头表注、图形单位及图内金额注释按presentation.amount_display同步换算；不得仅替换元为万元而保留原数值。独立审阅核对原金额、展示值和单位对应，正文达到一亿元的边界在舍入前判断，负数按绝对值同样处理。
  - 中文和数字、拉丁字符按presentation使用仿宋；主字体缺失时只按font_alternatives采用已授权的仿宋-简并记录，均缺则报错，禁止静默回退宋体或黑体。
  - 文档样式统一读取presentation.styles：封面标题仿宋一号（26磅），章标题仿宋小三（15磅），二级标题及正文仿宋四号（14磅）；工商表五号读取命名表格样式compact。章节不存字体字号，其他未指定样式保持原默认值；不宣称完整版式复刻。

  execution_quality:
  - draft context的upstream_sections提供当前运行已提交的直接依赖正文和哈希，先读其实际判断与条件再写本章；状态未提交或body为空时不视作已完成。quality启用require_dependency_fingerprint时，有依赖章节的draft submit须原样携带本次context的dependency_fingerprint，过期后重新读取和核对，不从其他运行或历史稿补填。上游替换造成的下游失效须按依赖重写并重新build审阅，显式锁定及无关章节保留。
  - 逐份材料保留analysis/context/excluded用途；逐页核对PDF coverage，审计附注有文本不代表主表已读取，原始图片和无文本PDF归档为未核读，不当作业务缺件或零值。OCR或转录保留原件哈希、方法和全量定位映射，缓存可读不代表已复算。
  - 同时提供净利润、营业收入及比率来源身份；先核实原值是小数比例还是百分数点值，再按明确单位换算，已返回unit=%的计算值不再乘百。中期周转与ROE明确未年化及期间天数；合并附注、单体报表、平均余额和期末余额分开，不用错误周转天数或半年与全年直接比较推导严重恶化。
  - 原材料中计划收入、保证金及两个外部额度结果冲突时并列数值与定位，限定受影响判断；配置未注册授信算子不等于本轮未提供外部结果。
  - 历史开庭公告与当前诉讼状态分开；损益加总与套保有效性分开；负经营净现金流与销售收现分开；现金减单项保证金的残差与真正可提款现金分开。提出监测动作和待业务确定条件，不无据填写比例、期限、金额或天数阈值。
  - draft build返回review_requirements，逐章criteria由quality.chapter_review_guidance引用本轮冻结writing_guidance，与写作要求保持同源；真正独立审阅者逐节逐表及能力、风险、缓释、授信要素核对适用要点，提交正文定位、具体判断和本轮证据或计算引用。缺资料用gap说明影响，需修改不得记passed；不同reviewer_id只作必要身份检查，不能证明真实独立执行，提交成功也不证明业务充分性已验收。
