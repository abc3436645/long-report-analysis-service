sections: []
planning_guidance:
  - 按本轮用户需求、已上传材料和可确认的单位范围生成章节；章节依赖在本轮计划中声明。
  - 建项前从用户要求与本轮主表确认应覆盖单位、板块合计和独立专项；逐份材料说明用于分析、仅作背景或排除的原因，计划与交付均核对去向。
  - 逐单位章节覆盖项目范围内全部单位；成本、铜精矿、硫精矿等主题只在本轮该单位有相应证据时触发，来源无可比数值时明确缺口。
  - 预算办月度分析按当月、累计同比、累计序时计划、年度目标分清期间与口径。
  - 有利润数据的独立单位逐户写经营综述、利润比较表、经营指标表或数据缺口表；有可比值时附该单位自身的图。
  - 集团合并行、板块合计、所属单位和专项表保持独立，不机械相加或重复归因。
  - 原因、风险和建议必须区分已证事实、待核假设与行动条件。
  - 预算办完整月报可参考管理摘要、资料范围、整体经营、逐单位经营、独立专项、共性问题、市场与情景、决策、来源口径的职责链；仅按本轮目标和材料实例化，不预置九章或固定单位名单。
  - 每个单位的内部顺序按经营综述、利润表、单位图、变化分析、经营指标表、管理关注与人工确认；没有月度或产品数据时保留明确缺口，不缩成泛泛结论。
