unit_levels: {贵冶: 3, 贸易事业部: 3, 铜业铜材: 3, 集团铜材: 3, 江铜龙昌: 3, 江铜台意: 3, 华东铜材: 3, 华东电工: 3, 江铜嘉磁: 3, 江铜川禾: 3}
sections:
  - id: scope
    title: 报告口径与资料范围
    display_order: 1
    repeat_for: null
    goal: 交代报告期、材料覆盖、预算版本、合并范围与分析限制
    questions: [哪些口径已确认，哪些仍需人工确认]
    evidence_refs: [actual_amount, budget_amount]
    analysis_refs: []
    required_assets: []
    depends_on: []
  - id: units
    title: 各单位经营分析
    display_order: 2
    repeat_for: unit
    goal: 按本项目单位范围逐户分析表现、原因、问题和建议
    questions: [每户结论有何来源和同口径计算支持]
    evidence_refs: [actual_amount, budget_amount]
    analysis_refs: [budget_difference, performance_review]
    required_assets: []
    depends_on: [scope]
  - id: special
    title: 专项来源的独立口径
    display_order: 3
    repeat_for: null
    goal: 单列不能直接归入单位的专项资料与局部口径
    questions: [专项数字是否被误并入单位或集团结果]
    evidence_refs: [actual_amount, budget_amount]
    analysis_refs: [performance_review]
    required_assets: []
    depends_on: [scope]
  - id: group
    title: 整体经营与共同关注事项
    display_order: 4
    repeat_for: null
    goal: 汇总已有的单位和专项发现，区分集团合并与单位汇总
    questions: [共同问题、原因假设和待核实项如何区分]
    evidence_refs: [actual_amount, budget_amount]
    analysis_refs: [budget_difference, performance_review]
    required_assets: []
    depends_on: [units, special]
  - id: market
    title: 市场关联及情景测算
    display_order: 5
    repeat_for: null
    goal: 说明市场资料适用范围及有依据的敏感性情景
    questions: [情景假设是否被写成已发生事实]
    evidence_refs: []
    analysis_refs: [performance_review]
    required_assets: []
    depends_on: [scope]
  - id: actions
    title: 建议事项与人工确认
    display_order: 6
    repeat_for: null
    goal: 给出逐户复核、协同方向、需确认口径和补件清单
    questions: [建议对应哪些依据、影响及适用条件]
    evidence_refs: []
    analysis_refs: [performance_review]
    required_assets: []
    depends_on: [group, market]
  - id: sources
    title: 来源索引与计算口径
    display_order: 7
    repeat_for: null
    goal: 列明来源、定位、计算定义、材料缺口和保留的模板差异
    questions: [读者能否回到原件复核数字和限制]
    evidence_refs: [actual_amount, budget_amount]
    analysis_refs: [budget_difference]
    required_assets: []
    depends_on: [units, special, group, market, actions]
