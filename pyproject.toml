[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "long-report-agent"
version = "0.1.0"
description = "CLI and scenario contracts for long-form analysis reports"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
report = "long_report.adapters.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/long_report"]

[tool.hatch.build.targets.wheel.force-include]
"scenarios" = "long_report/scenarios"
