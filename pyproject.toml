[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "long-report-agent"
version = "0.2.0"
description = "CLI and scenario contracts for long-form analysis reports"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0,<7",
    "openpyxl>=3.1,<4",
    "xlrd>=2,<3",
    "python-docx>=1.2,<2",
    "pypdf>=5,<7",
    "Pillow>=11,<14",
    "pytest>=9.1.1",
    "pdf-inspector>=1.25.2",
    "somark>=0.1.0",
    "httpx>=0.28,<1",
    "loguru>=0.7.3",
]

[project.scripts]
report = "long_report.adapters.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/long_report"]

[tool.hatch.build.targets.wheel.force-include]
"scenarios" = "long_report/scenarios"

[tool.hatch.build.targets.sdist]
exclude = ["/.scratch", "/data", "/results", "/projects"]
